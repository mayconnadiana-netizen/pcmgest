      ${AUTH.isAdmin()?`<div class="sb-item" onclick="APP.module='admin';render()" style="border-radius:6px"><span>👥</span><span style="font-size:11px">Usuários</span></div>`:''}
      <div style="font-size:10px;color:var(--muted);margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(AUTH.current()?.name||AUTH.current()?.email||'')}</div>
    </div>
  </div>

function libNodes(){return DB.get('libTree')}
function libPath(nodeId){const nodes=libNodes();const path=[];let cur=nodeId;while(cur){const n=nodes.find(x=>x.id===cur);if(!n)break;path.unshift(n);cur=n.parentId}return path}
function libCountChildren(id){const nodes=libNodes();let c=0;function r(fid){nodes.filter(n=>n.parentId===fid).forEach(n=>{c++;if(n.type==='folder')r(n.id)})}r(id);return c}
function libSelectFolder(id){APP.libSelected=(id===null||id==='null')?null:id;APP.page='files';render()}
function libToggleFolder(id){if(!APP.libOpenFolders)APP.libOpenFolders={};
NET.init();APP.libOpenFolders[id]=!APP.libOpenFolders[id];render()}

function buildLibTree(){
  const nodes=libNodes();
  function renderFolder(parentId,depth){
    return nodes.filter(n=>n.type==='folder'&&n.parentId===(parentId||null)).map(f=>{
      const isOpen=APP.libOpenFolders[f.id],isSel=APP.libSelected===f.id;
      const childFolders=nodes.filter(n=>n.type==='folder'&&n.parentId===f.id).length;
      const total=nodes.filter(n=>n.parentId===f.id).length;
      return`<div>
        <div class="tree-item ${isSel?'selected':''}" style="padding-left:${12+depth*14}px" onclick="libSelectFolder('${f.id}')">
          <span class="toggle ${isOpen?'open':''}" onclick="event.stopPropagation();libToggleFolder('${f.id}')">${childFolders?'▶':''}</span>
          <span class="ico">${isOpen?'📂':'📁'}</span><span class="lbl">${esc(f.name)}</span>
          ${total?`<span class="cnt">${total}</span>`:''}
        </div>
        ${isOpen?`<div>${renderFolder(f.id,depth+1)}</div>`:''}
      </div>`;
    }).join('');
  }
  return`<div class="lib-tree">
    <div class="tree-item ${!APP.libSelected?'selected':''}" style="padding-left:12px" onclick="libSelectFolder(null)">
      <span class="toggle"></span><span class="ico">🏠</span><span class="lbl">Raiz</span>
    </div>${renderFolder(null,0)}
  </div>`}

async function libCreateFolder(parentId){
  const name=qval('fn');if(!name)return toast('Digite um nome.','err');
  const pid=(parentId===null||parentId==='null')?null:parentId;
  const nodes=libNodes();
  if(nodes.some(n=>n.type==='folder'&&n.parentId===pid&&n.name.toLowerCase()===name.toLowerCase()))return toast('Pasta já existe.','err');
  const node={id:uid(),name,type:'folder',parentId:pid,createdAt:new Date().toISOString()};
  nodes.push(node);LOCAL.set('libTree',nodes);FB.set('libTree',node.id,node);
  if(pid)APP.libOpenFolders[pid]=true;
  closeModal();toast('Pasta criada!');render();
}

function openRenameFolderModal(id){
  const f=libNodes().find(n=>n.id===id);
  openModal(`<div class="modal fp"><div class="mtitle p">✏ Renomear</div>
    <div class="frow"><div><label>Novo Nome *</label><input id="fn" value="${esc(f?.name||'')}"/></div></div>
    <div class="mfoot"><button class="btn btn-gh" onclick="closeModal()">Cancelar</button><button class="btn btn-p" onclick="libRenameFolder('${id}')">Salvar</button></div>
  </div>`);setTimeout(()=>qid('fn')?.select(),50);
}

async function libRenameFolder(id){
  const name=qval('fn');if(!name)return toast('Digite um nome.','err');
  const nodes=libNodes();const i=nodes.findIndex(n=>n.id===id);
  if(i>=0){nodes[i].name=name;LOCAL.set('libTree',nodes);FB.set('libTree',id,nodes[i]);}
  closeModal();toast('Renomeada!');render();
}

async function libDelFolder(id){
  const count=libCountChildren(id);
  if(count>0&&!await customConfirm({title:'Excluir Pasta',msg:`Esta pasta contém ${count} item(s). Tudo será excluído.`,icon:'📁',confirmLabel:'Excluir tudo',type:'danger'}))return;
  const nodes=libNodes();const toDelete=[];
  function collect(fid){nodes.filter(n=>n.parentId===fid).forEach(n=>{toDelete.push(n.id);if(n.type==='folder')collect(n.id)});}
  collect(id);toDelete.push(id);
  const deletingNodes=nodes.filter(n=>toDelete.includes(n.id));
  for(const n of deletingNodes){ if(n.type==='file') await libDeleteStoredFile(n); }
  LOCAL.set('libTree',nodes.filter(n=>!toDelete.includes(n.id)));
  for(const did of toDelete) await FB.delete('libTree',did);
  if(APP.libSelected===id)APP.libSelected=null;
  toast('Excluída.');render();
}

function openUploadModal(parentId){
  const pid=(parentId===null||parentId==='null')?null:parentId;

    ${folder?`<div class="infobox" style="font-size:12px">Para: <strong>📁 ${esc(folder.name)}</strong></div>`:'<div class="infobox" style="font-size:12px">Para a <strong>raiz</strong></div>'}

const LIB_FILE_CHUNK_SIZE = 600000; // ~600 KB por documento, abaixo do limite de 1 MiB do Firestore
const LIB_MAX_FILE_SIZE = 20 * 1024 * 1024; // 20 MB por arquivo

function libChunkId(fileId,index){ return `${fileId}_${String(index).padStart(5,'0')}`; }

async function libStoreFileData(fileId,dataUrl){
  const chunks=[];
  for(let i=0;i<dataUrl.length;i+=LIB_FILE_CHUNK_SIZE) chunks.push(dataUrl.slice(i,i+LIB_FILE_CHUNK_SIZE));
  for(let i=0;i<chunks.length;i++){
    const ok=await FB.set('libFileChunks',libChunkId(fileId,i),{fileId,index:i,data:chunks[i]});
    if(!ok) throw new Error(`Falha ao enviar bloco ${i+1}/${chunks.length}`);
  }
  return chunks.length;
}

async function libLoadFileData(file){
  if(file.data) return file.data; // compatibilidade com arquivos antigos deste navegador
  const count=Number(file.chunkCount||0);
  if(!count) return null;
  const parts=[];
  for(let i=0;i<count;i++){
    const chunk=await FB.get('libFileChunks',libChunkId(file.id,i));
    if(!chunk || typeof chunk.data!=='string') throw new Error(`Bloco ${i+1} não encontrado`);
    parts.push(chunk.data);
  }
  return parts.join('');
}

async function libDeleteStoredFile(file){
  const count=Number(file?.chunkCount||0);
  for(let i=0;i<count;i++) await FB.delete('libFileChunks',libChunkId(file.id,i));
}

function libHandleFiles(fileList,parentId){
  const pid=(parentId===null||parentId==='null')?null:parentId;
  const desc=qval('fdesc');
  const files=Array.from(fileList);
  files.forEach(file=>{
    if(file.size > LIB_MAX_FILE_SIZE){
      toast(`"${file.name}" excede o limite de 20 MB.`,'err');
      return;
    }
    const reader=new FileReader();
    reader.onerror=()=>toast(`Erro ao ler "${file.name}".`,'err');
    reader.onload=async e=>{
      const nodeId=uid();
      try{
        const ext=file.name.split('.').pop().toLowerCase();
        toast(`Enviando ${file.name} para o banco de dados...`,'info');
        const chunkCount=await libStoreFileData(nodeId,e.target.result);
        const node={
          id:nodeId,name:file.name,type:'file',parentId:pid,size:file.size,
          uploadedAt:new Date().toISOString(),desc:desc||'',ext,mimeType:file.type||'',
          chunkCount,storage:'firestore-chunks',cloud:true
        };
        const ok=await FB.set('libTree',node.id,node);
        if(!ok) throw new Error('Não foi possível gravar os metadados do arquivo');
        const fresh=libNodes();fresh.push(node);LOCAL.set('libTree',fresh);
        if(pid)APP.libOpenFolders[pid]=true;
        const prev=document.getElementById('upload-preview');
        if(prev){
          const icon=fileIcon(ext);
          const size=file.size<1024?file.size+'B':file.size<1024*1024?(file.size/1024).toFixed(0)+'KB':(file.size/1024/1024).toFixed(1)+'MB';
          prev.innerHTML=`<div class="infobox" style="margin-top:8px;font-size:12px;color:var(--green)">✓ ${icon} ${esc(file.name)} (${size}) salvo no banco de dados · ${chunkCount} bloco(s)</div>`;
        }
        toast(`${file.name} salvo na nuvem!`,'ok');render();
      }catch(err){
        console.error('libHandleFiles cloud error:',err);
        const temp={id:nodeId,chunkCount:Math.ceil((e.target.result?.length||0)/LIB_FILE_CHUNK_SIZE)};
        await libDeleteStoredFile(temp);
        toast(`Erro ao salvar "${file.name}" no banco: ${err.message||'tente novamente'}`,'err');
      }
    };
    reader.readAsDataURL(file);
  });
}

async function libGetFileData(id){
  let f=libNodes().find(n=>n.id===id);
  if(!f) return null;
  // atualiza metadados pela nuvem para outro computador / cache antigo
  const remote=await FB.get('libTree',id);
  if(remote){ f={...f,...remote}; LOCAL.upsert('libTree',f); }
  const data=await libLoadFileData(f);
  return data?{file:f,data}:null;
}

async function libDownload(id){
  toast('Buscando arquivo no banco de dados...','info');
  try{
    const pack=await libGetFileData(id);
    if(!pack) return toast('Arquivo sem conteúdo no banco de dados. Reenvie o arquivo.','err');
    const a=document.createElement('a');a.href=pack.data;a.download=pack.file.name;document.body.appendChild(a);a.click();a.remove();
    toast('Download: '+pack.file.name,'ok');
  }catch(err){ console.error(err);toast('Erro ao baixar arquivo do banco de dados.','err'); }
}

async function libOpenFile(id){
  toast('Abrindo arquivo...','info');
  try{
    const pack=await libGetFileData(id);
    if(!pack) return toast('Arquivo sem conteúdo no banco de dados.','err');
    const r=await fetch(pack.data);const blob=await r.blob();const url=URL.createObjectURL(blob);
    const ext=(pack.file.ext||'').toLowerCase();
    if(['pdf','png','jpg','jpeg','gif','webp','txt','csv','html'].includes(ext)){
      const w=window.open(url,'_blank');
      if(!w) toast('Permita pop-ups para abrir o arquivo.','warn');
      setTimeout(()=>URL.revokeObjectURL(url),60000);
    }else{
      const a=document.createElement('a');a.href=url;a.download=pack.file.name;document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),5000);
      toast('Arquivo baixado para abrir no aplicativo correspondente.','ok');
    }
  }catch(err){ console.error(err);toast('Erro ao abrir arquivo.','err'); }
}

(async()=>{
  // Mostra tela de loading enquanto busca dados
  document.getElementById('root').innerHTML=`
    <div style="height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);gap:16px">
      <div style="font-family:var(--disp);font-size:48px;letter-spacing:2px">PCM <span style="color:var(--gold)">GEST</span></div>
      <div style="display:flex;align-items:center;gap:10px;color:var(--muted2);font-size:13px">
        <div style="width:16px;height:16px;border:2px solid var(--gold);border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite"></div>
        Carregando dados...
      </div>
    </div>`;

  // Tenta sincronizar Firebase com timeout de 6s
  const syncP = DB.syncAll();
  try{
    const total=await Promise.race([
      syncP,
      new Promise((_,r)=>setTimeout(()=>r('timeout'),6000))
    ]);
    if(typeof total==='number' && total>0){
      console.log(`Firebase: ${total} registros carregados`);
    } else {
      seedFallback();
    }
  }catch(e){
    seedFallback();
    syncP.then(t=>{ if(typeof t==='number' && t>0) render(); }).catch(()=>{});
  }

  // Renderiza agora com os dados corretos
  render();
})();

// ---- persistência (reusa a infra do PCMgest, sem o filtro por unidade do DB) ----
function lubGetAll(k){return LOCAL.get(k);}
function lubSave(k,obj){
  LOCAL.upsert(k,obj);
  if(NET.isOnline()){FB.set(k,obj.id,obj).then(ok=>{if(!ok){QUEUE.add({type:'set',col:k,id:obj.id,data:obj});NET.updateBar();}});}
  else{QUEUE.add({type:'set',col:k,id:obj.id,data:obj});NET.updateBar();}
}
function lubDel(k,id){
  LOCAL.remove(k,id);
  if(NET.isOnline()){FB.delete(k,id).then(ok=>{if(!ok){QUEUE.add({type:'delete',col:k,id});NET.updateBar();}});}
  else{QUEUE.add({type:'delete',col:k,id});NET.updateBar();}
}

// ---- datas / util ----
function lubNum(v){if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null;}
function lubFmt(n,d){return n==null?'—':n.toLocaleString('pt-BR',{minimumFractionDigits:d||0,maximumFractionDigits:d||0});}
function isoWeek(dt){const t=new Date(Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const ys=new Date(Date.UTC(t.getUTCFullYear(),0,1));const wk=Math.ceil(((t-ys)/86400000+1)/7);return t.getUTCFullYear()+'-W'+String(wk).padStart(2,'0');}
function lubWeekRange(iso){const p=iso.split('-W');const y=+p[0],w=+p[1];const simple=new Date(Date.UTC(y,0,1+(w-1)*7));const dow=simple.getUTCDay()||7;const mon=new Date(simple);mon.setUTCDate(simple.getUTCDate()-dow+1);const sun=new Date(mon);sun.setUTCDate(mon.getUTCDate()+5);const f=d=>String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0');return f(mon)+' a '+f(sun)+'/'+y;}
function lubShiftWeek(iso,delta){const p=iso.split('-W');const y=+p[0],w=+p[1];const d=new Date(Date.UTC(y,0,1+(w-1)*7));d.setUTCDate(d.getUTCDate()+delta*7);return isoWeek(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()));}
function lubTodayDow(){const g=new Date().getDay();return g===0?5:Math.min(g-1,5);}

// ---- métricas ----
function lubAder(rec,arq){if(!rec)return null;let apl=0,fei=0;LUB_PONTOS[arq].forEach(p=>{if(p[5]!=='l')return;const st=(rec.pontos&&rec.pontos[p[0]])||{};LUB_DIAS.forEach(d=>{const v=st[d[0]];if(v==='NA')return;apl++;if(v==='C')fei++;});});return apl?Math.round(fei/apl*100):null;}
function lubBicos(rec){if(!rec||!rec.pontos)return 0;let x=0;Object.values(rec.pontos).forEach(st=>LUB_DIAS.forEach(d=>{if(st[d[0]]==='X')x++;}));return x;}
function lubHoras(rec){if(!rec)return null;const a=lubNum(rec.horimetroIni),b=lubNum(rec.horimetroFim);return(a!=null&&b!=null&&b>a)?b-a:null;}
function lubGraxa(rec){if(!rec)return null;return(lubNum(rec.graxaGX01)||0)+(lubNum(rec.graxaGX02)||0);}
function lubCons(rec){const h=lubHoras(rec),g=lubGraxa(rec);return(h&&g!=null)?g/h*1000:null;}
function lubExecId(pat,wk){return pat+'__'+wk;}
function lubExecOf(pat,wk){return lubGetAll('lubExec').find(r=>r.id===lubExecId(pat,wk))||null;}
function lubBandas(){const fam={};lubGetAll('lubExec').forEach(r=>{const m=lubGetAll('lubFrota').find(x=>x.id===r.patrimonio);if(!m)return;const c=lubCons(r);if(c==null)return;(fam[m.familia]=fam[m.familia]||[]).push(c);});const out={};Object.keys(fam).forEach(f=>{const a=fam[f];if(a.length<3){out[f]={base:false};return;}a.sort((x,y)=>x-y);const med=a[Math.floor(a.length/2)];out[f]={base:true,med:med,lo:med*0.8,hi:med*1.2};});return out;}

// escopo por unidade
function lubMaqsUnidade(){return lubGetAll('lubFrota').filter(m=>m.unidade===APP.unidade);}
function lubMaqsSemUnidade(){return lubGetAll('lubFrota').filter(m=>!m.unidade);}

// ═══════════════ PAINEL ═══════════════
function buildLubPainel(){
  const wk=isoWeek(new Date());
  const maqs=lubMaqsUnidade();
  if(!maqs.length)return lubEmpty();
  const bandas=lubBandas();
  let somaAder=0,nAder=0,emDia=0,atraso=0,semReg=0,graxaSem=0,bicos=0;
  const linhas=maqs.map(m=>{
    const recWk=lubExecOf(m.id,wk);
    let ult=null;lubGetAll('lubExec').forEach(r=>{if(r.patrimonio!==m.id)return;if(!ult||r.semana>ult.semana)ult=r;});
    const ad=lubAder(recWk,m.arquitetura);if(ad!=null){somaAder+=ad;nAder++;}
    const cons=lubCons(recWk);
    if(recWk){graxaSem+=lubGraxa(recWk)||0;bicos+=lubBicos(recWk);}
    let status,cls;
    if(recWk){status='Em dia';cls='ok';emDia++;}
    else if(ult){status='Em atraso';cls='err';atraso++;}
    else{status='Sem registro';cls='neu';semReg++;}
    let consTag;const b=bandas[m.familia];
    if(cons==null)consTag='<span class="bdg neu">—</span>';
    else if(!b||!b.base)consTag=`<strong style="font-family:var(--mono)">${lubFmt(cons,1)}</strong> <span class="bdg amr">coletando base</span>`;
    else if(cons<b.lo)consTag=`<strong style="font-family:var(--mono)">${lubFmt(cons,1)}</strong> <span class="bdg err">baixo — verificar</span>`;
    else if(cons>b.hi)consTag=`<strong style="font-family:var(--mono)">${lubFmt(cons,1)}</strong> <span class="bdg warn">alto</span>`;
    else consTag=`<strong style="font-family:var(--mono)">${lubFmt(cons,1)}</strong> <span class="bdg ok">na faixa</span>`;
    return{m,ult,ad,status,cls,consTag};
  });
  const aderMedia=nAder?Math.round(somaAder/nAder):null;
  const total=maqs.length;
  const adCol=aderMedia==null?'var(--muted)':(aderMedia>=95?'var(--green)':aderMedia>=80?'var(--amber)':'var(--red)');
  return `<div class="kgrid k4">
    <div class="kpi"><div class="kbar" style="background:${adCol}"></div><div class="klbl">Aderência da semana</div><div class="kval" style="color:${adCol}">${aderMedia==null?'—':aderMedia+'%'}</div><div class="ksub">meta ≥ 95% · ${nAder}/${total} com registro</div></div>
    <div class="kpi"><div class="kbar" style="background:${atraso?'var(--amber)':'var(--green)'}"></div><div class="klbl">Máquinas em dia</div><div class="kval">${emDia}/${total}</div><div class="ksub">${atraso} em atraso · ${semReg} sem registro</div></div>
    <div class="kpi"><div class="kbar" style="background:var(--gold)"></div><div class="klbl">Graxa na semana</div><div class="kval sm">${lubFmt(graxaSem,1)} kg</div><div class="ksub">GX-01 + GX-02</div></div>
    <div class="kpi"><div class="kbar" style="background:${bicos?'var(--red)':'var(--green)'}"></div><div class="klbl">Bicos inoperantes</div><div class="kval" style="${bicos?'color:var(--red)':''}">${bicos}</div><div class="ksub">${bicos?'apontados nas fichas':'nenhum apontado'}</div></div>
  </div>
  <div class="shdr"><div class="stitle">Situação por máquina · ${lubWeekRange(wk)}</div></div>
  <div class="card"><div class="tw"><table>
    <thead><tr><th>Patrim.</th><th>Máquina</th><th>Tipo</th><th>Aderência</th><th>Consumo kg/1000h</th><th>Última exec.</th><th>Status</th></tr></thead>
    <tbody>${linhas.map(L=>`<tr>
      <td><strong style="color:#b45309;font-family:var(--mono)">${esc(L.m.patrimonio)}</strong></td>
      <td>${esc(L.m.descricao)}</td>
      <td><span class="bdg neu">${LUB_ARQ[L.m.arquitetura].curto}</span></td>
      <td>${L.ad==null?'—':`<strong style="color:${L.ad>=95?'var(--green)':L.ad>=80?'var(--amber)':'var(--red)'}">${L.ad}%</strong>`}</td>
      <td>${L.consTag}</td>
      <td>${L.ult?`<span style="font-size:11px;color:var(--muted2)">${esc(lubWeekRange(L.ult.semana))}</span>`:'<span style="color:var(--muted)">—</span>'}</td>
      <td><span class="bdg ${L.cls}">${L.status}</span></td>
    </tr>`).join('')}</tbody>
  </table></div></div>
  <p style="font-size:11.5px;color:var(--muted);margin:11px 2px 0">O consumo compara cada máquina com a mediana da própria família (±20%) — vira termômetro de aderência real com 3+ execuções na família. Consumo muito abaixo é sinal de ponto não engraxado, mesmo com a ficha assinada.</p>`;
}

    </div>
    <div class="card lub-live">
      <div class="lub-gauge"><div class="lub-ring" id="lubRing"><b id="lubRingVal">0%</b></div>
        <div><div class="t">Aderência desta ficha</div><div class="d">pontos executados sobre aplicáveis</div></div></div>
      <div class="lub-mini-row">
        <div class="lub-mini"><div class="k">Horas no período</div><div class="v" id="lubHoras">—</div></div>
        <div class="lub-mini"><div class="k">Consumo kg/1000h</div><div class="v" id="lubConsV">—</div></div>

      <div class="lub-fld"><label>Graxa GX-02 usada (kg)</label><input id="lubG2" inputmode="decimal" value="${esc(r.graxaGX02||'')}" placeholder="0"></div></div>

function lubLoadRec(){
  const ex=lubExecOf(LUB_STATE.pat,LUB_STATE.wk);
  if(ex){LUB_STATE.rec=JSON.parse(JSON.stringify(ex));}
  else{const m=lubGetAll('lubFrota').find(x=>x.id===LUB_STATE.pat);
    LUB_STATE.rec={id:lubExecId(LUB_STATE.pat,LUB_STATE.wk),patrimonio:LUB_STATE.pat,unidade:APP.unidade,arquitetura:m.arquitetura,
      semana:LUB_STATE.wk,horimetroIni:'',horimetroFim:'',lubrificador:'',matricula:'',pontos:{},
      bicosDanificados:'',anomalias:'',graxaGX01:'',graxaGX02:'',criadoEm:new Date().toISOString()};}
  LUB_STATE.dirty=false;
}
function lubReadFields(){
  const r=LUB_STATE.rec;const g=id=>{const e=document.getElementById(id);return e?e.value:'';};
  r.lubrificador=g('lubLub');r.matricula=g('lubMat');r.horimetroIni=g('lubHi');r.horimetroFim=g('lubHf');
  r.bicosDanificados=g('lubBicosT');r.anomalias=g('lubAnom');r.graxaGX01=g('lubG1');r.graxaGX02=g('lubG2');
  r.unidade=APP.unidade;
}
function lubRecalc(){
  lubReadFields();const r=LUB_STATE.rec;const ad=lubAder(r,r.arquitetura);const p=ad==null?0:ad;
  const col=p>=95?'#22c55e':p>=80?'#f59e0b':'#ef4444';
  const ring=document.getElementById('lubRing');if(ring){ring.style.setProperty('--p',p);ring.style.setProperty('--col',col);}
  const rv=document.getElementById('lubRingVal');if(rv)rv.textContent=ad==null?'0%':ad+'%';
  const h=lubHoras(r),c=lubCons(r),gx=lubGraxa(r),bic=lubBicos(r);
  const set=(id,val)=>{const e=document.getElementById(id);if(e)e.textContent=val;};
  set('lubHoras',h==null?'—':lubFmt(h,0)+' h');set('lubConsV',c==null?'—':lubFmt(c,1));
  set('lubGraxaV',gx==null?'—':lubFmt(gx,1)+' kg');
  const sb=document.getElementById('lubBicosV');if(sb){sb.textContent=bic;sb.style.color=bic>0?'var(--red)':'';}
}
function lubMark(){
  LUB_STATE.dirty=true;const s=document.getElementById('lubSaveInfo');if(s){s.className='lub-saveinfo';s.textContent='alterações não salvas';}
  clearTimeout(LUB_STATE.timer);LUB_STATE.timer=setTimeout(()=>lubSalvarFicha(true),5000);
}
function lubSalvarFicha(auto){
  lubReadFields();const r=LUB_STATE.rec;
  const algo=Object.keys(r.pontos).length||r.horimetroIni||r.lubrificador||r.graxaGX01||r.graxaGX02;
  if(!algo){if(!auto)toast('Nada para salvar ainda.','warn');return;}
  lubSave('lubExec',r);LUB_STATE.dirty=false;
  const s=document.getElementById('lubSaveInfo');if(s){s.className='lub-saveinfo ok';s.textContent=(NET.isOnline()?'salvo e sincronizado':'salvo — envia ao reconectar')+' · '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}
  if(!auto)toast('Ficha salva.');
}
async function lubLimparSemana(){
  const ok=await customConfirm({title:'Limpar semana',msg:'Apagar todos os registros desta máquina nesta semana?',confirmLabel:'Limpar',icon:'🧽',type:'warn'});

}

    lubSave('lubFrota',{id:p,patrimonio:p,descricao:g('lmDesc'),fabricante:g('lmFab'),modelo:g('lmMod'),ano:g('lmAno'),

// unidades: usa a lista global do PCMgest se existir; senão, as cinco fazendas
const LUB_UNIDS=(typeof UNIDADES!=='undefined'&&Array.isArray(UNIDADES)&&UNIDADES.length)?UNIDADES:['Caregi','Reata','Santo André II','Sulinense','Túnica'];

// ═══════════════ MOUNT (bind pós-render) ═══════════════

// ═══════════════ ENGRAXE / VENCIMENTO POR HORÍMETRO ═══════════════
// Fluxo: 1) horímetro atual da máquina  2) inicia o serviço com intervalo e horímetro inicial
//        3) a cada troca, lança o horímetro do momento -> zera o contador e guarda no histórico.
function lubVItens(){try{return JSON.parse(localStorage.getItem('lubVenc')||'[]')}catch(e){return[]}}
function lubVSetItens(v){localStorage.setItem('lubVenc',JSON.stringify(v))}
function lubVAntec(){try{return Number(JSON.parse(localStorage.getItem('lubVencCfg')||'{}').antec)||50}catch(e){return 50}}
function lubVSetAntec(v){localStorage.setItem('lubVencCfg',JSON.stringify({antec:Number(v)||50}));render()}
function lubVNum(v){if(v==null||v==='')return null;if(typeof v==='number')return v;let s=String(v).trim().replace(/\s/g,'');if(s.indexOf(',')>-1&&s.indexOf('.')>-1)s=s.replace(/\./g,'').replace(',','.');else s=s.replace(',','.');const n=parseFloat(s);return isNaN(n)?null:n}
function lubVNorm(s){return (s||'').toString().trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function lubVHoje(){const d=new Date();return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()}
function lubVFmt(n){return n==null||n===''?'—':Number(n).toLocaleString('pt-BR')}
function lubVMaq(pat){return lubGetAll('lubFrota').find(m=>m.id===pat)}
function lubVHor(pat){const m=lubVMaq(pat);return m&&m.horimetro!=null&&m.horimetro!==''?Number(m.horimetro):null}
function lubVStat(it,hAt){const antec=lubVAntec();const prox=(it.h_ultima_troca||0)+(it.intervalo||0);if(hAt==null)return{k:'none',cls:'neu',lbl:'Sem horímetro',prox,rest:null,pct:0};const rest=prox-hAt;const rodado=hAt-(it.h_ultima_troca||0);const pct=it.intervalo?Math.min(rodado/it.intervalo,1.3):0;let k='ok',cls='ok',lbl='Em dia';if(rest<=0){k='crit';cls='err';lbl='Vencido'}else if(rest<=antec){k='warn';cls='warn';lbl='Próximo'}return{k,cls,lbl,prox,rest,pct}}
const LUBV_COR={crit:'var(--red)',warn:'var(--amber)',ok:'var(--green)',none:'var(--muted)'};
const LUBV_PRESETS=['Engraxe geral','Óleo motor','Óleo hidráulico','Óleo transmissão','Filtros','Graxa dos pinos'];

// 1) atualizar horímetro atual da máquina (fonte única = Frota)
function lubVSetHor(pat){const m=lubVMaq(pat);if(!m)return;openModal(`<div class="modal"><div class="mtitle p">⏱️ Horímetro atual</div>
  <div class="infobox" style="font-size:12px"><strong style="font-family:var(--mono)">${esc(pat)}</strong> · ${esc(m.descricao||'')}</div>
  <div class="frow"><div><label>Horímetro atual (h)</label><input id="lvH" value="${m.horimetro!=null?m.horimetro:''}" placeholder="ex.: 2237"/></div></div>
  <div class="mfoot"><button class="btn btn-gh" onclick="closeModal()">Cancelar</button><button class="btn btn-p" onclick="lubVSaveHor('${esc(pat)}')">Salvar</button></div></div>`)}
function lubVSaveHor(pat){const m=lubVMaq(pat);if(!m)return;const h=lubVNum(document.getElementById('lvH').value);m.horimetro=h;lubSave('lubFrota',m);closeModal();render();toast('Horímetro atualizado')}

// 2) iniciar um serviço/engraxe
function lubVIniciar(pat){const m=lubVMaq(pat);if(!m)return;const cur=m.horimetro!=null?m.horimetro:'';openModal(`<div class="modal"><div class="mtitle p">▶ Iniciar controle de engraxe/troca</div>
  <div class="infobox" style="font-size:12px"><strong style="font-family:var(--mono)">${esc(pat)}</strong> · ${esc(m.descricao||'')}</div>
  <div class="frow"><div><label>Serviço</label><input id="lvS" list="lvSdl" value="Engraxe geral"/><datalist id="lvSdl">${LUBV_PRESETS.map(p=>`<option value="${p}">`).join('')}</datalist></div></div>
  <div class="frow c2"><div><label>Intervalo de troca (h) *</label><input id="lvI" placeholder="ex.: 50"/></div><div><label>Horímetro da última troca *</label><input id="lvU" value="${cur}" placeholder="horímetro inicial"/></div></div>
  <p style="font-size:11.5px;color:var(--muted);margin:2px 2px 0">Dica: no início, o "horímetro da última troca" é o horímetro atual da máquina (ponto de partida).</p>
  <div class="mfoot"><button class="btn btn-gh" onclick="closeModal()">Cancelar</button><button class="btn btn-p" onclick="lubVAddServ('${esc(pat)}')">Iniciar</button></div></div>`)}
function lubVAddServ(pat){const serv=(document.getElementById('lvS').value||'Engraxe').trim();const intervalo=lubVNum(document.getElementById('lvI').value);const hUlt=lubVNum(document.getElementById('lvU').value);if(intervalo==null||intervalo<=0){toast('Informe o intervalo (h)','err');return}const arr=lubVItens();arr.push({id:'lv'+uid(),pat,serv,intervalo,h_ultima_troca:hUlt||0,data_ultima:lubVHoje(),historico:[]});lubVSetItens(arr);const m=lubVMaq(pat);if(m&&(m.horimetro==null||m.horimetro==='')&&hUlt!=null){m.horimetro=hUlt;lubSave('lubFrota',m)}closeModal();render();toast('Serviço iniciado')}

// 3) registrar troca/engraxe -> lança o horímetro do momento
function lubVTroca(id){const it=lubVItens().find(x=>x.id===id);if(!it)return;const cur=lubVHor(it.pat);openModal(`<div class="modal"><div class="mtitle p">🛢️ Registrar engraxe / troca</div>
  <div class="infobox" style="font-size:12px"><strong style="font-family:var(--mono)">${esc(it.pat)}</strong> · ${esc(it.serv)} · intervalo ${lubVFmt(it.intervalo)} h</div>
  <div class="frow c2"><div><label>Horímetro do momento *</label><input id="lvTh" value="${cur!=null?cur:''}" placeholder="horímetro agora"/></div><div><label>Data</label><input id="lvTd" value="${lubVHoje()}"/></div></div>
  <div class="frow"><div><label>Observação</label><input id="lvTo" placeholder="óleo 15W40, graxa aplicada..."/></div></div>
  <p style="font-size:11.5px;color:var(--muted);margin:2px 2px 0">Isso zera o contador e atualiza o horímetro atual da máquina.</p>
  <div class="mfoot"><button class="btn btn-gh" onclick="closeModal()">Cancelar</button><button class="btn btn-p" onclick="lubVDoTroca('${id}')">Confirmar troca</button></div></div>`)}
function lubVDoTroca(id){const arr=lubVItens();const it=arr.find(x=>x.id===id);if(!it)return;const h=lubVNum(document.getElementById('lvTh').value);if(h==null){toast('Informe o horímetro do momento','err');return}const data=document.getElementById('lvTd').value||lubVHoje();const obs=document.getElementById('lvTo').value||'';it.historico=it.historico||[];it.historico.unshift({data,h,rodou:h-(it.h_ultima_troca||0),obs});it.h_ultima_troca=h;it.data_ultima=data;lubVSetItens(arr);const m=lubVMaq(it.pat);if(m){m.horimetro=h;lubSave('lubFrota',m)}closeModal();render();toast('Troca registrada · contador zerado')}

function lubVDel(id){const arr=lubVItens();const it=arr.find(x=>x.id===id);if(!it)return;if(!confirm('Remover o serviço "'+it.serv+'" de '+it.pat+'?'))return;lubVSetItens(arr.filter(x=>x.id!==id));render();toast('Serviço removido')}
function lubVHist(id){const it=lubVItens().find(x=>x.id===id);if(!it)return;const hs=it.historico||[];openModal(`<div class="modal"><div class="mtitle">📜 Histórico · ${esc(it.pat)} · ${esc(it.serv)}</div>
  ${hs.length?`<div class="tw"><table><thead><tr><th>Data</th><th>Horímetro</th><th>Rodou</th><th>Obs</th></tr></thead><tbody>${hs.map(x=>`<tr><td>${esc(x.data)}</td><td style="font-family:var(--mono)"><strong>${lubVFmt(x.h)}</strong> h</td><td style="color:var(--muted2)">${lubVFmt(x.rodou)} h</td><td style="color:var(--muted2)">${esc(x.obs||'')}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><div class="ei">🕓</div><p>Nenhuma troca registrada ainda.</p></div>`}
  <div class="mfoot"><button class="btn btn-gh" onclick="closeModal()">Fechar</button></div></div>`)}

// importação opcional em massa dos horímetros atuais (atualiza a Frota)
function lubVImpHor(inp){const f=inp.files[0];if(!f)return;inp.value='';const r=new FileReader();r.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'binary'});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});let hr=0,h={};for(let i=0;i<Math.min(rows.length,8);i++){const hh={};(rows[i]||[]).forEach((c,j)=>hh[lubVNorm(c)]=j);if('pat'in hh||'patrimonio'in hh){hr=i;h=hh;break}}const cP=('pat'in h)?h.pat:h.patrimonio;const cH=h['horimetro atual']!=null?h['horimetro atual']:(h['horimetro']!=null?h['horimetro']:h['leitura']);if(cP==null||cH==null){toast('Planilha precisa de PAT e Horímetro','err');return}let upd=0;for(let i=hr+1;i<rows.length;i++){const rr=rows[i];if(!rr||!String(rr[cP]).trim())continue;const pat=String(rr[cP]).trim();const m=lubVMaq(pat);if(!m)continue;m.horimetro=lubVNum(rr[cH]);lubSave('lubFrota',m);upd++}render();toast('Horímetros atualizados · '+upd+' máquina(s)')}catch(err){toast('Erro ao ler a planilha','err')}};r.readAsBinaryString(f)}

function buildLubVenc(){
  const maqs=lubMaqsUnidade();
  const itens=lubVItens();
  const meus=maqs.map(m=>({m,its:itens.filter(x=>x.pat===m.id)}));
  // KPIs
  let venc=0,prox=0,ok=0,semh=0,nItens=0;
  meus.forEach(({m,its})=>its.forEach(it=>{nItens++;const s=lubVStat(it,lubVHor(m.id));if(s.k==='crit')venc++;else if(s.k==='warn')prox++;else if(s.k==='ok')ok++;else semh++}));
  const passo=`<div class="card" style="background:#b4530910;border-color:#b4530933;padding:12px 16px;margin-bottom:14px;font-size:12.5px;color:#8a4a08;line-height:1.7">
    <strong>Como funciona:</strong> &nbsp;1️⃣ atualize o <strong>horímetro atual</strong> da máquina &nbsp;·&nbsp; 2️⃣ clique em <strong>▶ Iniciar</strong> para cada engraxe/troca (intervalo + horímetro inicial) &nbsp;·&nbsp; 3️⃣ a cada engraxe, use <strong>🛢️ Troca</strong> e lance o horímetro do momento — o contador zera e vai para o histórico.</div>`;
  const toolbar=`<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px">
    <button class="btn btn-gh btn-sm" onclick="document.getElementById('lubVfileHor').click()">⬆ Importar horímetros (opcional)</button>
    <div style="margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)">Avisar quando faltar (h): <input type="number" value="${lubVAntec()}" onchange="lubVSetAntec(this.value)" style="width:64px;padding:6px 8px;border:1px solid var(--border2);border-radius:7px;font-family:var(--mono);font-size:12px"/></div>
    <input type="file" id="lubVfileHor" accept=".xlsx,.xls,.csv" style="display:none" onchange="lubVImpHor(this)"/></div>`;
  const kpis=`<div style="display:grid;gap:12px;grid-template-columns:repeat(4,1fr);margin-bottom:16px">
    <div class="kpi"><div class="kbar" style="background:var(--red)"></div><div class="klbl">Vencidos</div><div class="kval" style="${venc?'color:var(--red)':''}">${venc}</div></div>
    <div class="kpi"><div class="kbar" style="background:var(--amber)"></div><div class="klbl">Próximos</div><div class="kval" style="${prox?'color:var(--amber)':''}">${prox}</div></div>
    <div class="kpi"><div class="kbar" style="background:var(--green)"></div><div class="klbl">Em dia</div><div class="kval">${ok}</div></div>
    <div class="kpi"><div class="kbar" style="background:var(--muted)"></div><div class="klbl">Serviços monitorados</div><div class="kval">${nItens}</div></div></div>`;
  if(!maqs.length)return passo+`<div class="card"><div class="empty"><div class="ei">🚜</div><p>Nenhuma máquina nesta unidade. Cadastre/atribua na aba <strong>Frota</strong> primeiro.</p></div></div>`;
  // ordena máquinas: as com item mais urgente primeiro
  meus.sort((a,b)=>{const ra=Math.min(...(a.its.map(it=>{const s=lubVStat(it,lubVHor(a.m.id));return s.rest==null?1e9:s.rest}).concat([1e12])));const rb=Math.min(...(b.its.map(it=>{const s=lubVStat(it,lubVHor(b.m.id));return s.rest==null?1e9:s.rest}).concat([1e12])));return ra-rb});
  const cards=meus.map(({m,its})=>{
    const hAt=lubVHor(m.id);
    const linhas=its.map(it=>{const s=lubVStat(it,hAt);const cor=LUBV_COR[s.k];
      return `<tr data-st="${s.k}">
        <td>${esc(it.serv)}</td>
        <td style="font-family:var(--mono);text-align:right">${lubVFmt(it.intervalo)}</td>
        <td style="font-family:var(--mono);text-align:right">${lubVFmt(it.h_ultima_troca)}</td>
        <td style="font-family:var(--mono);text-align:right">${lubVFmt(s.prox)}</td>
        <td style="font-family:var(--mono);text-align:right;${s.rest!=null&&s.rest<=0?'color:var(--red);font-weight:700':''}">${s.rest==null?'—':lubVFmt(s.rest)}</td>
        <td style="min-width:70px"><div style="height:7px;background:#0001;border-radius:5px;overflow:hidden"><span style="display:block;height:100%;width:${Math.min(s.pct*100,100)}%;background:${cor}"></span></div></td>
        <td><span class="bdg ${s.cls}">${s.lbl}</span></td>
        <td><div style="display:flex;gap:5px;justify-content:flex-end"><button class="btn btn-b btn-sm" style="background:#b45309;border-color:#b45309" onclick="lubVTroca('${it.id}')">🛢️ Troca</button><button class="btn btn-gh btn-sm" onclick="lubVHist('${it.id}')">Hist.</button><button class="btn btn-gh btn-sm" onclick="lubVDel('${it.id}')" style="color:var(--red)">✕</button></div></td>
      </tr>`}).join('');
    return `<div class="card" style="margin-bottom:12px">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:${its.length?'10px':'0'}">
        <div><strong style="color:#b45309;font-family:var(--mono);font-size:15px">${esc(m.id)}</strong> <span style="color:var(--muted2);font-size:13px">${esc(m.descricao||'')}</span>
          <div style="font-size:12px;color:var(--muted);margin-top:2px">Horímetro atual: <strong style="font-family:var(--mono);color:var(--text)">${hAt!=null?lubVFmt(hAt)+' h':'— não informado'}</strong>
            <button class="btn btn-gh btn-sm" style="margin-left:6px;padding:2px 8px" onclick="lubVSetHor('${esc(m.id)}')">✎ atualizar</button></div></div>
        <button class="btn btn-b btn-sm" style="margin-left:auto;background:#b45309;border-color:#b45309" onclick="lubVIniciar('${esc(m.id)}')">${its.length?'＋ serviço':'▶ Iniciar controle'}</button>
      </div>
      ${its.length?`<div class="tw"><table><thead><tr><th>Serviço</th><th style="text-align:right">Intervalo</th><th style="text-align:right">Últ. troca</th><th style="text-align:right">Próx.</th><th style="text-align:right">Faltam</th><th>Vida útil</th><th>Status</th><th></th></tr></thead><tbody>${linhas}</tbody></table></div>`:''}
    </div>`}).join('');
  return passo+toolbar+kpis+`<div class="stitle" style="font-size:12px;color:var(--muted2);margin:4px 2px 8px">Máquinas — ${esc(APP.unidade)} (${maqs.length})</div>`+cards;
}

function lubMount(){

    if(maq)maq.onchange=e=>{lubReadFields();LUB_STATE.pat=e.target.value;LUB_STATE.wk=isoWeek(new Date());lubLoadRec();render();};
    const wp=document.getElementById('lubWkPrev');if(wp)wp.onclick=()=>{lubReadFields();LUB_STATE.wk=lubShiftWeek(LUB_STATE.wk,-1);lubLoadRec();render();};
    const wn=document.getElementById('lubWkNext');if(wn)wn.onclick=()=>{lubReadFields();LUB_STATE.wk=lubShiftWeek(LUB_STATE.wk,1);lubLoadRec();render();};
    ['lubLub','lubMat','lubHi','lubHf','lubBicosT','lubAnom','lubG1','lubG2'].forEach(id=>{const e=document.getElementById(id);if(e)e.oninput=()=>{lubMark();lubRecalc();};});
    document.querySelectorAll('.lub-cell').forEach(c=>c.onclick=()=>{
      const seq=['','C','NA','X'];const nx=seq[(seq.indexOf(c.textContent.trim())+1)%seq.length];
      c.textContent=nx;c.className='lub-cell '+nx;
      const p=c.dataset.p,d=c.dataset.d;(LUB_STATE.rec.pontos[p]=LUB_STATE.rec.pontos[p]||{})[d]=nx;
      if(!nx)delete LUB_STATE.rec.pontos[p][d];

    });
    const bs=document.getElementById('lubSalvar');if(bs)bs.onclick=()=>lubSalvarFicha(false);
    const bl=document.getElementById('lubLimpar');if(bl)bl.onclick=()=>lubLimparSemana();

  }
  else if(APP.page==='lub_frota'){
    document.querySelectorAll('.lub-assign').forEach(s=>s.onchange=()=>{const m=lubGetAll('lubFrota').find(x=>x.id===s.dataset.pat);m.unidade=s.value;lubSave('lubFrota',m);render();toast('Unidade atualizada.');});

    const nv=document.getElementById('lubNova');if(nv)nv.onclick=()=>lubModalMaquina(null);
  }
  else if(APP.page==='lub_impr'){
    const pr=document.getElementById('lubPrint');
    if(pr)pr.onclick=()=>{const m=lubGetAll('lubFrota').find(x=>x.id===document.getElementById('lubImMaq').value);const w=window.open('','_blank');if(!w){toast('Permita pop-ups para imprimir.','warn');return;}w.document.write(lubFichaBrancoHTML(m,document.getElementById('lubImWk').value));w.document.close();};
  }
}

//  MÓDULO PROGRAMAÇÃO DE OS — nativo do PCMgest
//  Reconstrução do quadro "Programação Semanal" no visual do app.
//  Persistência no Firestore via LOCAL/FB/QUEUE (coleção progOS).
//  Escopo por APP.unidade; sub-navegação por APP.page (prog_*).
//  Reusa: esc, isoWeek, LOCAL, FB, QUEUE, NET, APP, render, UNIDADES,
//         AUTH, trocarUnidade, customConfirm.
// ═══════════════════════════════════════════════════════════════
const PROG_DN=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
const PROG_DSA=['D','S','T','Q','Q','S','S'];
const PROG_MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

const PROG_STATE={ano:null,sem:null,doc:null,timer:null};

function progInit(){
  if(PROG_STATE.ano)return;
  const p=isoWeek(new Date()).split('-W');
  PROG_STATE.ano=+p[0]; PROG_STATE.sem=+p[1];
}
function progN2(n){return String(n).padStart(2,'0');}
function progSeg(ano,sem){const j=new Date(ano,0,4),dw=j.getDay()||7,s=new Date(j);s.setDate(j.getDate()-dw+1+(sem-1)*7);return s;}
function progFmt(d){return progN2(d.getDate())+'/'+progN2(d.getMonth()+1);}
function progDatas(ano,sem){const seg=progSeg(ano,sem);return PROG_DN.map((_,i)=>{const d=new Date(seg);d.setDate(seg.getDate()+i);return d;});}
function progKey(uni,ano,sem){return uni+'__'+ano+'__W'+progN2(sem);}

function progAll(){return LOCAL.get('progOS');}
function progDoc(uni,ano,sem){
  const id=progKey(uni,ano,sem);
  const found=progAll().find(x=>x.id===id);
  if(found){if(!Array.isArray(found.dias))found.dias=[[],[],[],[],[],[],[]];return found;}
  return {id,unidade:uni,ano,sem,dias:[[],[],[],[],[],[],[]]};
}
function progSave(d){
  LOCAL.upsert('progOS',d);
  if(NET.isOnline()){FB.set('progOS',d.id,d).then(ok=>{if(!ok){QUEUE.add({type:'set',col:'progOS',id:d.id,data:d});NET.updateBar();}});}
  else{QUEUE.add({type:'set',col:'progOS',id:d.id,data:d});NET.updateBar();}
}
function progSchedule(){clearTimeout(PROG_STATE.timer);PROG_STATE.timer=setTimeout(()=>progSave(PROG_STATE.doc),700);}
function progLoad(){PROG_STATE.doc=progDoc(APP.unidade,PROG_STATE.ano,PROG_STATE.sem);}

// contagem de uma unidade numa semana
function progConta(uni,ano,sem){
  const d=progDoc(uni,ano,sem);let os=0,maq=0,dias=0;
  d.dias.forEach(arr=>{const at=arr.filter(m=>m._saved||m.frota);if(at.length)dias++;maq+=at.length;os+=arr.filter(m=>m.os).length;});
  return {os,maq,dias};
}

function progBoardHTML(){
  const datas=progDatas(PROG_STATE.ano,PROG_STATE.sem);
  const col=(di)=>{
    const d=datas[di];
    return `<div class="prog-day">
      <div class="prog-day-hdr"><span>${PROG_DN[di].toUpperCase()} ${progFmt(d)}</span><button class="prog-badd" onclick="progAddOS(${di})">+ OS</button></div>
      <div class="prog-day-body" id="prog-db-${di}">${progDayInner(di)}</div>
    </div>`;
  };
  let all='';for(let di=0;di<7;di++)all+=col(di);
  return `<div class="prog-grid">${all}</div>`;
}

function progDayInner(di){
  const arr=PROG_STATE.doc.dias[di]||[];
  if(!arr.length)return '<div class="prog-empty">Nenhuma OS</div>';
  return arr.map((m,mi)=>progCardHTML(m,di,mi)).join('');
}

function progCardHTML(m,di,mi){
  const saved=!!(m._saved&&m.frota);
  return `<div class="prog-card">
    <div class="prog-card-hdr">
      <span class="prog-card-lbl" id="prog-lbl-${di}-${mi}">${saved?'▶ '+esc(m.frota):'Nova OS '+(mi+1)}</span>
      <div class="prog-card-btns">
        <button class="prog-bedit" id="prog-eb-${di}-${mi}" onclick="progEditOS(${di},${mi})" style="${saved?'':'display:none'}">editar</button>
        <button class="prog-bdel" onclick="progDelOS(${di},${mi})">✕</button>
      </div>
    </div>
    <div class="prog-form${saved?'':' open'}" id="prog-fm-${di}-${mi}">
      <input class="pfi" type="text" placeholder="Frota (ex: PL-23)" value="${esc(m.frota)}" oninput="progField(${di},${mi},'frota',this.value)">
      <input class="pfi" type="text" placeholder="O.S. (ex: 48749)" value="${esc(m.os)}" oninput="progField(${di},${mi},'os',this.value)">
      <input class="pfi" type="text" placeholder="Mecânico" value="${esc(m.mecanico)}" oninput="progField(${di},${mi},'mecanico',this.value)">
      <input class="pfi" type="text" placeholder="Serviço / descrição" value="${esc(m.servico)}" oninput="progField(${di},${mi},'servico',this.value)">
      <button class="btn btn-b btn-sm" style="width:100%;justify-content:center" onclick="progSaveOS(${di},${mi})">✓ Salvar</button>
    </div>
    <div class="prog-view${saved?' show':''}" id="prog-vw-${di}-${mi}">${saved?progViewHTML(m):''}</div>
  </div>`;
}

function progViewHTML(m){
  return `<div><span class="pvl">Frota</span> <span class="pvv">${esc(m.frota)||'—'}</span>&emsp;<span class="pvl">O.S.</span> <span class="pvv">${esc(m.os)||'—'}</span></div>`+
         `<div><span class="pvl">Mecânico</span> <span class="pvv">${esc(m.mecanico)||'—'}</span></div>`+
         `<div class="pvs">▶ ${esc(m.servico)||'—'}</div>`;
}

function progCalHTML(){
  const ano=PROG_STATE.ano,sem=PROG_STATE.sem;
  const datas=progDatas(ano,sem),mes=datas[0].getMonth();
  const sw=new Set(datas.filter(d=>d.getMonth()===mes).map(d=>d.getDate()));
  const p=new Date(ano,mes,1).getDay(),dm=new Date(ano,mes+1,0).getDate();
  let h=`<div class="prog-cal-mes">${PROG_MESES[mes]} ${ano}</div><table class="pmc"><tr>${PROG_DSA.map(d=>`<th>${d}</th>`).join('')}</tr>`;
  let dia=1,off=p;
  while(dia<=dm){
    h+='<tr>';
    for(let c=0;c<7;c++){
      if(dia===1&&c<off){h+='<td></td>';}
      else if(dia<=dm){
        const isSW=sw.has(dia);
        const diIdx=datas.findIndex(d=>d.getDate()===dia&&d.getMonth()===mes);
        const hasOS=diIdx>=0&&(PROG_STATE.doc.dias[diIdx]||[]).some(m=>m._saved||m.frota);
        h+=`<td class="${isSW?'sw':''}">${dia}${hasOS?'<span class="pdot"></span>':''}</td>`;
        dia++;
      }else h+='<td></td>';
    }
    h+='</tr>';off=0;
  }
  return h+'</table>';
}

// ── handlers ──
function progApplyWeek(){
  const s=parseInt(document.getElementById('prog-sem').value)||PROG_STATE.sem;
  const a=parseInt(document.getElementById('prog-ano').value)||PROG_STATE.ano;
  PROG_STATE.sem=Math.min(53,Math.max(1,s));PROG_STATE.ano=a;render();
}
function progShiftWeek(delta){
  let s=PROG_STATE.sem+delta,a=PROG_STATE.ano;
  if(s<1){s=52;a--;}else if(s>52){s=1;a++;}
  PROG_STATE.sem=s;PROG_STATE.ano=a;render();
}
function progAddOS(di){
  PROG_STATE.doc.dias[di].push({frota:'',os:'',mecanico:'',servico:'',_saved:false});
  const el=document.getElementById('prog-db-'+di);if(el)el.innerHTML=progDayInner(di);
}
function progField(di,mi,c,v){PROG_STATE.doc.dias[di][mi][c]=v;progSchedule();}
function progSaveOS(di,mi){
  const m=PROG_STATE.doc.dias[di][mi];m._saved=true;
  document.getElementById('prog-fm-'+di+'-'+mi)?.classList.remove('open');
  const vw=document.getElementById('prog-vw-'+di+'-'+mi);if(vw){vw.classList.add('show');vw.innerHTML=progViewHTML(m);}
  const lbl=document.getElementById('prog-lbl-'+di+'-'+mi);if(lbl)lbl.textContent=(m.frota?'▶ '+m.frota:'Nova OS '+(mi+1));
  const eb=document.getElementById('prog-eb-'+di+'-'+mi);if(eb)eb.style.display='';
  progRefreshCal();progSave(PROG_STATE.doc);
}
function progEditOS(di,mi){
  document.getElementById('prog-fm-'+di+'-'+mi)?.classList.add('open');
  document.getElementById('prog-vw-'+di+'-'+mi)?.classList.remove('show');
}
function progDelOS(di,mi){
  PROG_STATE.doc.dias[di].splice(mi,1);
  const el=document.getElementById('prog-db-'+di);if(el)el.innerHTML=progDayInner(di);
  progRefreshCal();progSave(PROG_STATE.doc);
}
function progRefreshCal(){const el=document.getElementById('prog-cal');if(el)el.innerHTML=progCalHTML();}

    <div class="kpi"><div class="klbl">Unidades ativas</div><div class="kval" style="color:var(--goldt)">${uat}</div><div class="ksub">de ${UNIDADES.length}</div></div>
    <div class="kpi"><div class="klbl">Dias-unidade ativos</div><div class="kval">${tdias}</div><div class="ksub">total na semana</div></div>
  </div>
  <div class="card"><div class="shdr"><div class="stitle">OS por unidade</div></div>${dados.map(d=>bar(d,d.os,mxo,false)).join('')}</div>
  <div class="card"><div class="shdr"><div class="stitle">Máquinas por unidade</div></div>${dados.map(d=>bar(d,d.maq,mxm,true)).join('')}</div>

// ═══════════════ PDF (Programação Semanal, paisagem A4) ═══════════════
function progPDF(){
  const btn=document.getElementById('prog-pdf');
  if(!window.jspdf){toast('Biblioteca PDF ainda carregando, tente de novo.','warn');return;}
  const old=btn?btn.textContent:'';if(btn){btn.textContent='Gerando...';btn.disabled=true;}
  try{
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
    const PW=297,PH=210,M=6;
    const ano=PROG_STATE.ano,sem=PROG_STATE.sem,uni=APP.unidade;
    const doc=progDoc(uni,ano,sem);
    const datas=progDatas(ano,sem),mes=datas[0].getMonth();
    const AZ=[46,84,150],AZL=[220,230,241],AZH=[31,62,114],BORDA=[180,190,210],VM=[176,0,0];
    const TOPO_H=28,GAP=2,DIA_HDR=8,ROD_H=7,totalW=PW-M*2,SEM_W=38,CAL_W=60;
    const BANNER_X=M+SEM_W+GAP+CAL_W+GAP,BANNER_W=totalW-SEM_W-CAL_W-GAP*2;
    let y=M;
    pdf.setFillColor(...AZ);pdf.rect(M,y,SEM_W,TOPO_H,'F');
    pdf.setTextColor(255,255,255);pdf.setFontSize(13);pdf.setFont('helvetica','bold');
    pdf.text('SEMANA',M+SEM_W/2,y+10,{align:'center'});
    pdf.setFontSize(17);pdf.text(String(sem),M+SEM_W/2,y+21,{align:'center'});
    const CX=M+SEM_W+GAP;
    pdf.setFillColor(...AZ);pdf.rect(CX,y,CAL_W,5,'F');
    pdf.setTextColor(255,255,255);pdf.setFontSize(6.5);pdf.setFont('helvetica','bold');
    pdf.text(PROG_MESES[mes],CX+CAL_W/2,y+3.5,{align:'center'});
    const CW=CAL_W/7;
    PROG_DSA.forEach((d,i)=>{pdf.setFillColor(...AZ);pdf.rect(CX+i*CW,y+5,CW,4,'F');pdf.setTextColor(255,255,255);pdf.setFontSize(5);pdf.setFont('helvetica','bold');pdf.text(d,CX+i*CW+CW/2,y+8,{align:'center'});});
    const sw2=new Set(datas.filter(d=>d.getMonth()===mes).map(d=>d.getDate()));
    const firstDay=new Date(ano,mes,1).getDay(),daysInMonth=new Date(ano,mes+1,0).getDate();
    let dia=1,rowY=y+9,off=firstDay;const ROW_H=4;
    while(dia<=daysInMonth){
      for(let c=0;c<7;c++){
        const cx=CX+c*CW,cy=rowY;
        if(dia===1&&c<off){}
        else if(dia<=daysInMonth){
          const isSW=sw2.has(dia);
          isSW?pdf.setFillColor(...AZL):pdf.setFillColor(255,255,255);
          pdf.rect(cx,cy,CW,ROW_H,'F');pdf.setDrawColor(220,220,220);pdf.rect(cx,cy,CW,ROW_H,'S');
          isSW?pdf.setTextColor(...AZH):pdf.setTextColor(100,100,100);
          pdf.setFontSize(5);pdf.setFont('helvetica',isSW?'bold':'normal');
          pdf.text(String(dia),cx+CW/2,cy+3,{align:'center'});dia++;
        }
      }
      rowY+=ROW_H;off=0;if(dia>daysInMonth)break;
    }
    pdf.setDrawColor(...BORDA);pdf.rect(CX,y,CAL_W,TOPO_H,'S');
    pdf.setFillColor(...AZ);pdf.rect(BANNER_X,y,BANNER_W,TOPO_H,'F');
    pdf.setTextColor(255,255,255);pdf.setFontSize(9);pdf.setFont('helvetica','bold');
    pdf.text('PROGRAMAÇÃO SEMANAL',BANNER_X+BANNER_W/2,y+11,{align:'center'});
    pdf.setFontSize(11);pdf.text(String(uni).toUpperCase(),BANNER_X+BANNER_W/2,y+20,{align:'center'});
    y+=TOPO_H+GAP;
    const gradeH=PH-M-y-ROD_H-GAP,l1H=Math.round(gradeH*0.5),l2H=gradeH-l1H,colW=totalW/4;
    function dOS(di,x,oy,w,h){
      const mqs=(doc.dias[di]||[]).filter(m=>m.frota||m.os||m.mecanico||m.servico);
      if(!mqs.length){pdf.setTextColor(180,180,180);pdf.setFontSize(7);pdf.setFont('helvetica','italic');pdf.text('Nenhuma OS',x+w/2,oy+7,{align:'center'});return;}
      let cy=oy;
      mqs.forEach((m,mi)=>{
        if(cy+5>oy+h)return;
        pdf.setFillColor(...AZL);pdf.rect(x,cy,w,5.5,'F');
        pdf.setTextColor(...AZH);pdf.setFontSize(7.5);pdf.setFont('helvetica','bold');
        pdf.text((m.frota||'—')+(m.os?' · OS: '+m.os:''),x+1.5,cy+3.8,{maxWidth:w-3});cy+=6;
        if(m.mecanico&&cy<oy+h){pdf.setTextColor(50,50,50);pdf.setFontSize(7);pdf.setFont('helvetica','normal');pdf.text('Mec: '+m.mecanico,x+2,cy+2.8,{maxWidth:w-4});cy+=4;}
        if(m.servico&&cy<oy+h){pdf.setTextColor(...VM);pdf.setFontSize(7);pdf.setFont('helvetica','normal');pdf.text('> '+m.servico,x+2,cy+2.8,{maxWidth:w-4});cy+=4;}
        cy+=2;
        if(mi<mqs.length-1&&cy<oy+h){pdf.setDrawColor(200,210,230);pdf.line(x+2,cy,x+w-2,cy);cy+=2.5;}
      });
    }
    for(let di=0;di<4;di++){
      const x=M+di*colW;
      pdf.setFillColor(...AZ);pdf.rect(x,y,colW,DIA_HDR,'F');
      pdf.setTextColor(255,255,255);pdf.setFontSize(8);pdf.setFont('helvetica','bold');
      pdf.text(PROG_DN[di].toUpperCase()+' '+progFmt(datas[di]),x+colW/2,y+5.5,{align:'center'});
      pdf.setFillColor(255,255,255);pdf.rect(x,y+DIA_HDR,colW,l1H-DIA_HDR,'F');
      pdf.setDrawColor(...BORDA);pdf.rect(x,y,colW,l1H,'S');
      dOS(di,x+2,y+DIA_HDR+2,colW-4,l1H-DIA_HDR-3);
    }
    const y2=y+l1H+GAP;
    for(let di=4;di<7;di++){
      const x=M+(di-4)*colW;
      pdf.setFillColor(...AZ);pdf.rect(x,y2,colW,DIA_HDR,'F');
      pdf.setTextColor(255,255,255);pdf.setFontSize(8);pdf.setFont('helvetica','bold');
      pdf.text(PROG_DN[di].toUpperCase()+' '+progFmt(datas[di]),x+colW/2,y2+5.5,{align:'center'});
      pdf.setFillColor(255,255,255);pdf.rect(x,y2+DIA_HDR,colW,l2H-DIA_HDR,'F');
      pdf.setDrawColor(...BORDA);pdf.rect(x,y2,colW,l2H,'S');
      dOS(di,x+2,y2+DIA_HDR+2,colW-4,l2H-DIA_HDR-3);
    }
    pdf.setFillColor(245,245,245);pdf.rect(M+3*colW,y2,colW,l2H,'F');
    pdf.setDrawColor(...BORDA);pdf.rect(M+3*colW,y2,colW,l2H,'S');
    pdf.setTextColor(160,160,160);pdf.setFontSize(6.5);pdf.setFont('helvetica','normal');
    pdf.text('NADIANA AGRO  |  PCM  |  Programação Semanal  |  '+uni+'  |  Semana '+sem+' / '+ano,PW/2,PH-M+1,{align:'center'});
    pdf.save('Programacao_'+String(uni).replace(/\s/g,'_')+'_Sem'+sem+'_'+ano+'.pdf');
  }catch(err){console.error(err);toast('Erro ao gerar PDF: '+err.message,'err');}
  if(btn){btn.textContent=old;btn.disabled=false;}
}

// ═══════════════════════════════════════════════════════════════
//  MÓDULO QUADRO PCM — Kanban de oficina por status (nativo)
//  Reconstrução do "Quadro PCM" (por status) no visual do PCMgest.
//  Persistência Firestore via LOCAL/FB/QUEUE: coleções quadroBoard e quadroCat.
//  Escopo por APP.unidade. Catálogo seedado (QUADRO_SEED) por unidade.
//  Reusa: esc, uid, toast, customConfirm, LOCAL, FB, QUEUE, NET, APP,
//         render, UNIDADES, AUTH, trocarUnidade, openModal, closeModal.
// ═══════════════════════════════════════════════════════════════
const QUADRO_LANES=[
  {id:'entrada',     lbl:'Entrada · Ag. Diagnóstico', rep:'Ag. Diagnóstico'},
  {id:'diagnostico', lbl:'Diagnóstico',               rep:'Diagnóstico'},
  {id:'ag-pecas',    lbl:'Aguardando Peças',          rep:'Ag. Peças'},
  {id:'em-reparo',   lbl:'Em Reparo',                 rep:'Em Reparo'},
  {id:'inspecao',    lbl:'Inspeção',                  rep:'Inspeção'},
  {id:'pronto',      lbl:'Pronto',                    rep:'Pronto'}
];
const QUADRO_PRIOS={urgente:'🔴 Urgente',alta:'🟠 Alta',normal:'Normal'};
const QUADRO_STATE={board:[],cat:[],fg:'',fp:'',fq:'',selG:'__all__',dragId:null};

// ── adaptadores (globais, por unidade) ──
function quadroBoardAll(){return LOCAL.get('quadroBoard');}
function quadroCatAll(){return LOCAL.get('quadroCat');}
function quadroBoardDoc(){const u=APP.unidade;const d=quadroBoardAll().find(x=>x.id===u);return d||{id:u,unidade:u,board:[]};}
function quadroCatDoc(){const u=APP.unidade;const d=quadroCatAll().find(x=>x.id===u);return d||{id:u,unidade:u,cat:[]};}
function quadroSaveBoard(d){
  LOCAL.upsert('quadroBoard',d);
  if(NET.isOnline()){FB.set('quadroBoard',d.id,d).then(ok=>{if(!ok){QUEUE.add({type:'set',col:'quadroBoard',id:d.id,data:d});NET.updateBar();}});}
  else{QUEUE.add({type:'set',col:'quadroBoard',id:d.id,data:d});NET.updateBar();}
}
function quadroSaveCat(d){
  LOCAL.upsert('quadroCat',d);
  if(NET.isOnline()){FB.set('quadroCat',d.id,d).then(ok=>{if(!ok){QUEUE.add({type:'set',col:'quadroCat',id:d.id,data:d});NET.updateBar();}});}
  else{QUEUE.add({type:'set',col:'quadroCat',id:d.id,data:d});NET.updateBar();}
}
function quadroSeed(){
  const u=APP.unidade;
  const has=quadroCatAll().find(x=>x.id===u);
  if(!has && typeof QUADRO_SEED!=='undefined' && QUADRO_SEED[u]){
    quadroSaveCat({id:u,unidade:u,cat:QUADRO_SEED[u].slice()});
  }
}
function quadroLoad(){
  quadroSeed();
  QUADRO_STATE.board=(quadroBoardDoc().board||[]).slice();
  QUADRO_STATE.cat=(quadroCatDoc().cat||[]).slice();
}
function quadroPersist(){quadroSaveBoard({id:APP.unidade,unidade:APP.unidade,board:QUADRO_STATE.board});}

function quadroCount(st){return QUADRO_STATE.board.filter(m=>m.status===st).length;}
function quadroDias(m){if(!m.entrada)return'';const a=new Date(m.entrada+'T00:00:00'),b=new Date();return Math.max(0,Math.round((b-a)/86400000));}

// ═══════════════ CASCA ═══════════════
function buildQuadroShell(){
  quadroLoad();
  const tot=QUADRO_STATE.board.length;
  return `<div class="shell">
  <div class="sidebar">
    <div class="sb-hdr"><div class="sb-name">🛠️ QUADRO PCM</div><div class="sb-sub">${esc(APP.unidade)}</div><span class="pill r" style="align-self:flex-start;margin-top:6px">OFICINA</span></div>
    <div class="sb-item act-r"><span>🗂️</span><span style="flex:1">Quadro de Oficina</span><span class="sb-cnt">${tot}</span></div>
    <div style="padding:10px 14px 4px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px">Status</div>
    ${QUADRO_LANES.map(l=>`<div style="display:flex;justify-content:space-between;padding:5px 16px;font-size:12px;color:var(--muted2)"><span>${l.rep}</span><span style="font-weight:700;color:var(--text)">${quadroCount(l.id)}</span></div>`).join('')}
    <div class="sb-foot">
      <div class="sb-item" onclick="APP.module=null;render()" style="border-radius:6px"><span>←</span><span>Menu Principal</span></div>
      <div class="sb-item" onclick="trocarUnidade()" style="border-radius:6px;margin-top:4px"><span>🏭</span><span style="font-size:11px">Trocar Unidade</span></div>
      <div class="sb-item" onclick="AUTH.logout()" style="border-radius:6px;color:var(--muted)"><span>🚪</span><span style="font-size:11px">Sair</span></div>
      <div style="font-size:10px;color:var(--muted);margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(AUTH.current()?.name||AUTH.current()?.email||'')}</div>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <div><div class="tb-title" style="color:#be123c">🛠️ Quadro de Oficina</div>
      <div class="tb-sub">🏭 ${esc(APP.unidade)} · ${tot} máquina(s) em oficina</div></div>
    </div>
    <div class="content"><div id="quadro-content">${buildQuadroBoard()}</div></div>
  </div>
</div>
<div id="quadro-print"></div>`;
}

function buildQuadroBoard(){
  const grupos=[...new Set(QUADRO_STATE.board.map(m=>m.grupo))].sort();
  const fil=quadroFiltered();
  return `
  <div class="qd-bar">
    <button class="btn btn-b btn-sm" style="background:#e11d48;border-color:#e11d48" onclick="quadroOpenAdd()">＋ Adicionar máquina</button>
    <select class="qd-sel" id="qd-fg" onchange="quadroFilter()"><option value="">Todos os grupos</option>${grupos.map(g=>`<option value="${esc(g)}" ${QUADRO_STATE.fg===g?'selected':''}>${esc(g)}</option>`).join('')}</select>
    <select class="qd-sel" id="qd-fp" onchange="quadroFilter()"><option value="">Todas prioridades</option>${Object.keys(QUADRO_PRIOS).map(p=>`<option value="${p}" ${QUADRO_STATE.fp===p?'selected':''}>${QUADRO_PRIOS[p]}</option>`).join('')}</select>
    <input class="qd-q" id="qd-fq" placeholder="Buscar frota, tag, descrição…" value="${esc(QUADRO_STATE.fq)}" oninput="quadroFilter()">
    <span class="qd-lbl">${fil.length} de ${QUADRO_STATE.board.length}</span>
    <button class="btn btn-gh btn-sm" onclick="quadroReport()" style="margin-left:auto">🖨 Relatório</button>
  </div>
  <div class="qd-lanes">
    ${QUADRO_LANES.map(l=>quadroLaneHTML(l,fil)).join('')}
  </div>`;
}

    if(q&&!(m.id||'').toLowerCase().includes(q)&&!(m.tag||'').toLowerCase().includes(q)&&!(m.desc||'').toLowerCase().includes(q))return false;

function quadroFmtD(s){if(!s)return'';const p=s.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s;}

function quadroRerender(){const el=document.getElementById('quadro-content');if(el)el.innerHTML=buildQuadroBoard();}

function quadroFilter(){

function quadroDrag(e,id){QUADRO_STATE.dragId=id;e.dataTransfer.effectAllowed='move';}
function quadroDrop(e,lane){

function gerarPassosExecucao(acao, motor){
  if(acao.includes('Troca') && acao.includes('leo')){
    return [{id:1,desc:'Preparar materiais: óleo e filtro corretos para o modelo',ico:'🛒',done:false},{id:2,desc:'Desligar motor e aguardar resfriamento (mín. 30 min)',ico:'⏱️',done:false},{id:3,desc:'Drenar óleo usado — coletar para descarte adequado',ico:'🪣',done:false},{id:4,desc:'Substituir filtro de óleo pelo novo',ico:'🔧',done:false},{id:5,desc:'Abastecer com óleo novo — verificar nível no visor',ico:'🛢️',done:false},{id:6,desc:'Ligar motor por 5 min e verificar vazamentos',ico:'✅',done:false},{id:7,desc:'Registrar troca e coletar nova amostra em 50h',ico:'📝',done:false}];

  if(acao.includes('revis') || acao.includes('RUL')){
    return [{id:1,desc:'Agendar parada programada do equipamento',ico:'📅',done:false},{id:2,desc:'Preparar peças de reposição previstas',ico:'🛒',done:false},{id:3,desc:'Realizar medição de folgas internas',ico:'📐',done:false},{id:4,desc:'Inspecionar bronzinas, anéis e cilindros',ico:'🔧',done:false},{id:5,desc:'Substituir peças fora de especificação',ico:'⚙️',done:false},{id:6,desc:'Realizar teste de compressão pós-revisão',ico:'⚡',done:false},{id:7,desc:'Coletar óleo para análise após 50h operação',ico:'🧫',done:false}];

async function openOilPlanoModalIA(motorId){
  const m = typeof OIL_MOTORES !== 'undefined' ? OIL_MOTORES.find(x=>x.id===motorId) : null;
  if(!m){ openOilPlanoModal(motorId); return; }
  toast('Gerando plano com IA...','info');
  let acoes = [];
  if(m.params.ferro > m.limites.ferro[1])         acoes.push({acao:'Troca imediata de óleo e filtro — Ferro crítico ('+m.params.ferro+' ppm > limite '+m.limites.ferro[1]+')',prioridade:'critico',prazo:3});
  if(m.params.acidez > m.limites.acidez[1])        acoes.push({acao:'Análise complementar acidez TAN — risco de corrosão interna (TAN='+m.params.acidez+')',prioridade:'critico',prazo:2});
  if(m.params.viscosidade > m.limites.viscosidade[1]) acoes.push({acao:'Investigar superaquecimento — viscosidade acima do limite ('+m.params.viscosidade+' cSt)',prioridade:'anormal',prazo:5});
  if(m.params.silicio > m.limites.silicio[1])      acoes.push({acao:'Verificar vedações e filtro de ar — contaminação por silício ('+m.params.silicio+' ppm)',prioridade:'anormal',prazo:7});
  if(m.params.agua > m.limites.agua[1])            acoes.push({acao:'Inspecionar sistema de arrefecimento — presença de água no óleo ('+m.params.agua+'%)',prioridade:'critico',prazo:1});
  if(m.rul <= 20)                                  acoes.push({acao:'Programar revisão geral do motor — RUL crítico ('+m.rul+'% restante)',prioridade:'critico',prazo:14});
  if(acoes.length === 0) acoes.push({acao:'Manter monitoramento periódico — parâmetros dentro do esperado',prioridade:'normal',prazo:30});
  const planos = getOilPlanos();
  const hoje = new Date();
  acoes.forEach(a=>{
    const prazo = new Date(hoje); prazo.setDate(prazo.getDate()+a.prazo);
    planos.push({id:uid(),motorId,acao:a.acao,responsavel:'A definir',prazo:prazo.toISOString().slice(0,10),prioridade:a.prioridade,obs:'Gerado automaticamente pela análise IA com base nos parâmetros do laudo.',status:'pendente',criadoEm:new Date().toISOString(),geradoPorIA:true,passo:0,passos:gerarPassosExecucao(a.acao,m)});
  });
  saveOilPlanos(planos);
  toast(acoes.length+' ações criadas pelo plano IA!','ok');
  APP.oilPage='planos'; render();
}

function buildOilCausaRaiz(){
  var falhaId = APP.oilFalhaId || 'F001';
  var cr = OIL_CAUSARAIZ[falhaId];
  var falha = OIL_FALHAS.find(function(f){ return f.id===falhaId; });
  var html = '<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">';
  html += '<button class="btn btn-gh btn-sm" onclick="APP.oilPage=\'falha\';render()">← Análise de Falha</button>';
  html += '<div style="display:flex;gap:6px;flex-wrap:wrap">';
  OIL_FALHAS.filter(function(f){ return OIL_CAUSARAIZ[f.id]; }).forEach(function(f){
    html += '<button class="btn '+(f.id===falhaId?'btn-g':'btn-gh')+' btn-sm" onclick="APP.oilFalhaId=\''+f.id+'\';render()">'+f.tipo.split(' ').slice(0,2).join(' ')+'</button>';
  });
  html += '</div></div>';
  if(!cr){
    return html + '<div class="card"><div class="empty"><div class="ei">🌳</div><p>Análise de causa raiz não disponível para esta falha.</p></div></div>';
  }
  html += '<div class="card" style="margin-bottom:16px"><div class="ctitle">🌳 Análise de Causa Raiz — 5 Porquês</div>';
  html += '<div style="font-size:13px;font-weight:600;color:var(--text);margin:8px 0 16px">'+cr.titulo+'</div>';
  cr.porques.forEach(function(p, i){
    var pct = Math.round((i+1)/5*100);
    html += '<div style="display:flex;gap:12px;margin-bottom:16px">';
    html += '<div style="display:flex;flex-direction:column;align-items:center;gap:0">';
    html += '<div style="width:32px;height:32px;border-radius:50%;background:#14b8a6;color:#000;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:16px;font-weight:700;flex-shrink:0">'+p.n+'</div>';
    if(i<4) html += '<div style="width:2px;flex:1;background:var(--border);min-height:20px;margin-top:4px"></div>';
    html += '</div>';
    html += '<div style="flex:1;padding-bottom:'+(i<4?'8px':'0')+'">';
    html += '<div style="font-size:11px;font-weight:700;color:#14b8a6;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">Por que '+p.n+'?</div>';
    html += '<div style="background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:10px 14px">';
    html += '<div style="font-size:12px;color:var(--muted2);margin-bottom:4px">'+p.pergunta+'</div>';
    html += '<div style="font-size:13px;font-weight:600;color:var(--text)">→ '+p.resposta+'</div>';
    html += '</div></div></div>';
  });
  html += '<div style="background:#14b8a615;border:2px solid #14b8a644;border-radius:10px;padding:16px;margin-top:8px">';
  html += '<div style="font-size:11px;font-weight:700;color:#14b8a6;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">🎯 CAUSA RAIZ IDENTIFICADA</div>';
  html += '<div style="font-size:13.5px;font-weight:600;color:var(--text);line-height:1.6">'+cr.causaRaiz+'</div>';
  html += '</div></div>';
  html += '<div class="card"><div class="ctitle">📋 Ações para Eliminação da Causa Raiz</div>';
  html += '<div style="overflow-x:auto;margin-top:12px"><table><thead><tr><th>#</th><th>Ação Corretiva / Preventiva</th><th>Prazo</th><th>Responsável</th></tr></thead><tbody>';
  cr.acoes.forEach(function(a, i){
    html += '<tr><td style="font-weight:700;color:#14b8a6">'+(i+1)+'</td><td>'+a.desc+'</td><td style="font-weight:600;color:var(--gold)">'+a.prazo+'</td><td>'+a.resp+'</td></tr>';

  html += '</tbody></table></div></div>';
  return html;
}

function buildOilPareto(){
  var dados = [
    {causa:'Intervalo troca óleo ultrapassado',ocorrencias:18,pct:32,acumulado:32,cor:'#ef4444'},
    {causa:'Filtro ar danificado/vencido',ocorrencias:12,pct:21,acumulado:53,cor:'#dc2626'},
    {causa:'Contaminação por silício',ocorrencias:9,pct:16,acumulado:69,cor:'#f59e0b'},
    {causa:'Superaquecimento do motor',ocorrencias:7,pct:12,acumulado:81,cor:'#fbbf24'},
    {causa:'Diluição por combustível',ocorrencias:5,pct:9,acumulado:90,cor:'#22c55e'},
    {causa:'Falha no arrefecimento',ocorrencias:3,pct:5,acumulado:95,cor:'#3b82f6'},
    {causa:'Outras causas',ocorrencias:3,pct:5,acumulado:100,cor:'#6b7280'},
  ];

  var maxOcc = dados[0].ocorrencias;
  var html = '';
  html += '<div class="kgrid k4" style="margin-bottom:16px">';
  html += '<div class="kpi"><div class="kbar" style="background:#ef4444"></div><div class="klbl">Total Ocorrências</div><div class="kval" style="color:#ef4444">'+total+'</div><div class="ksub">Últimos 12 meses</div></div>';
  html += '<div class="kpi"><div class="kbar" style="background:var(--gold)"></div><div class="klbl">Top 2 Causas</div><div class="kval" style="color:var(--gold)">53%</div><div class="ksub">Das ocorrências</div></div>';
  html += '<div class="kpi"><div class="kbar" style="background:#14b8a6"></div><div class="klbl">Top 4 Causas</div><div class="kval" style="color:#14b8a6">81%</div><div class="ksub">Regra de Pareto (80/20)</div></div>';
  html += '<div class="kpi"><div class="kbar" style="background:var(--green)"></div><div class="klbl">Motores Afetados</div><div class="kval" style="color:var(--green)">5</div><div class="ksub">Com ocorrências registradas</div></div>';
  html += '</div>';
  html += '<div class="card" style="margin-bottom:16px"><div class="ctitle">📊 Diagrama de Pareto — Causas de Falha por Análise de Óleo</div>';
  html += '<div style="font-size:11px;color:var(--muted2);margin-bottom:16px">Últimos 12 meses · '+total+' ocorrências analisadas · Linha vermelha = 80% acumulado</div>';
  html += '<div style="position:relative;padding:0 0 40px">';
  dados.forEach(function(d, i){
    var barH = Math.round(d.ocorrencias/maxOcc*160);
    var accH = Math.round(d.acumulado/100*160);
    html += '<div style="display:inline-block;vertical-align:bottom;width:calc('+Math.round(100/dados.length)+'% - 8px);margin:0 4px;text-align:center">';
    html += '<div style="font-size:11px;font-weight:700;color:'+d.cor+';margin-bottom:2px">'+d.ocorrencias+'</div>';
    html += '<div style="height:'+barH+'px;background:'+d.cor+';border-radius:4px 4px 0 0;position:relative;transition:height .4s"></div>';
    html += '<div style="font-size:9px;color:var(--muted2);margin-top:4px;line-height:1.3;word-break:break-word">'+d.causa.split(' ').slice(0,3).join(' ')+'</div>';
    html += '</div>';
  });
  html += '</div>';
  html += '<div style="overflow-x:auto;margin-top:16px"><table>';
  html += '<thead><tr><th>#</th><th>Causa</th><th>Ocorrências</th><th>%</th><th>% Acumulado</th><th>Prioridade</th></tr></thead><tbody>';
  dados.forEach(function(d, i){
    var prior = d.acumulado <= 80 ? '<span style="background:#ef444415;color:#ef4444;border:1px solid #ef444433;border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700">ALTA</span>' :
                d.acumulado <= 95 ? '<span style="background:#f59e0b15;color:#92400e;border:1px solid #f59e0b33;border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700">MÉDIA</span>' :
                '<span style="background:#6b728015;color:#9ca3af;border:1px solid #6b728033;border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700">BAIXA</span>';
    html += '<tr>';
    html += '<td style="font-weight:700;color:'+d.cor+'">'+(i+1)+'</td>';
    html += '<td><strong>'+d.causa+'</strong></td>';
    html += '<td style="font-weight:600">'+d.ocorrencias+'</td>';
    html += '<td>'+d.pct+'%</td>';
    html += '<td><div style="display:flex;align-items:center;gap:6px"><div style="width:60px;height:5px;background:var(--s3);border-radius:3px;overflow:hidden"><div style="width:'+d.acumulado+'%;height:100%;background:'+d.cor+';border-radius:3px"></div></div>'+d.acumulado+'%</div></td>';
    html += '<td>'+prior+'</td>';
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  html += '<div style="margin-top:16px;background:#ef444415;border:1px solid #ef444433;border-radius:8px;padding:12px">';
  html += '<div style="font-size:11px;font-weight:700;color:#ef4444;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">🎯 Foco de Ação — Princípio 80/20</div>';
  html += '<div style="font-size:12.5px;color:var(--muted2)">Concentrar esforços nas <strong style="color:var(--text)">4 primeiras causas</strong> elimina <strong style="color:#ef4444">81% das ocorrências</strong>: (1) controle de intervalo de troca, (2) manutenção de filtro de ar, (3) análise periódica de silício, (4) monitoramento de temperatura.</div>';
  html += '</div></div>';
  html += '<div class="card"><div class="ctitle">🔍 Causas por Motor</div>';
  html += '<div style="overflow-x:auto;margin-top:12px"><table><thead><tr><th>Motor</th><th>Principal Causa</th><th>Ocorrências</th><th>Status Atual</th><th>Ação</th></tr></thead><tbody>';
  var motoresDados = [
    {motor:'Gerador Cummins QSB6.7',causa:'Filtro ar + Água no óleo',occ:8,status:'critico'},
    {motor:'Trator John Deere 8520',causa:'Intervalo troca + Acidez',occ:7,status:'critico'},
    {motor:'Bomba KSB 150',causa:'Viscosidade baixa',occ:5,status:'atencao'},
    {motor:'Colheitadeira New Holland',causa:'Ferro elevado',occ:4,status:'anormal'},
    {motor:'Trator Massey Ferguson',causa:'Monitoramento preventivo',occ:2,status:'normal'},
  ];
  motoresDados.forEach(function(m){
    var sc = {critico:'#ef4444',anormal:'#dc2626',atencao:'#f59e0b',normal:'#22c55e'}[m.status]||'#888';
    html += '<tr>';
    html += '<td><strong>'+m.motor+'</strong></td>';
    html += '<td style="color:var(--muted2)">'+m.causa+'</td>';
    html += '<td style="font-weight:600;color:'+sc+'">'+m.occ+'</td>';
    html += '<td><span style="background:'+sc+'15;color:'+sc+';border:1px solid '+sc+'33;border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700">'+m.status.toUpperCase()+'</span></td>';
    html += '<td><button class="btn btn-gh btn-sm" onclick="APP.oilPage=\'causaraiz\';render()">🌳 Ver Causa Raiz</button></td>';
    html += '</tr>';
  });
  html += '</tbody></table></div></div>';
  return html;
}
