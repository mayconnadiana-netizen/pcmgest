<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,viewport-fit=cover"/>
<title>Gestão Integrada — PCM</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0c0f;--s1:#111417;--s2:#181c22;--s3:#1f242d;
  --border:#252c38;--border2:#2e3848;
  --gold:#e8a000;--gold2:#fbbf24;--goldl:#e8a00022;
  --blue:#3b82f6;--bluel:#3b82f622;
  --green:#22c55e;--greenl:#22c55e22;
  --red:#ef4444;--redl:#ef444422;
  --amber:#f59e0b;--amberl:#f59e0b22;
  --purple:#a855f7;--purplel:#a855f722;
  --text:#dde3ef;--muted:#5a6478;--muted2:#8896af;
  --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;--disp:'Bebas Neue',cursive;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);height:100vh;overflow:hidden;-webkit-text-size-adjust:100%}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.shell{display:flex;height:100vh;overflow:hidden}
.sidebar{width:215px;min-width:215px;background:var(--s1);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.content{flex:1;overflow-y:auto;padding:22px 24px}
.topbar{background:var(--s1);border-bottom:1px solid var(--border);padding:12px 22px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.tb-title{font-family:var(--disp);font-size:20px;letter-spacing:1px}
.tb-sub{font-size:11px;color:var(--muted);margin-top:2px}
.sb-hdr{padding:16px 14px 12px;border-bottom:1px solid var(--border)}
.sb-name{font-family:var(--disp);font-size:15px;letter-spacing:1px}
.sb-sub{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:2px}
.sb-bdg{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:600;margin-top:5px;border:1px solid}
.sb-bdg.g{background:var(--goldl);color:var(--gold);border-color:#e8a00044}
.sb-bdg.b{background:var(--bluel);color:var(--blue);border-color:#3b82f644}
.sb-bdg.p{background:var(--purplel);color:var(--purple);border-color:#a855f744}
.sb-sec{padding:10px 14px 3px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;font-weight:600}
.sb-item{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:13px;font-weight:500;color:var(--muted2);border-left:2px solid transparent;cursor:pointer;transition:all .1s;user-select:none}
.sb-item:hover{color:var(--text);background:var(--s2)}
.sb-item.act{color:var(--text);border-left-color:var(--gold);background:var(--goldl)}
.sb-item.act-b{color:var(--text);border-left-color:var(--blue);background:var(--bluel)}
.sb-item.act-p{color:var(--text);border-left-color:var(--purple);background:var(--purplel)}
.pill{margin-left:auto;padding:1px 7px;border-radius:20px;font-size:10px;font-weight:700;min-width:18px;text-align:center}
.pill.g{background:var(--gold);color:#000}.pill.b{background:var(--blue);color:#fff}
.pill.r{background:var(--red);color:#fff}.pill.p{background:var(--purple);color:#fff}
.sb-foot{margin-top:auto;padding:10px 14px;border-top:1px solid var(--border)}
.card{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:14px}
.ctitle{font-family:var(--disp);font-size:14px;letter-spacing:.5px;color:var(--gold);margin-bottom:12px}
.ctitle.b{color:var(--blue)}.ctitle.p{color:var(--purple)}
.kgrid{display:grid;gap:11px;margin-bottom:18px}
.k4{grid-template-columns:repeat(4,1fr)}.k3{grid-template-columns:repeat(3,1fr)}.k2{grid-template-columns:repeat(2,1fr)}
.kpi{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;position:relative;overflow:hidden}
.kbar{position:absolute;top:0;left:0;right:0;height:2px}
.klbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;font-weight:600}
.kval{font-family:var(--disp);font-size:32px;line-height:1;margin:4px 0 2px;letter-spacing:1px}
.kval.sm{font-size:18px;margin-top:7px;letter-spacing:0}
.ksub{font-size:11px;color:var(--muted2)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;padding:7px 11px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 11px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#ffffff04}
.bdg{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;text-transform:uppercase;white-space:nowrap;border:1px solid}
.bdg.ok{background:var(--greenl);color:#4ade80;border-color:#22c55e44}
.bdg.warn{background:var(--goldl);color:var(--gold2);border-color:#e8a00044}
.bdg.err{background:var(--redl);color:#fca5a5;border-color:#ef444444}
.bdg.info{background:var(--bluel);color:#93c5fd;border-color:#3b82f644}
.bdg.amr{background:var(--amberl);color:#fcd34d;border-color:#f59e0b44}
.bdg.neu{background:var(--s3);color:var(--muted2);border-color:var(--border)}
.bdg.pur{background:var(--purplel);color:#d8b4fe;border-color:#a855f744}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border:none;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;transition:all .13s;white-space:nowrap;font-family:var(--font);line-height:1}
.btn:active{transform:scale(.97)}
.btn-g{background:var(--gold);color:#000}.btn-g:hover{background:var(--gold2)}
.btn-b{background:var(--blue);color:#fff}.btn-b:hover{filter:brightness(1.15)}
.btn-p{background:var(--purple);color:#fff}.btn-p:hover{filter:brightness(1.15)}
.btn-gh{background:var(--s3);border:1px solid var(--border);color:var(--muted2)}.btn-gh:hover{border-color:var(--border2);color:var(--text)}
.btn-d{background:var(--redl);border:1px solid #ef444444;color:#fca5a5}.btn-d:hover{background:#ef444430}
.btn-sm{padding:4px 9px;font-size:11.5px}
.frow{display:grid;gap:11px;margin-bottom:11px}
.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:1fr 1fr 1fr}.c4{grid-template-columns:1fr 1fr 1fr 1fr}
label{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:3px}
input,select,textarea{width:100%;padding:7px 10px;background:var(--bg);border:1px solid var(--border2);border-radius:7px;color:var(--text);font-size:13px;outline:none;transition:border-color .15s;font-family:var(--font)}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 2px #e8a00018}
.fb input:focus,.fb select:focus{border-color:var(--blue);box-shadow:0 0 0 2px #3b82f618}
.fp input:focus,.fp select:focus{border-color:var(--purple);box-shadow:0 0 0 2px #a855f718}
select option{background:var(--s1)}
textarea{resize:vertical;min-height:60px}
.herr{font-size:11px;color:#fca5a5;margin-top:2px}
.overlay{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:500;padding:20px}
.modal{background:var(--s2);border:1px solid var(--border2);border-radius:12px;padding:22px;width:min(600px,96vw);max-height:90vh;overflow-y:auto;animation:fu .18s}
.mtitle{font-family:var(--disp);font-size:19px;letter-spacing:.5px;margin-bottom:16px;color:var(--gold)}
.mtitle.b{color:var(--blue)}.mtitle.p{color:var(--purple)}
.mfoot{display:flex;gap:7px;justify-content:flex-end;margin-top:16px;padding-top:13px;border-top:1px solid var(--border)}
.shdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;gap:10px;flex-wrap:wrap}
.stitle{font-family:var(--disp);font-size:16px;letter-spacing:.5px}
.toast-wrap{position:fixed;bottom:18px;right:18px;z-index:9999;display:flex;flex-direction:column;gap:7px;pointer-events:none}
.toast{background:var(--s2);border:1px solid var(--border2);border-radius:8px;padding:9px 15px;font-size:12.5px;color:var(--text);display:flex;align-items:center;gap:7px;pointer-events:all;max-width:300px;animation:si .2s ease}
.toast.ok{border-left:3px solid var(--green)}.toast.err{border-left:3px solid var(--red);color:#fca5a5}
.toast.info{border-left:3px solid var(--blue);color:#93c5fd}.toast.warn{border-left:3px solid var(--amber);color:#fcd34d}
.toast-fade{opacity:0;transition:opacity .2s}
.infobox{background:var(--s3);border:1px solid var(--border2);border-radius:7px;padding:12px 14px;margin-bottom:12px;font-size:12.5px}
.empty{text-align:center;padding:36px 20px;color:var(--muted)}
.empty .ei{font-size:32px;margin-bottom:8px}.empty p{font-size:13px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;color:#000;flex-shrink:0;font-family:var(--disp)}
/* COVER */
.cover{height:100vh;max-height:100vh;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 20px;position:relative;overflow:hidden}
.cgrid{position:absolute;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:44px 44px;opacity:.18;pointer-events:none}
.cglow{position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(#e8a00012,transparent 65%);top:50%;left:50%;transform:translate(-50%,-50%)}
.cinner{position:relative;z-index:1;text-align:center;max-width:900px;width:100%;animation:fu .4s}
.ceye{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:4px;margin-bottom:14px;font-weight:600}
.ctit{font-family:var(--disp);font-size:clamp(44px,7vw,80px);letter-spacing:2px;line-height:.92;margin-bottom:10px}
.ctit span{color:var(--gold)}
.csub{font-size:14px;color:var(--muted2);margin:0 auto 44px;line-height:1.7;max-width:380px}
.ccards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;width:100%}
.ccard{background:var(--s1);border:1px solid var(--border);border-radius:13px;padding:24px 22px;cursor:pointer;transition:all .22s;text-align:left}
.ccard.cg:hover{border-color:#e8a00060;transform:translateY(-4px)}
.ccard.cb:hover{border-color:#3b82f660;transform:translateY(-4px)}
.ccard.cp:hover{border-color:#a855f760;transform:translateY(-4px)}
.ccard-ico{font-size:34px;margin-bottom:12px}
.ccard-name{font-family:var(--disp);font-size:24px;letter-spacing:1px;margin-bottom:5px}
.ccard-name.g{color:var(--gold)}.ccard-name.b{color:var(--blue)}.ccard-name.p{color:var(--purple)}
.ccard-desc{font-size:12.5px;color:var(--muted2);line-height:1.7;margin-bottom:14px}
.ctags{display:flex;flex-wrap:wrap;gap:5px}
.ctag{padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;border:1px solid}
.ctag.g{background:var(--goldl);color:var(--gold2);border-color:#e8a00044}
.ctag.b{background:var(--bluel);color:#93c5fd;border-color:#3b82f644}
.ctag.p{background:var(--purplel);color:#d8b4fe;border-color:#a855f744}
/* BIBLIOTECA */
.lib-wrap{display:flex;height:calc(100vh - 97px);overflow:hidden}
.lib-tree{width:260px;min-width:260px;border-right:1px solid var(--border);overflow-y:auto;padding:12px 0;flex-shrink:0}
.lib-main{flex:1;overflow-y:auto;padding:20px 22px}
.tree-item{display:flex;align-items:center;gap:6px;padding:7px 14px 7px 0;font-size:13px;cursor:pointer;border-radius:6px;transition:background .1s;user-select:none}
.tree-item:hover{background:var(--s2)}.tree-item.selected{background:var(--purplel);color:var(--purple)}
.tree-item .toggle{width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;color:var(--muted);transition:transform .15s}
.tree-item .toggle.open{transform:rotate(90deg)}
.tree-item .ico{font-size:15px;flex-shrink:0}.tree-item .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-item .cnt{font-size:10px;color:var(--muted);flex-shrink:0}
.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.file-card{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;transition:all .15s}
.file-card:hover{border-color:var(--purple);transform:translateY(-2px)}
.file-ico{font-size:38px;margin-bottom:8px;text-align:center}
.file-name{font-size:12px;font-weight:600;word-break:break-word;line-height:1.4;text-align:center;margin-bottom:4px}
.file-meta{font-size:10px;color:var(--muted);text-align:center}
.file-actions{display:flex;gap:4px;justify-content:center;margin-top:9px}
.breadcrumb{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted2);margin-bottom:16px;flex-wrap:wrap}
.breadcrumb span{cursor:pointer}.breadcrumb span:hover{color:var(--purple)}
.breadcrumb span.cur{color:var(--text);font-weight:600;cursor:default}.breadcrumb .sep{color:var(--muted)}
.drop-zone{border:2px dashed var(--border2);border-radius:10px;padding:28px;text-align:center;transition:all .2s;cursor:pointer;margin-bottom:14px}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--purple);background:var(--purplel)}
.drop-zone .dz-ico{font-size:28px;margin-bottom:7px}.drop-zone p{font-size:12.5px;color:var(--muted2)}
.ctx-menu{position:fixed;background:var(--s2);border:1px solid var(--border2);border-radius:8px;padding:5px;z-index:600;min-width:160px;box-shadow:0 8px 24px #0006;animation:fu .12s}
.ctx-item{padding:7px 12px;font-size:12.5px;border-radius:5px;cursor:pointer;display:flex;align-items:center;gap:7px;color:var(--text)}
.ctx-item:hover{background:var(--s3)}.ctx-item.danger{color:#fca5a5}.ctx-item.danger:hover{background:var(--redl)}
.ctx-sep{height:1px;background:var(--border);margin:4px 0}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes si{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}

/* ═══ RESPONSIVO COMPLETO ═══ */

/* Tablet largo / Desktop pequeno */
@media(max-width:1100px){
  .sidebar{width:185px;min-width:185px}
  .k4{grid-template-columns:repeat(2,1fr)}
  .ccards{grid-template-columns:repeat(2,1fr)}
}

/* Tablet */
@media(max-width:820px){
  .shell{flex-direction:column}
  .sidebar{width:100%;min-width:0;height:auto;flex-direction:row;flex-wrap:wrap;border-right:none;border-bottom:1px solid var(--border);overflow-x:auto;overflow-y:visible}
  .sb-hdr{padding:10px 12px;border-bottom:none;border-right:1px solid var(--border);flex-shrink:0}
  .sb-name{font-size:13px}.sb-sub{display:none}.sb-bdg{display:none}
  .sb-sec{display:none}
  .sb-item{padding:8px 12px;font-size:12px;border-left:none;border-bottom:2px solid transparent;white-space:nowrap}
  .sb-item.act{border-left:none;border-bottom-color:var(--gold)}
  .sb-item.act-b{border-left:none;border-bottom-color:var(--blue)}
  .sb-item.act-p{border-left:none;border-bottom-color:var(--purple)}
  .sb-foot{margin-top:0;padding:6px 10px;border-top:none;border-left:1px solid var(--border);margin-left:auto;flex-shrink:0}
  .main{min-height:0;flex:1}
  .content{padding:14px 14px}
  .topbar{padding:10px 14px}
  .k4{grid-template-columns:repeat(2,1fr)}
  .k3{grid-template-columns:repeat(2,1fr)}
  .g2{grid-template-columns:1fr}
  .ccards{grid-template-columns:1fr}
  .kval{font-size:24px}
  .lib-wrap{flex-direction:column;height:auto}
  .lib-tree{width:100%;min-width:0;border-right:none;border-bottom:1px solid var(--border);max-height:200px}
  .lib-main{padding:14px}
  table{font-size:11.5px}
  th,td{padding:7px 8px}
  .modal{padding:16px;width:calc(100vw - 24px)}
}

/* Mobile */
@media(max-width:540px){
  .k4{grid-template-columns:1fr 1fr}
  .k3{grid-template-columns:1fr 1fr}
  .k2{grid-template-columns:1fr}
  .kval{font-size:20px}
  .kval.sm{font-size:14px}
  .klbl{font-size:9px}
  .topbar{flex-direction:column;align-items:flex-start;gap:6px}
  .tb-title{font-size:16px}
  .tb-sub{font-size:10px}
  .shdr{flex-direction:column;align-items:flex-start}
  .stitle{font-size:14px}
  .content{padding:10px}
  .card{padding:12px}
  .login-box{padding:24px 18px}
  .confirm-box{padding:20px 18px}
  th,td{padding:5px 6px}
  th{font-size:9px}
  td{font-size:11px}
  .btn{padding:6px 10px;font-size:11.5px}
  .btn-sm{padding:3px 7px;font-size:10.5px}
  .frow.c2,.frow.c3,.frow.c4{grid-template-columns:1fr}
  .file-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .user-row{flex-wrap:wrap}
  .user-acts{width:100%;justify-content:flex-end}
  .net-bar{font-size:10.5px;padding:6px 10px}
  .g3{grid-template-columns:1fr}
  .ccards{grid-template-columns:1fr}
  .ccard{padding:16px 14px}
  .ccard-name{font-size:18px}
}

/* Mobile muito pequeno */
@media(max-width:360px){
  .k4,.k3,.k2{grid-template-columns:1fr}
  .login-box{padding:20px 14px}
  .sb-item span:last-child{display:none}
}
/* LOGIN */
.login-wrap{min-height:100vh;height:100%;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:clamp(12px,4vw,32px);position:relative;overflow-y:auto;overflow-x:hidden}
.login-grid{position:absolute;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:44px 44px;opacity:.15;pointer-events:none}
.login-glow{position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(#e8a00010,transparent 65%);top:50%;left:50%;transform:translate(-50%,-50%)}
.login-box{position:relative;z-index:1;background:var(--s1);border:1px solid var(--border2);border-radius:16px;padding:clamp(20px,5vw,36px) clamp(18px,6vw,38px);width:100%;max-width:min(420px,96vw);animation:fu .3s}
.login-logo{font-family:var(--disp);font-size:clamp(24px,5vw,36px);letter-spacing:2px;text-align:center;margin-bottom:4px}
.login-logo span{color:var(--gold)}
.login-eye{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:3px;text-align:center;margin-bottom:28px}
.login-tabs{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:3px;gap:3px;margin-bottom:22px}
.login-tab{flex:1;padding:7px;text-align:center;font-size:12.5px;font-weight:600;border-radius:6px;cursor:pointer;color:var(--muted2);transition:all .15s}
.login-tab.act{background:var(--s2);color:var(--text);border:1px solid var(--border2)}
.login-field{margin-bottom:13px}
.login-field label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;display:block;margin-bottom:4px}
.login-field input{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-size:13.5px;outline:none;transition:border-color .15s;font-family:var(--font)}
.login-field input:focus{border-color:var(--gold);box-shadow:0 0 0 2px #e8a00018}
.login-btn{width:100%;padding:11px;background:var(--gold);color:#000;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font);letter-spacing:.5px;transition:all .15s;margin-top:6px}
.login-btn:hover{background:var(--gold2)}.login-btn:active{transform:scale(.98)}
.login-btn.b{background:var(--blue);color:#fff}.login-btn.b:hover{filter:brightness(1.15)}

<body>
<div id="net-bar" class="net-bar"></div>
<div id="root"></div>
<div class="toast-wrap" id="toasts"></div>
<script>
// ═══════ AUTH ═══════
// E-mail do administrador — altere para o seu
const ADMIN_EMAIL = 'admin@pcmgest.com';

const AUTH = {
  _key: 'gi_auth_user',
  _usersKey: 'gi_users_cache',

  // Usuário atual em sessão
  current() {
    try { return JSON.parse(sessionStorage.getItem(this._key) || 'null'); } catch(e){ return null; }
  },
  save(u) { sessionStorage.setItem(this._key, JSON.stringify(u)); },
  logout() { sessionStorage.removeItem(this._key); APP = {...APP, module:null, page:'dash', unidade:null}; localStorage.removeItem('gi_unidade'); render(); },
  isAdmin() { const u=this.current(); return u && u.email === ADMIN_EMAIL; },
  isLogged() { return !!this.current(); },

  // Hash simples (SHA-256 via SubtleCrypto)
  async hash(str) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  },

  // Busca usuário no Firebase (coleção "users")
  async findUser(email) {
    try {
      const r = await fetch(`https://firestore.googleapis.com/v1/projects/pcm-gest/databases/(default)/documents/users/${encodeURIComponent(email)}?key=AIzaSyDylbEPtXs35nw9r2Q1n8lSou5r8u2c_WA`);
      if (!r.ok) return null;
      const d = await r.json();
      if (!d.fields) return null;
      return FB.fromFS(d);
    } catch(e){ return null; }
  },

  // Salva usuário no Firebase
  async saveUser(user) {
    await FB.set('users', user.email, user);
  },

  // Lista todos os usuários
  async listUsers() {
    return await FB.getAll('users');
  },

  // Login
  async login(email, password) {
    email = email.trim().toLowerCase();
    const hashed = await this.hash(password);
    const user = await this.findUser(email);
    if (!user) return { ok: false, msg: 'E-mail não encontrado.' };
    if (user.passwordHash !== hashed) return { ok: false, msg: 'Senha incorreta.' };
    if (user.status === 'pending') return { ok: false, msg: 'pending' };
    if (user.status === 'blocked') return { ok: false, msg: 'Conta bloqueada. Entre em contato com o administrador.' };
    this.save(user);
    return { ok: true };
  },

  // Registro
  async register(name, email, password) {
    email = email.trim().toLowerCase();
    if (!name || !email || !password) return { ok: false, msg: 'Preencha todos os campos.' };
    if (password.length < 6) return { ok: false, msg: 'A senha deve ter no mínimo 6 caracteres.' };
    const existing = await this.findUser(email);
    if (existing) return { ok: false, msg: 'Este e-mail já está cadastrado.' };
    const hashed = await this.hash(password);
    const isAdmin = email === ADMIN_EMAIL;
    const user = {
      id: uid(),
      email,
      name,
      passwordHash: hashed,
      status: isAdmin ? 'active' : 'pending',
      role: isAdmin ? 'admin' : 'user',
      createdAt: new Date().toISOString()
    };
    await this.saveUser(user);
    if (isAdmin) { this.save(user); return { ok: true }; }
    return { ok: true, pending: true };
  },

  // Admin: aprovar usuário com unidades
  async approveUser(email, unidades) {
    const u = await this.findUser(email);
    if (!u) return;
    const upd = {...u, status:'active'};
    if(unidades !== undefined) upd.unidades = unidades; // array ou null (= todas)
    await this.saveUser(upd);
  },

  // Admin: atualizar unidades de usuário ativo
  async setUnidades(email, unidades) {
    const u = await this.findUser(email);
    if (!u) return;
    await this.saveUser({...u, unidades});
  },

  // Unidades acessíveis ao usuário atual
  unidadesPermitidas() {
    const u = this.current();
    if (!u) return [];
    if (u.role === 'admin') return null; // null = todas
    if (!u.unidades || u.unidades.length === 0) return [];
    return u.unidades;
  },

  // Admin: bloquear usuário
  async blockUser(email) {
    const u = await this.findUser(email);
    if (!u) return;
    await this.saveUser({...u, status:'blocked'});
  },

  // Admin: excluir usuário
  async deleteUser(email) {
    await FB.delete('users', email);
  }
};

// ═══════ FIREBASE ═══════
// ⚠ ATENÇÃO: A API Key abaixo está exposta no código-fonte. Restrinja o domínio
// permitido no console do Firebase: https://console.firebase.google.com →
// APIs & Services → Credentials → Restrições de aplicação HTTP.
const firebaseConfig={apiKey:"AIzaSyDylbEPtXs35nw9r2Q1n8lSou5r8u2c_WA",projectId:"pcm-gest"};
const FB={
  base(col){return`https://firestore.googleapis.com/v1/projects/${firebaseConfig.projectId}/databases/(default)/documents/${col}`},
  key(){return firebaseConfig.apiKey},
  toFS(obj){const f={};for(const[k,v]of Object.entries(obj)){if(v===null||v===undefined)f[k]={nullValue:null};else if(typeof v==='boolean')f[k]={booleanValue:v};else if(typeof v==='number')f[k]={doubleValue:v};else if(typeof v==='string')f[k]={stringValue:v};else f[k]={stringValue:JSON.stringify(v)};}return{fields:f}},
  fromFS(doc){if(!doc||!doc.fields)return null;const o={};for(const[k,v]of Object.entries(doc.fields)){if(v.nullValue!==undefined)o[k]=null;else if(v.booleanValue!==undefined)o[k]=v.booleanValue;else if(v.doubleValue!==undefined)o[k]=v.doubleValue;else if(v.integerValue!==undefined)o[k]=Number(v.integerValue);else if(v.stringValue!==undefined){try{const p=JSON.parse(v.stringValue);o[k]=(typeof p==='object'&&p!==null)?p:v.stringValue;}catch(e){o[k]=v.stringValue;}}}return o},
  async getAll(col){try{const r=await fetch(`${this.base(col)}?key=${this.key()}&pageSize=300`);if(!r.ok)return[];const d=await r.json();if(!d.documents)return[];return d.documents.map(doc=>this.fromFS(doc));}catch(e){return[];}},
  async set(col,id,obj){try{await fetch(`${this.base(col)}/${encodeURIComponent(id)}?key=${this.key()}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(this.toFS(obj))});}catch(e){}},
  async delete(col,id){try{await fetch(`${this.base(col)}/${encodeURIComponent(id)}?key=${this.key()}`,{method:'DELETE'});}catch(e){}}
};

// ═══════ LOCAL CACHE ═══════
const KEYS={tools:'gi_tools',mechs:'gi_mechs',loans:'gi_loans',machines:'gi_machines',batteries:'gi_batteries',batHist:'gi_bathist',libTree:'gi_libtree'};
const LOCAL={
  get(k){try{return JSON.parse(localStorage.getItem(KEYS[k])||'[]')}catch(e){return[]}},
  set(k,v){try{localStorage.setItem(KEYS[k],JSON.stringify(v))}catch(e){}},
  upsert(k,obj){const a=LOCAL.get(k);const i=a.findIndex(x=>x.id===obj.id);if(i>=0)a[i]={...a[i],...obj};else a.push(obj);LOCAL.set(k,a)},
  remove(k,id){LOCAL.set(k,LOCAL.get(k).filter(x=>x.id!==id))},
  find(k,id){return LOCAL.get(k).find(x=>x.id===id)||null}
};

// ═══════ OFFLINE QUEUE ═══════
const QUEUE_KEY = 'gi_sync_queue';
const QUEUE = {
  get(){ try{ return JSON.parse(localStorage.getItem(QUEUE_KEY)||'[]'); }catch(e){ return []; } },
  add(op){ const q=this.get(); q.push({...op, _qid: uid(), _ts: Date.now()}); localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); NET.updateBar(); },
  remove(qid){ const q=this.get().filter(x=>x._qid!==qid); localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); },
  clear(){ localStorage.removeItem(QUEUE_KEY); },
  count(){ return this.get().length; }
};

const NET = {
  _online: navigator.onLine,
  _syncing: false,

  init(){
    window.addEventListener('online',  ()=>{ this._online=true;  this.updateBar(); this.flushQueue(); });
    window.addEventListener('offline', ()=>{ this._online=false; this.updateBar(); });
    this.updateBar();
  },

  isOnline(){ return this._online && navigator.onLine; },

  updateBar(){
    const bar = document.getElementById('net-bar');
    if(!bar) return;
    const pending = QUEUE.count();
    if(this._syncing){
      bar.className='net-bar show syncing';
      bar.innerHTML=`<div class="net-bar-left"><div class="net-dot"></div>Sincronizando com o servidor...</div><div>${pending} pendente(s)</div>`;
    } else if(!this.isOnline()){
      bar.className='net-bar show offline';
      bar.innerHTML=`<div class="net-bar-left"><div class="net-dot"></div>⚠ Sem internet — dados salvos localmente${pending>0?`, <strong>${pending} aguardando envio</strong>`:''}</div>${pending>0?'<span class="net-pending">'+pending+' na fila</span>':''}`;
    } else if(pending>0){
      bar.className='net-bar show syncing';
      bar.innerHTML=`<div class="net-bar-left"><div class="net-dot"></div>Enviando ${pending} alteração(ões) pendente(s)...</div>`;
      this.flushQueue();
    } else {
      bar.className='net-bar show synced';
      bar.innerHTML=`<div class="net-bar-left"><div class="net-dot"></div>Online · dados sincronizados</div>`;
      setTimeout(()=>{ const b=document.getElementById('net-bar'); if(b) b.classList.remove('show'); },3000);
    }
  },

  async flushQueue(){
    if(this._syncing || !this.isOnline()) return;
    const queue = QUEUE.get();
    if(queue.length === 0){ this.updateBar(); return; }
    this._syncing = true;
    this.updateBar();
    let failed = 0;
    for(const op of queue){
      try{
        if(op.type==='set')   await FB.set(op.col, op.id, op.data);
        if(op.type==='delete') await FB.delete(op.col, op.id);
        QUEUE.remove(op._qid);
      }catch(e){ failed++; }
    }
    this._syncing = false;
    if(failed>0){ toast(`${failed} item(s) não sincronizaram. Tentando novamente...`,'warn'); }
    this.updateBar();
  }
};

// ═══════ DB ═══════
const DB={
  get(k){
    const all=LOCAL.get(k);
    if(!APP.unidade) return all;
    return all.filter(x=>!x.unidade||x.unidade===APP.unidade);
  },
  find(k,id){return this.get(k).find(x=>x.id===id)||null},
  async add(k,obj){
    const withU={...obj, unidade: APP.unidade||'geral'};
    LOCAL.upsert(k, withU);
    if(NET.isOnline()){ FB.set(k, withU.id, withU); }
    else { QUEUE.add({type:'set', col:k, id:withU.id, data:withU}); NET.updateBar(); }
    return withU;
  },
  async update(k,id,data){
    const e=LOCAL.find(k,id)||{};
    const u={...e,...data,id,unidade:APP.unidade||'geral'};
    LOCAL.upsert(k,u);
    if(NET.isOnline()){ FB.set(k,id,u); }
    else { QUEUE.add({type:'set', col:k, id, data:u}); NET.updateBar(); }
    return u;
  },
  async remove(k,id){
    LOCAL.remove(k,id);
    if(NET.isOnline()){ FB.delete(k,id); }
    else { QUEUE.add({type:'delete', col:k, id}); NET.updateBar(); }
  },
  async syncAll(){
    const tables=['tools','mechs','loans','machines','batteries','batHist','libTree'];
    let total=0;
    // Primeiro envia fila pendente se estiver online
    if(NET.isOnline()) await NET.flushQueue();
    await Promise.all(tables.map(async t=>{
      const docs=await FB.getAll(t);
      if(docs.length>0){
        // Mescla: mantém registros locais que não vieram do Firebase (criados offline)
        const local=LOCAL.get(t);
        const fbIds=new Set(docs.map(d=>d.id));
        const onlyLocal=local.filter(l=>!fbIds.has(l.id));
        LOCAL.set(t,[...docs,...onlyLocal]);
        total+=docs.length;
      }
    }));
    return total;
  }
};

function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)}
function fmt(v){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0)}
function fmtD(s){return s?new Date(s).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'—'}
function fmtDate(s){if(!s)return'—';var d=new Date(s.includes('T')?s:s+'T12:00:00');return isNaN(d)?'—':d.toLocaleDateString('pt-BR');}
function fmtSize(b){if(!b)return'—';if(b<1024)return b+'B';if(b<1048576)return(b/1024).toFixed(1)+'KB';return(b/1048576).toFixed(1)+'MB'}
function nowDT(){return new Date().toISOString().slice(0,16)}
function daysLeft(d){return d?Math.floor((new Date(d)-new Date())/86400000):null}
function daysAgo(d){return Math.max(0,Math.floor((new Date()-new Date(d))/86400000))}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fileIcon(ext){const m={pdf:'📄',xlsx:'📊',xls:'📊',docx:'📝',doc:'📝',pptx:'📋',ppt:'📋',txt:'📃',csv:'📊',zip:'🗜',jpg:'🖼',jpeg:'🖼',png:'🖼'};return m[ext?.toLowerCase()]||'📎'}
function fileType(ext){const m={pdf:'PDF',xlsx:'Excel',xls:'Excel',docx:'Word',doc:'Word',pptx:'PPT',csv:'CSV',txt:'Texto'};return m[ext?.toLowerCase()]||ext?.toUpperCase()||'Arquivo'}
function wBadge(w){const d=daysLeft(w);if(d===null)return`<span class="bdg neu">Sem garantia</span>`;if(d<0)return`<span class="bdg err">⚠ Venc. há ${Math.abs(d)}d</span>`;if(d<60)return`<span class="bdg amr">⏳ ${d}d</span>`;if(d<180)return`<span class="bdg warn">✓ ${d}d</span>`;return`<span class="bdg ok">✓ Válida</span>`}

let _importRows = [];

function handleImportDrop(e, type){
  e.preventDefault();
  document.getElementById('import-drop').classList.remove('drag');
  const file = e.dataTransfer.files[0];
  if(file) processImportFile(file, type);
}

function handleImportFile(input, type){
  const file = input.files[0];
  if(file) processImportFile(file, type);
}

function processImportFile(file, type){
  const s = SCHEMAS[type];
  const reader = new FileReader();
  reader.onload = e => {
    try{
      let rows = [];
      if(file.name.endsWith('.csv')){
        const text = e.target.result;
        rows = text.split('\n').map(l=>l.split(/[,;]/).map(c=>c.trim().replace(/^"|"$/g,'')));
      } else {
        const wb = XLSX.read(e.target.result, {type:'binary'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
      }
      // Remove cabeçalho e linhas vazias
      const dataRows = rows.slice(1).filter(r=>r.some(c=>c!==''&&c!==null&&c!==undefined));
      _importRows = dataRows.map(row => {
        const err = s.validate(row);
        return { row, err, obj: err ? null : s.toObj(row) };
      });
      renderImportPreview(type, s);
    } catch(err){
      toast('Erro ao ler arquivo: '+err.message,'err');
    }
  };
  if(file.name.endsWith('.csv')) reader.readAsText(file, 'UTF-8');
  else reader.readAsBinaryString(file);
}

function renderImportPreview(type, s){
  const valid = _importRows.filter(r=>!r.err);
  const invalid = _importRows.filter(r=>r.err);
  document.getElementById('import-drop').style.display='none';
  document.getElementById('import-preview-area').style.display='';
  document.getElementById('import-stats').innerHTML=`
    <div class="import-stat info">📄 ${_importRows.length} linhas lidas</div>
    <div class="import-stat ok">✓ ${valid.length} válidas</div>
    ${invalid.length?`<div class="import-stat err">✕ ${invalid.length} com erro</div>`:''}`;
  const thead = `<thead><tr><th>#</th>${s.headers.map(h=>`<th>${h}</th>`).join('')}<th>Status</th></tr></thead>`;
  const tbody = '<tbody>'+_importRows.map((r,i)=>`
    <tr class="${r.err?'import-row-err':'import-row-ok'}">
      <td>${i+1}</td>
      ${r.row.slice(0,s.headers.length).map(c=>`<td>${esc(String(c??''))}</td>`).join('')}
      <td>${r.err?`<span style="color:#fca5a5">✕ ${esc(r.err)}</span>`:'<span style="color:#4ade80">✓</span>'}</td>
    </tr>`).join('')+'</tbody>';
  document.getElementById('import-table').innerHTML = thead+tbody;
  if(!valid.length) document.getElementById('import-confirm-btn').disabled=true;
}

async function confirmImport(type){
  const valid = _importRows.filter(r=>!r.err);
  if(!valid.length){ toast('Nenhum registro válido.','warn'); return; }
  const btn = document.getElementById('import-confirm-btn');
  btn.disabled=true; btn.textContent='Importando...';
  let ok=0, fail=0;
  for(const {obj} of valid){
    try{ await DB.add(type, {...obj, id:uid()}); ok++; }
    catch(e){ fail++; }
  }
  closeModal();
  toast(`${ok} ${SCHEMAS[type].label} importados com sucesso!${fail?` (${fail} falharam)`:''}`, ok?'ok':'err');
  render();
}

  return`<div class="shell">

async function adminApprove(email){
  await AUTH.approveUser(email);
  toast('Usuário aprovado!','ok');
  const html=await buildAdminShell();
  document.getElementById('root').innerHTML=html;
}
async function adminBlock(email){
  if(!await customConfirm({title:'Bloquear Usuário',msg:'Este usuário não conseguirá mais acessar o sistema.',icon:'🚫',confirmLabel:'Bloquear',type:'warn'}))return;
  await AUTH.blockUser(email);
  toast('Usuário bloqueado.','warn');
  const html=await buildAdminShell();
  document.getElementById('root').innerHTML=html;
}
async function adminDelete(email){
  if(!await customConfirm({title:'Excluir Usuário',msg:'Esta ação é permanente e não pode ser desfeita.',icon:'👤',confirmLabel:'Sim, excluir'}))return;
  await AUTH.deleteUser(email);
  toast('Usuário removido.','ok');
  const html=await buildAdminShell();
  document.getElementById('root').innerHTML=html;
}

async function adminToggleUnidade(email, unidade){
  const u = await AUTH.findUser(email);
  if(!u) return;
  let perms = Array.isArray(u.unidades) ? [...u.unidades] : [];
  if(perms.includes(unidade)){
    perms = perms.filter(x=>x!==unidade);
    toast(`Acesso à ${unidade} removido.`,'warn');
  } else {
    perms.push(unidade);
    toast(`${unidade} liberada para ${u.name||u.email}!`,'ok');
  }
  await AUTH.setUnidades(email, perms);
  // Atualizar só a sessão caso seja o próprio user logado (não é o caso aqui pois só admin acessa)
  const html=await buildAdminShell();
  document.getElementById('root').innerHTML=html;
}

function oilStatusColor(s){ return {critico:'#ef4444',anormal:'#f87171',atencao:'#f59e0b',normal:'#22c55e'}[s]||'#888'; }
function oilStatusLabel(s){ return {critico:'CRÍTICO',anormal:'ANORMAL',atencao:'ATENÇÃO',normal:'NORMAL'}[s]||s; }
function oilStatusIco(s)  { return {critico:'🛑',anormal:'⚠️',atencao:'⚡',normal:'✅'}[s]||'•'; }
function oilRulColor(v)   { return v<=20?'#ef4444':v<=40?'#f87171':v<=60?'#f59e0b':'#22c55e'; }

function oilParamStatus(val, lim){
  if(val > lim[1]*1.5 || val < lim[0]*0.5) return 'critico';
  if(val > lim[1] || val < lim[0]) return 'anormal';
  if(val > lim[1]*0.85 || (lim[0]>0 && val < lim[0]*1.15)) return 'atencao';
  return 'normal';
}

  html+='<span style="background:var(--s3);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:11px;color:var(--gold)">🛢 '+m.horasOleo+'h óleo</span>';
  html+='</div></div>';
  html+='<div style="text-align:center;background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:16px 20px">';

  html+='<div style="font-size:36px;margin-bottom:10px">🤖</div>';
  html+='<div style="font-family:var(--disp);font-size:16px;color:var(--text);margin-bottom:6px">CLIQUE EM GERAR</div>';
  html+='<div style="font-size:11px;color:var(--muted)">⚠️ Requer internet</div>';
  html+='</div></div>';

  html+='<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px">';
  html+='<div><div class="ctitle">📋 Planos de Ação</div>';
  html+='<div style="font-size:11px;color:var(--muted2);margin-top:2px">'+planos.length+' total · '+pendentes.length+' pendente · '+emExec.length+' exec. · '+concluidos.length+' concluído</div></div>';
  html+='<div style="display:flex;gap:6px">';
  html+='<button class="btn btn-sm" style="background:#14b8a6;color:#000;border:none;border-radius:6px;padding:6px 12px;font-size:11.5px;font-weight:700;cursor:pointer" data-oa="plia" data-oid="'+id+'">🤖 IA</button>';
  html+='<button class="btn btn-g btn-sm" data-oa="plman" data-oid="'+id+'">+ Manual</button>';
  html+='</div></div>';

  if(planos.length===0){
    html+='<div style="padding:24px;text-align:center;color:var(--muted2)"><div style="font-size:32px;margin-bottom:8px">📋</div>';

    if(pendentes.length)html+='<div style="margin-bottom:12px"><div style="font-size:11px;font-weight:700;color:#f59e0b;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">⏳ Pendentes ('+pendentes.length+')</div>'+pendentes.map(mkPlanoCard).join('')+'</div>';
    if(emExec.length)html+='<div style="margin-bottom:12px"><div style="font-size:11px;font-weight:700;color:#3b82f6;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">🔄 Em Execução ('+emExec.length+')</div>'+emExec.map(mkPlanoCard).join('')+'</div>';
    if(concluidos.length)html+='<div><div style="font-size:11px;font-weight:700;color:#22c55e;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">✅ Concluídos ('+concluidos.length+')</div>'+concluidos.map(mkPlanoCard).join('')+'</div>';
  }
  html+='</div>';

  // Event delegation via setTimeout para garantir que o DOM está pronto
  setTimeout(function(){
    document.addEventListener("click",function oilRelDlg(e){
      var t=e.target.closest("[data-oa],[data-pa]");
      if(!t)return;
      var oa=t.dataset.oa, pa=t.dataset.pa, oid=t.dataset.oid, pid=t.dataset.pid, sid=t.dataset.sid;
      if(oa==="back"){document.removeEventListener("click",oilRelDlg);APP.oilPage="maquinas_rel";render();}

      else if(pa==="ini"&&pid)updateOilPlanoStatus(pid,"execucao");
      else if(pa==="con"&&pid)updateOilPlanoStatus(pid,"concluido");
      else if(pa==="del"&&pid)deleteOilPlano(pid);
      else if(pa==="tog"&&pid&&sid)toggleOilPasso(pid,parseInt(sid));
    });
  },50);

  return html;
}

// ── RUL ──
function buildOilRUL(){
  return`
  <div class="card" style="margin-bottom:16px">
    <div class="ctitle">⏱️ Vida Útil Remanescente (RUL) — Modelo Preditivo</div>
    <p style="font-size:12.5px;color:var(--muted2);margin-top:6px;margin-bottom:16px">Estimativa baseada em degradação acumulada de parâmetros-chave (Fe, viscosidade, acidez, oxidação). Modelo: Degradation Index v1.0</p>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>Motor</th><th>RUL (%)</th><th>Horas Est.</th><th>Degradação</th><th>Tendência</th><th>Risco</th><th>Ação</th></tr></thead>
      <tbody>
        ${OIL_MOTORES.map(m=>{
          const horas = Math.round(m.rul*25);
          const trend = m.historico[2].ferro > m.historico[1].ferro*1.3?'Acelerada':'Crescente';
          const tColor = m.historico[2].ferro > m.historico[1].ferro*1.3?'#ef4444':'#f59e0b';
          const risco = m.rul<=20?'ALTO':m.rul<=40?'MÉDIO':'BAIXO';
          const rColor = m.rul<=20?'#ef4444':m.rul<=40?'#f59e0b':'#22c55e';
          return`<tr onclick="APP.oilPage='motor_${m.id}';render()" style="cursor:pointer">
            <td><strong>${esc(m.nome.split(' ').slice(0,3).join(' '))}</strong><br/><span style="font-size:10px;color:var(--muted)">${m.horasMotor}h · ${esc(m.setor)}</span></td>
            <td>
              <div style="display:flex;align-items:center;gap:6px">
                <div style="width:50px;height:6px;background:var(--s3);border-radius:3px;overflow:hidden">
                  <div style="width:${m.rul}%;height:100%;background:${oilRulColor(m.rul)};border-radius:3px"></div>
                </div>
                <span style="font-weight:700;color:${oilRulColor(m.rul)}">${m.rul}%</span>
              </div>
            </td>
            <td style="font-weight:600">~${horas}h</td>
            <td><span class="oil-status-badge ${m.status}">${m.degradacao}%</span></td>
            <td style="color:${tColor};font-weight:600">${trend}</td>
            <td style="color:${rColor};font-weight:700">${risco}</td>
            <td><button class="btn btn-g btn-sm" onclick="event.stopPropagation();openOilPlanoModal('${m.id}')">+ Plano</button></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table></div>
  </div>
  <div class="g2">
    <div class="card">
      <div class="ctitle">🤖 Como o RUL é Calculado</div>
      <div style="font-size:12.5px;color:var(--muted2);line-height:1.8;margin-top:8px">
        <p><strong style="color:var(--text)">Degradation Index</strong> — índice composto baseado em:</p>
        <ul style="padding-left:16px;margin-top:6px">
          <li><strong>Ferro (Fe)</strong> — desgaste mecânico (peso 35%)</li>
          <li><strong>Viscosidade</strong> — capacidade lubrificante (peso 25%)</li>
          <li><strong>Acidez (TAN)</strong> — degradação química (peso 20%)</li>
          <li><strong>Oxidação</strong> — degradação térmica (peso 12%)</li>
          <li><strong>Silício (Si)</strong> — contaminação externa (peso 8%)</li>
        </ul>
        <p style="margin-top:10px"><strong style="color:#14b8a6">Próxima fase:</strong> Modelo LSTM com histórico acumulado de 12+ meses para previsão de série temporal.</p>
      </div>
    </div>
    <div class="card">
      <div class="ctitle">⚠️ Motores em Alerta Crítico de RUL</div>
      ${OIL_MOTORES.filter(m=>m.rul<=40).map(m=>`
      <div onclick="APP.oilPage='motor_${m.id}';render()" class="oil-sample-card" style="border-left:3px solid ${oilRulColor(m.rul)};cursor:pointer">
        <div style="font-size:22px">${m.rul<=20?'🚨':'⚠️'}</div>
        <div class="osc-left">
          <div class="osc-eq">${esc(m.nome.split(' ').slice(0,3).join(' '))}</div>

        </div>
        <button class="btn btn-g btn-sm" onclick="event.stopPropagation();openOilPlanoModal('${m.id}')">+ Plano</button>
      </div>`).join('')}
    </div>
  </div>`;
}

// ── PLANOS DE AÇÃO ──
function buildOilPlanos(){
  const planos = getOilPlanos();
  const pendentes = planos.filter(p=>p.status==='pendente');
  const execucao  = planos.filter(p=>p.status==='execucao');
  const concluidos= planos.filter(p=>p.status==='concluido');

  function planoCard(p){
    const motor = OIL_MOTORES.find(m=>m.id===p.motorId);
    const statusCfg = {
      pendente:{label:'⏳ Pendente',color:'#f59e0b',bg:'#f59e0b15',border:'#f59e0b33'},
      execucao:{label:'🔄 Em Execução',color:'#3b82f6',bg:'#3b82f615',border:'#3b82f633'},
      concluido:{label:'✅ Concluído',color:'#22c55e',bg:'#22c55e15',border:'#22c55e33'},
    }[p.status]||{};
    return`<div style="background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:8px">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex-wrap:wrap">
        <div style="flex:1;min-width:200px">
          <div style="font-weight:600;font-size:13.5px">${esc(p.acao)}</div>
          <div style="font-size:11px;color:var(--muted2);margin-top:3px">
            🚜 ${motor?esc(motor.nome.split(' ').slice(0,3).join(' ')):p.motorId} · 👤 ${esc(p.responsavel)} · 📅 ${p.prazo}
          </div>
          <div style="font-size:11px;color:${oilStatusColor(p.prioridade)};margin-top:3px;font-weight:600">
            Prioridade: ${oilStatusLabel(p.prioridade)}
          </div>
          ${p.obs?`<div style="font-size:11px;color:var(--muted2);margin-top:5px;padding-top:5px;border-top:1px solid var(--border)">📝 ${esc(p.obs)}</div>`:''}
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
          <span style="background:${statusCfg.bg};color:${statusCfg.color};border:1px solid ${statusCfg.border};border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700">${statusCfg.label}</span>
          <div style="display:flex;gap:4px">
            ${p.status==='pendente'?`<button class="btn btn-b btn-sm" onclick="updateOilPlanoStatus('${p.id}','execucao')">▶ Iniciar</button>`:''}
            ${p.status==='execucao'?`<button class="btn btn-g btn-sm" onclick="updateOilPlanoStatus('${p.id}','concluido')">✓ Concluir</button>`:''}
            <button class="btn btn-d btn-sm" onclick="deleteOilPlano('${p.id}')">✕</button>
          </div>
        </div>
      </div>
    </div>`;
  }

  return`
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px">
    <div class="kgrid k4" style="flex:1">
      <div class="kpi"><div class="kbar" style="background:#f59e0b"></div><div class="klbl">Pendentes</div><div class="kval" style="color:#f59e0b">${pendentes.length}</div></div>
      <div class="kpi"><div class="kbar" style="background:#3b82f6"></div><div class="klbl">Em Execução</div><div class="kval" style="color:#3b82f6">${execucao.length}</div></div>
      <div class="kpi"><div class="kbar" style="background:#22c55e"></div><div class="klbl">Concluídos</div><div class="kval" style="color:#22c55e">${concluidos.length}</div></div>

    </div>
    <button class="btn btn-g" onclick="openOilPlanoModal(null)">+ Novo Plano</button>
  </div>

  ${pendentes.length?`<div class="card" style="margin-bottom:12px;border-color:#f59e0b33"><div class="ctitle" style="color:#f59e0b">⏳ Pendentes (${pendentes.length})</div><div style="margin-top:10px">${pendentes.map(planoCard).join('')}</div></div>`:''}
  ${execucao.length?`<div class="card" style="margin-bottom:12px;border-color:#3b82f633"><div class="ctitle" style="color:#3b82f6">🔄 Em Execução (${execucao.length})</div><div style="margin-top:10px">${execucao.map(planoCard).join('')}</div></div>`:''}
  ${concluidos.length?`<div class="card" style="margin-bottom:12px;border-color:#22c55e33"><div class="ctitle" style="color:#22c55e">✅ Concluídos (${concluidos.length})</div><div style="margin-top:10px">${concluidos.map(planoCard).join('')}</div></div>`:''}
  ${planos.length===0?`<div class="card"><div class="empty"><div class="ei">📋</div><p>Nenhum plano criado ainda.</p><button class="btn btn-g btn-sm" onclick="openOilPlanoModal(null)">Criar primeiro plano</button></div></div>`:''}`;
}

async function gerarRelatorioOilIA(motorId){
  const m = OIL_MOTORES.find(x=>x.id===motorId);
  if(!m) return;
  const out = document.getElementById('oil-relatorio-output');
  if(!out) return;
  out.innerHTML=`<div style="padding:32px;text-align:center;color:var(--muted2)">
    <div style="width:24px;height:24px;border:2px solid var(--gold);border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px"></div>
    <div>Gerando relatório científico com IA...</div>
  </div>`;

  const prompt = `Você é um engenheiro especialista em lubrificação e análise de óleo mineral para motores agrícolas e industriais. 
Analise os seguintes dados de análise de óleo e gere um relatório técnico científico completo em português.

MOTOR: ${m.nome}
PLACA: ${m.placa} | CHASSI: ${m.chassi}
SETOR: ${m.setor}
HORAS MOTOR: ${m.horasMotor}h | HORAS ÓLEO ATUAL: ${m.horasOleo}h
STATUS: ${oilStatusLabel(m.status)}
RUL ESTIMADO: ${m.rul}%
ÚLTIMA ANÁLISE: ${m.ultimaAnalise}

PARÂMETROS ANALISADOS:
- Viscosidade: ${m.params.viscosidade} cSt (limite: ${m.limites.viscosidade.join('–')})
- Acidez TAN: ${m.params.acidez} (limite: 0–${m.limites.acidez[1]})
- Ferro (Fe): ${m.params.ferro} ppm (limite: 0–${m.limites.ferro[1]})
- Cobre (Cu): ${m.params.cobre} ppm (limite: 0–${m.limites.cobre[1]})
- Chumbo (Pb): ${m.params.chumbo} ppm (limite: 0–${m.limites.chumbo[1]})
- Alumínio (Al): ${m.params.aluminio} ppm
- Silício (Si): ${m.params.silicio} ppm (limite: 0–${m.limites.silicio[1]})
- Água: ${m.params.agua}% (limite: 0–${m.limites.agua[1]})
- Oxidação: ${m.params.oxidacao} ABS (limite: 0–${m.limites.oxidacao[1]})

HISTÓRICO:
${m.historico.map(h=>`${h.data}: Fe=${h.ferro}ppm, Viscosidade=${h.viscosidade}, Acidez=${h.acidez}, Status=${h.status}`).join('\n')}

Gere um relatório com as seguintes seções:
1. DIAGNÓSTICO TÉCNICO — interpretação dos parâmetros com referência às normas ISO 4406 e ASTM
2. ANÁLISE DE TENDÊNCIA — evolução dos parâmetros e projeção
3. IDENTIFICAÇÃO DE CAUSAS PROVÁVEIS — desgaste, contaminação, degradação térmica
4. IMPACTO DO USO SEVERO — quantifique o impacto na vida útil
5. RECOMENDAÇÕES TÉCNICAS — ações específicas com justificativa científica
6. PLANO DE AÇÃO SUGERIDO — 3 a 5 ações prioritárias com prazo

Seja específico, técnico e objetivo. Use dados concretos do laudo.`;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-20250514",
        max_tokens:1500,
        messages:[{role:"user",content:prompt}]
      })
    });
    const data = await response.json();
    const text = data.content?.map(i=>i.text||'').join('\n') || 'Erro ao gerar relatório.';

    // Formatar saída
    const formatted = text
      .replace(/^(#{1,3} .+)$/gm, '<div style="font-family:var(--disp);font-size:16px;color:#14b8a6;margin:16px 0 6px;letter-spacing:.5px">$1</div>')
      .replace(/^\*\*(.+)\*\*$/gm, '<strong style="color:var(--text)">$1</strong>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/^(\d+\. .+)$/gm, '<div style="margin:8px 0;padding-left:8px;border-left:2px solid #14b8a6">$1</div>')
      .replace(/^(- .+)$/gm, '<div style="margin:4px 0;padding-left:12px;color:var(--muted2)">• $1</div>')
      .replace(/\n\n/g, '<br/><br/>')
      .replace(/\n/g, '<br/>');

    out.innerHTML=`
      <div style="background:var(--s2);border:1px solid #14b8a633;border-radius:10px;padding:20px;line-height:1.8;font-size:13px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)">
          <div>
            <div style="font-family:var(--disp);font-size:18px;color:#14b8a6">RELATÓRIO CIENTÍFICO — IA</div>
            <div style="font-size:11px;color:var(--muted2)">${esc(m.nome)} · ${new Date().toLocaleString('pt-BR')} · ISO 4406 / ASTM D445 / D664</div>
          </div>
          <button class="btn btn-gh btn-sm" onclick="gerarRelatorioOilIA('${motorId}')">↺ Regenerar</button>
        </div>
        ${formatted}
      </div>`;
  }catch(e){
    out.innerHTML=`<div style="padding:20px;text-align:center;color:#fca5a5">Erro ao conectar com a IA. Verifique sua conexão.</div>`;
  }
}

function saveOilPlanoModal(){
  const motorId  = document.getElementById('oil-plano-motor')?.value;
  const acao     = document.getElementById('oil-plano-acao')?.value?.trim();
  const resp     = document.getElementById('oil-plano-resp')?.value?.trim();
  const prazo    = document.getElementById('oil-plano-prazo')?.value;
  const prioridade = document.getElementById('oil-plano-prioridade')?.value;
  const obs      = document.getElementById('oil-plano-obs')?.value?.trim();
  if(!acao||!resp||!prazo){ toast('Preencha todos os campos obrigatórios.','warn'); return; }
  const planos = getOilPlanos();
  planos.push({id:uid(), motorId, acao, responsavel:resp, prazo, prioridade, obs, status:'pendente', criadoEm:new Date().toISOString()});
  saveOilPlanos(planos);
  closeModal();
  toast('Plano de ação criado!','ok');
  render();
}

function updateOilPlanoStatus(id, novoStatus){
  const planos = getOilPlanos().map(p=>p.id===id?{...p,status:novoStatus}:p);
  saveOilPlanos(planos);
  toast(novoStatus==='concluido'?'Plano concluído! ✅':'Plano iniciado!','ok');
  render();
}

function deleteOilPlano(id){
  const planos = getOilPlanos().filter(p=>p.id!==id);
  saveOilPlanos(planos);
  toast('Plano removido.','warn');
  render();
}

function toggleOilPasso(planoId, passoId){
  const planos = getOilPlanos().map(p=>{
    if(p.id!==planoId) return p;
    const passos = (p.passos||[]).map(s=>s.id===passoId?{...s,done:!s.done}:s);
    const allDone = passos.every(s=>s.done);
    return {...p, passos, status: allDone?'concluido':(passos.some(s=>s.done)?'execucao':'pendente')};
  });
  saveOilPlanos(planos);
  render();
}

  const old=active.filter(l=>daysAgo(l.loanDate)>5);
  const cats=[...new Set(tools.map(t=>t.category).filter(Boolean))];
  return`<div class="kgrid k4">
    <div class="kpi"><div class="kbar" style="background:var(--gold)"></div><div class="klbl">Ferramentas</div><div class="kval">${tools.length}</div><div class="ksub">${tools.filter(t=>t.status==='disponivel').length} disponíveis</div></div>
    <div class="kpi"><div class="kbar" style="background:var(--blue)"></div><div class="klbl">Emp. Ativos</div><div class="kval">${active.length}</div></div>
    <div class="kpi"><div class="kbar" style="background:var(--green)"></div><div class="klbl">Valor Acervo</div><div class="kval sm">${fmt(tools.reduce((s,t)=>s+(t.value||0),0))}</div><div class="ksub">${fmt(lentVal)} emprestado</div></div>
    <div class="kpi"><div class="kbar" style="background:var(--red)"></div><div class="klbl">Emp. &gt;5 dias</div><div class="kval" style="${old.length?'color:var(--red)':''}">${old.length}</div></div>
  </div>
  <div class="g2">
    <div class="card"><div class="ctitle">📋 Empréstimos Ativos</div>
    ${active.length===0?`<div class="empty"><div class="ei">✅</div><p>Nenhum empréstimo ativo</p></div>`:`<div class="tw"><table><thead><tr><th>Ferramenta</th><th>Mecânico</th><th>Dias</th></tr></thead><tbody>
    ${active.slice(0,8).map(l=>{const t=tools.find(x=>x.id===l.toolId),m=mechs.find(x=>x.id===l.mechId),d=daysAgo(l.loanDate);return`<tr><td><strong>${esc(t?.name||'?')}</strong></td><td>${esc(m?.name||'?')}</td><td><span class="bdg ${d>7?'err':d>3?'amr':'ok'}">${d}d</span></td></tr>`}).join('')}</tbody></table></div>`}
    </div>
    <div class="card"><div class="ctitle">👷 Valor em Posse</div>
    <div class="tw"><table><thead><tr><th>Mecânico</th><th>Itens</th><th>Valor</th></tr></thead><tbody>
    ${mechs.map(m=>{const ml=active.filter(l=>l.mechId===m.id);const v=ml.reduce((s,l)=>s+(tools.find(t=>t.id===l.toolId)?.value||0),0);return`<tr><td><strong>${esc(m.name)}</strong></td><td><span class="bdg info">${ml.length}</span></td><td style="color:var(--gold);font-weight:600">${fmt(v)}</td></tr>`}).join('')}</tbody></table></div>
    </div>
    <div class="card"><div class="ctitle">📦 Por Categoria</div>
    <div class="tw"><table><thead><tr><th>Categoria</th><th>Total</th><th>Disp.</th><th>Emp.</th></tr></thead><tbody>
    ${cats.map(c=>{const ct=tools.filter(t=>t.category===c);return`<tr><td><strong>${esc(c)}</strong></td><td>${ct.length}</td><td><span class="bdg ok">${ct.filter(t=>t.status==='disponivel').length}</span></td><td><span class="bdg warn">${ct.filter(t=>t.status==='emprestada').length}</span></td></tr>`}).join('')}</tbody></table></div>
    </div>
    <div class="card"><div class="ctitle">💰 Resumo</div>
    ${[{l:'Total acervo',v:tools.reduce((s,t)=>s+(t.value||0),0),c:'var(--text)'},{l:'Disponível',v:tools.filter(t=>t.status==='disponivel').reduce((s,t)=>s+(t.value||0),0),c:'var(--green)'},{l:'Emprestado',v:lentVal,c:'var(--gold)'}].map(r=>`<div style="display:flex;justify-content:space-between;padding:8px 11px;background:var(--s3);border-radius:6px;margin-bottom:7px"><span style="font-size:12px;color:var(--muted2)">${r.l}</span><strong style="color:${r.c}">${fmt(r.v)}</strong></div>`).join('')}
    </div>
  </div>`}

function buildToolsList(tools){
  const q=APP.toolSearch||'',f=APP.toolFilter||'todos';
  const filtered=tools.filter(t=>(f==='todos'||t.status===f)&&[t.name,t.category,t.serial,t.desc].some(s=>(s||'').toLowerCase().includes(q.toLowerCase())));
  return`<div class="shdr">
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <input id="tsearch" value="${esc(q)}" placeholder="Buscar..." style="width:220px" oninput="APP.toolSearch=this.value;render()"/>
      <select onchange="APP.toolFilter=this.value;render()">
        <option value="todos" ${f==='todos'?'selected':''}>Todos</option>
        <option value="disponivel" ${f==='disponivel'?'selected':''}>Disponíveis</option>
        <option value="emprestada" ${f==='emprestada'?'selected':''}>Emprestadas</option>
      </select>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <button class="btn btn-gh btn-sm" onclick="openImportModal('tools')" title="Importar/Exportar">📥 Importar</button>
      <button class="btn btn-g" onclick="openToolModal()">+ Nova Ferramenta</button>
    </div>
  </div>
  <div class="card"><div class="tw"><table>
    <thead><tr><th>Ferramenta</th><th>Categoria</th><th>Valor</th><th>Série</th><th>Local</th><th>Status</th><th>Ações</th></tr></thead>
    <tbody>
    ${filtered.length===0?`<tr><td colspan="7"><div class="empty"><div class="ei">🔧</div><p>Nenhuma encontrada</p></div></td></tr>`:''}
    ${filtered.map(t=>`<tr>
      <td><strong>${esc(t.name)}</strong><div style="font-size:11px;color:var(--muted2)">${esc(t.desc||'')}</div></td>
      <td><span class="bdg neu">${esc(t.category||'—')}</span></td>
      <td style="color:var(--gold);font-weight:600">${fmt(t.value)}</td>
      <td style="font-family:var(--mono);font-size:11px;color:var(--muted2)">${esc(t.serial||'—')}</td>
      <td style="font-size:11px;color:var(--muted2)">${esc(t.location||'—')}</td>
      <td>${t.status==='disponivel'?`<span class="bdg ok">✓ Disponível</span>`:`<span class="bdg warn">↗ Emprestada</span>`}</td>
      <td><div style="display:flex;gap:4px"><button class="btn btn-gh btn-sm" onclick="openToolModal('${t.id}')">✏</button><button class="btn btn-d btn-sm" onclick="delTool('${t.id}')">✕</button></div></td>
    </tr>`).join('')}
    </tbody></table></div></div>`}

      <button class="btn btn-gh btn-sm" onclick="openImportModal('mechs')" title="Importar/Exportar">📥 Importar</button>
      <button class="btn btn-g" onclick="openMechModal()">+ Novo Mecânico</button>
    </div></div>
  <div class="g3">${mechs.map(m=>{const ml=active.filter(l=>l.mechId===m.id);const v=ml.reduce((s,l)=>s+(tools.find(t=>t.id===l.toolId)?.value||0),0);return`<div class="card" style="cursor:pointer;margin-bottom:0" onclick="openMechDetail('${m.id}')">
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:11px"><div class="avatar">${esc(m.name[0])}</div>
    <div><div style="font-weight:700;font-size:14px">${esc(m.name)}</div><div style="font-size:11px;color:var(--muted2)">Mat. ${esc(m.mat)}</div></div></div>
    <div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--border)">
      <div><div style="font-size:10px;color:var(--muted);margin-bottom:3px">Em posse</div><span class="bdg warn">${ml.length} itens</span></div>
      <div style="text-align:right"><div style="font-size:10px;color:var(--muted);margin-bottom:3px">Valor</div><span style="color:var(--gold);font-weight:700">${fmt(v)}</span></div>

    <div style="display:flex;gap:6px;margin-top:10px" onclick="event.stopPropagation()">
      <button class="btn btn-gh btn-sm" style="flex:1" onclick="openMechModal('${m.id}')">✏ Editar</button>
      <button class="btn btn-d btn-sm" onclick="delMech('${m.id}')">✕</button>

  </div>`}).join('')}</div>`}

function buildLoansList(loans,tools,mechs,onlyActive){
  const list=onlyActive?[...loans.filter(l=>!l.returnDate)]:[...loans.filter(l=>l.returnDate)];
  list.sort((a,b)=>new Date(b.loanDate)-new Date(a.loanDate));
  return`<div class="shdr">
    <div style="font-size:13px;color:var(--muted2)">${list.length} ${onlyActive?'empréstimos ativos':'devoluções'}</div>
    <div style="display:flex;gap:7px;flex-wrap:wrap">
      ${onlyActive&&list.length>0?`<button class="btn btn-gh" onclick="openTermoMechModal()">🖨 Termo por Mecânico</button>`:''}
      ${onlyActive?`<button class="btn btn-g" onclick="openLoanModal()">+ Novo Empréstimo</button>`:''}
    </div>
  </div>
  <div class="card"><div class="tw"><table>
    <thead><tr><th>Ferramenta</th><th>Mecânico</th><th>Valor</th><th>Data</th><th>${onlyActive?'Dias':'Devolvido'}</th><th>Obs.</th><th>Ações</th></tr></thead>
    <tbody>
    ${list.length===0?`<tr><td colspan="7"><div class="empty"><div class="ei">${onlyActive?'✅':'📁'}</div><p>${onlyActive?'Nenhum ativo.':'Nenhuma devolução.'}</p></div></td></tr>`:''}
    ${list.map(l=>{const t=tools.find(x=>x.id===l.toolId),m=mechs.find(x=>x.id===l.mechId),d=daysAgo(l.loanDate);return`<tr>
      <td><strong>${esc(t?.name||'?')}</strong></td>
      <td><strong>${esc(m?.name||'?')}</strong><div style="font-size:10px;color:var(--muted2)">Mat. ${esc(m?.mat||'—')}</div></td>
      <td style="color:var(--gold);font-weight:600">${fmt(t?.value)}</td>
      <td style="font-size:11px;color:var(--muted2)">${fmtD(l.loanDate)}</td>
      <td>${onlyActive?`<span class="bdg ${d>7?'err':d>3?'amr':'ok'}">${d}d</span>`:`<span style="font-size:11px">${fmtD(l.returnDate)}</span>`}</td>
      <td style="font-size:11px;color:var(--muted2)">${esc(l.note||'—')}</td>
      <td><div style="display:flex;gap:4px;flex-wrap:wrap">
        <button class="btn btn-gh btn-sm" onclick="printTermo('${l.id}')">🖨 Termo</button>
        ${onlyActive?`<button class="btn btn-g btn-sm" onclick="openReturnModal('${l.id}')">↩ Devolver</button>`:''}
      </div></td>
    </tr>`}).join('')}
    </tbody></table></div></div>`}

function buildToolsReports(){
  return`<div class="shdr"><div class="stitle">Relatórios PDF</div><button class="btn btn-g" onclick="openRelatorioModal()">📊 Gerar Relatório</button></div>
  <div class="g2">${[{t:'Inventário',s:'Lista completa',fn:'relTools',ico:'🔧'},{t:'Empréstimos',s:'Ativos',fn:'relLoans',ico:'📋'},{t:'Por Mecânico',s:'Responsabilidade',fn:'relMechs',ico:'👷'},{t:'Completo',s:'Todos os módulos',fn:'relAll',ico:'📦'}].map(r=>`<div class="card" style="cursor:pointer" onclick="${r.fn}()"><div style="font-size:28px;margin-bottom:8px">${r.ico}</div><div style="font-weight:700;margin-bottom:4px">${r.t}</div><div style="font-size:12px;color:var(--muted2)">${r.s}</div></div>`).join('')}</div>`}

// ═══════ BATTERY SHELL ═══════
function buildBatShell(){
  const machines=DB.get('machines'),batteries=DB.get('batteries'),batHist=DB.get('batHist');
  const inUse=batteries.filter(b=>b.machineId);
  const exp=batteries.filter(b=>b.warranty&&daysLeft(b.warranty)<0);
  const soon=batteries.filter(b=>{const d=daysLeft(b.warranty);return d!==null&&d>=0&&d<90});
  const pages=[{id:'dash',ico:'📊',lbl:'Dashboard',sec:'Principal'},{id:'machines',ico:'🚜',lbl:'Máquinas',sec:null,pill:machines.length,pillc:'b'},{id:'batteries',ico:'🔋',lbl:'Baterias',sec:null,pill:batteries.length,pillc:'b'},{id:'alloc',ico:'🔄',lbl:'Alocação',sec:'Operação',pill:inUse.length,pillc:'b'},{id:'warranty',ico:'🛡',lbl:'Garantias',sec:null,pill:(exp.length+soon.length)||'',pillc:exp.length?'r':'amr'},{id:'reports',ico:'📈',lbl:'Relatórios',sec:'Análise'}];
  let pc='';
  if(APP.page==='dash')pc=buildBatDash(machines,batteries);
  else if(APP.page==='machines')pc=buildMachinesList(machines,batteries);
  else if(APP.page==='batteries')pc=buildBatteriesList(batteries,machines);
  else if(APP.page==='alloc')pc=buildAllocPage(batteries,machines,batHist);
  else if(APP.page==='warranty')pc=buildWarrantyPage(batteries,machines);
  else if(APP.page==='reports')pc=`<div class="shdr"><div class="stitle">Relatórios PDF</div><button class="btn btn-b" onclick="openRelatorioModal()">📊 Gerar</button></div><div class="g2">${[{t:'Baterias',fn:'relBat',ico:'🔋'},{t:'Garantias',fn:'relWarranty',ico:'🛡'}].map(r=>`<div class="card" style="cursor:pointer" onclick="${r.fn}()"><div style="font-size:28px;margin-bottom:8px">${r.ico}</div><div style="font-weight:700">${r.t}</div></div>`).join('')}</div>`;
  return`<div class="shell">
  <div class="sidebar">
    <div class="sb-hdr"><div class="sb-name">🔋 BATERIAS</div><div class="sb-sub">${esc(APP.unidade)}</div><span class="sb-bdg b">ATIVO</span></div>
    ${pages.map(p=>`${p.sec?`<div class="sb-sec">${p.sec}</div>`:''}<div class="sb-item ${APP.page===p.id?'act-b':''}" onclick="APP.page='${p.id}';render()"><span>${p.ico}</span><span style="flex:1">${p.lbl}</span>${p.pill?`<span class="pill ${p.pillc}">${p.pill}</span>`:''}</div>`).join('')}
    <div class="sb-foot">
      <div class="sb-item" onclick="openRelatorioModal()" style="border-radius:6px"><span>📊</span><span>Relatórios PDF</span></div>
      <div class="sb-item" onclick="APP.module=null;render()" style="border-radius:6px"><span>←</span><span>Menu Principal</span></div>
      <div class="sb-item" onclick="trocarUnidade()" style="border-radius:6px;margin-top:4px"><span>🏭</span><span style="font-size:11px">Trocar Unidade</span></div>
      <div class="sb-item" onclick="AUTH.logout()" style="border-radius:6px;color:var(--muted)"><span>🚪</span><span style="font-size:11px">Sair</span></div>
      ${AUTH.isAdmin()?`<div class="sb-item" onclick="APP.module='admin';render()" style="border-radius:6px"><span>👥</span><span style="font-size:11px">Usuários</span></div>`:''}
      <div style="font-size:10px;color:var(--muted);margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(AUTH.current()?.name||AUTH.current()?.email||'')}</div>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <div><div class="tb-title" style="color:var(--blue)">${pages.find(p=>p.id===APP.page)?.ico} ${pages.find(p=>p.id===APP.page)?.lbl}</div>
      <div class="tb-sub">🏭 ${esc(APP.unidade)} · ${machines.length} máquinas · ${batteries.length} baterias · ${inUse.length} alocadas</div></div>
      <div style="display:flex;gap:8px;align-items:center">${exp.length?`<span class="bdg err">⚠ ${exp.length} vencidas</span>`:''}</div>
    </div>
    <div class="content">${pc}</div>
  </div>
</div>`}

function buildBatDash(machines,batteries){
  const inUse=batteries.filter(b=>b.machineId),stock=batteries.filter(b=>!b.machineId);
  const exp=batteries.filter(b=>b.warranty&&daysLeft(b.warranty)<0);
  const soon=batteries.filter(b=>{const d=daysLeft(b.warranty);return d!==null&&d>=0&&d<90});
  return`<div class="kgrid k4">
    <div class="kpi"><div class="kbar" style="background:var(--blue)"></div><div class="klbl">Total</div><div class="kval">${batteries.length}</div><div class="ksub">${stock.length} em estoque</div></div>
    <div class="kpi"><div class="kbar" style="background:var(--green)"></div><div class="klbl">Alocadas</div><div class="kval">${inUse.length}</div></div>
    <div class="kpi"><div class="kbar" style="background:var(--gold)"></div><div class="klbl">Valor Total</div><div class="kval sm">${fmt(batteries.reduce((s,b)=>s+(b.purchaseValue||0),0))}</div></div>
    <div class="kpi"><div class="kbar" style="background:var(--red)"></div><div class="klbl">Alertas</div><div class="kval" style="${(exp.length+soon.length)?'color:var(--red)':''}">${exp.length+soon.length}</div><div class="ksub">${exp.length} venc.</div></div>
  </div>
  <div class="g2">
    <div class="card"><div class="ctitle b">🚜 Máquinas</div>
    <div class="tw"><table><thead><tr><th>Máquina</th><th>Setor</th><th>Bateria</th><th>Garantia</th></tr></thead><tbody>
    ${machines.map(m=>{const b=batteries.find(x=>x.machineId===m.id);return`<tr><td><strong>${esc(m.name)}</strong></td><td style="font-size:11px;color:var(--muted2)">${esc(m.sector||'—')}</td><td>${b?`<span class="bdg info">${esc(b.code)}</span>`:`<span class="bdg neu">Sem bateria</span>`}</td><td>${b?wBadge(b.warranty):'—'}</td></tr>`}).join('')}
    </tbody></table></div></div>
    <div class="card"><div class="ctitle b">⚠ Alertas</div>
    ${[...exp,...soon].length===0?`<div class="empty"><div class="ei">✅</div><p>Garantias em dia!</p></div>`:`<div class="tw"><table><thead><tr><th>Código</th><th>Máquina</th><th>Status</th></tr></thead><tbody>
    ${[...exp,...soon].map(b=>{const m=machines.find(x=>x.id===b.machineId);return`<tr><td><strong style="font-family:var(--mono)">${esc(b.code)}</strong></td><td>${esc(m?.name||'Estoque')}</td><td>${wBadge(b.warranty)}</td></tr>`}).join('')}
    </tbody></table></div>`}
    </div>
  </div>`}

  <div class="card"><div class="tw"><table><thead><tr><th>Código</th><th>Marca/Modelo</th><th>Cap.</th><th>Valor</th><th>Garantia</th><th>Status</th><th>Ações</th></tr></thead><tbody>

function buildAllocPage(batteries,machines,batHist){
  const inUse=batteries.filter(b=>b.machineId),stock=batteries.filter(b=>!b.machineId);
  const recent=[...batHist].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,20);
  return`<div class="shdr"><div class="stitle">Alocação</div><button class="btn btn-b" onclick="openAllocModal()">+ Alocar Bateria</button></div>
  <div class="g2">
    <div class="card"><div class="ctitle b">⚡ Alocadas (${inUse.length})</div>
    <div class="tw"><table><thead><tr><th>Bateria</th><th>Máquina</th><th>Garantia</th><th>Ação</th></tr></thead><tbody>

function libNodes(){return DB.get('libTree')}
function libPath(nodeId){const nodes=libNodes();const path=[];let cur=nodeId;while(cur){const n=nodes.find(x=>x.id===cur);if(!n)break;path.unshift(n);cur=n.parentId}return path}
function libCountChildren(id){const nodes=libNodes();let c=0;function r(fid){nodes.filter(n=>n.parentId===fid).forEach(n=>{c++;if(n.type==='folder')r(n.id)})}r(id);return c}
function libSelectFolder(id){APP.libSelected=(id===null||id==='null')?null:id;APP.page='files';render()}
function libToggleFolder(id){if(!APP.libOpenFolders)APP.libOpenFolders={};
NET.init();APP.libOpenFolders[id]=!APP.libOpenFolders[id];render()}

function buildLibTree(){
  const nodes=libNodes();
  function renderFolder(parentId,depth){
    return nodes.filter(n=>n.type==='folder'&&n.parentId===(parentId||null)).map(f=>{
      const isOpen=APP.libOpenFolders[f.id],isSel=APP.libSelected===f.id;
      const childFolders=nodes.filter(n=>n.type==='folder'&&n.parentId===f.id).length;
      const total=nodes.filter(n=>n.parentId===f.id).length;
      return`<div>
        <div class="tree-item ${isSel?'selected':''}" style="padding-left:${12+depth*14}px" onclick="libSelectFolder('${f.id}')">
          <span class="toggle ${isOpen?'open':''}" onclick="event.stopPropagation();libToggleFolder('${f.id}')">${childFolders?'▶':''}</span>
          <span class="ico">${isOpen?'📂':'📁'}</span><span class="lbl">${esc(f.name)}</span>
          ${total?`<span class="cnt">${total}</span>`:''}
        </div>
        ${isOpen?`<div>${renderFolder(f.id,depth+1)}</div>`:''}
      </div>`;
    }).join('');
  }
  return`<div class="lib-tree">
    <div class="tree-item ${!APP.libSelected?'selected':''}" style="padding-left:12px" onclick="libSelectFolder(null)">
      <span class="toggle"></span><span class="ico">🏠</span><span class="lbl">Raiz</span>
    </div>${renderFolder(null,0)}
  </div>`}

async function libCreateFolder(parentId){
  const name=qval('fn');if(!name)return toast('Digite um nome.','err');
  const pid=(parentId===null||parentId==='null')?null:parentId;
  const nodes=libNodes();
  if(nodes.some(n=>n.type==='folder'&&n.parentId===pid&&n.name.toLowerCase()===name.toLowerCase()))return toast('Pasta já existe.','err');
  const node={id:uid(),name,type:'folder',parentId:pid,createdAt:new Date().toISOString()};
  nodes.push(node);LOCAL.set('libTree',nodes);FB.set('libTree',node.id,node);

function openRenameFolderModal(id){

    <div class="frow"><div><label>Novo Nome *</label><input id="fn" value="${esc(f?.name||'')}"/></div></div>

  </div>`);setTimeout(()=>qid('fn')?.select(),50);

async function libRenameFolder(id){
  const name=qval('fn');if(!name)return toast('Digite um nome.','err');
  const nodes=libNodes();const i=nodes.findIndex(n=>n.id===id);
  if(i>=0){nodes[i].name=name;LOCAL.set('libTree',nodes);FB.set('libTree',id,nodes[i]);}
  closeModal();toast('Renomeada!');render();

async function libDelFolder(id){
  const count=libCountChildren(id);
  if(count>0&&!await customConfirm({title:'Excluir Pasta',msg:`Esta pasta contém ${count} item(s). Tudo será excluído.`,icon:'📁',confirmLabel:'Excluir tudo',type:'danger'}))return;
  const nodes=libNodes();const toDelete=[];
  function collect(fid){nodes.filter(n=>n.parentId===fid).forEach(n=>{toDelete.push(n.id);if(n.type==='folder')collect(n.id)});}
  collect(id);toDelete.push(id);
  LOCAL.set('libTree',nodes.filter(n=>!toDelete.includes(n.id)));
  toDelete.forEach(did=>FB.delete('libTree',did));
  if(APP.libSelected===id)APP.libSelected=null;
  toast('Excluída.');render();
}

function openUploadModal(parentId){
  const pid=(parentId===null||parentId==='null')?null:parentId;

      <div class="dz-ico">📎</div><p><strong>Clique para selecionar</strong> ou arraste</p>

  </div>`);

function libHandleDrop(e,parentId){e.preventDefault();document.getElementById('dz')?.classList.remove('drag-over');libHandleFiles(e.dataTransfer.files,parentId);}

function libHandleFiles(fileList,parentId){
  const pid=(parentId===null||parentId==='null')?null:parentId;
  const desc=qval('fdesc');
  const MAX_SIZE = 4 * 1024 * 1024; // 4MB limite seguro para localStorage
  let added=0, errors=0;
  const files = Array.from(fileList);
  let processed = 0;

  files.forEach(file=>{
    // Verificar tamanho antes de ler
    if(file.size > MAX_SIZE){
      errors++;
      processed++;
      const prev=document.getElementById('upload-preview');
      if(prev)prev.innerHTML=`<div class="infobox" style="margin-top:8px;font-size:12px;color:var(--red)">✕ "${file.name}" é grande demais (${(file.size/1024/1024).toFixed(1)}MB). Limite: 4MB.</div>`;
      toast(`"${file.name}" grande demais — máx 4MB.`,'err');
      return;
    }

    const reader=new FileReader();
    reader.onerror=()=>{
      errors++;
      processed++;
      toast(`Erro ao ler "${file.name}".`,'err');
    };
    reader.onload=async e=>{
      try{
        const ext = file.name.split('.').pop().toLowerCase();
        const node={
          id:uid(),
          name:file.name,
          type:'file',
          parentId:pid,
          size:file.size,
          uploadedAt:new Date().toISOString(),
          desc: desc||'',
          ext,
          mimeType: file.type||'',
          data:e.target.result  // base64 — salvo só no localStorage
        };
        // Salvar no localStorage (com data)
        const fresh=libNodes();
        fresh.push(node);
        LOCAL.set('libTree',fresh);
        // Salvar no Firestore SEM o data (evita limite 1MB)
        const nodeForFS={...node};
        delete nodeForFS.data;
        await FB.set('libTree',node.id,nodeForFS);
        added++;
        processed++;
        if(pid)APP.libOpenFolders[pid]=true;
        const prev=document.getElementById('upload-preview');
        if(prev){
          const icon = fileIcon(ext);
          const size = file.size < 1024 ? file.size+'B' : file.size < 1024*1024 ? (file.size/1024).toFixed(0)+'KB' : (file.size/1024/1024).toFixed(1)+'MB';
          prev.innerHTML=`<div class="infobox" style="margin-top:8px;font-size:12px;color:var(--green)">✓ ${added} arquivo${added>1?'s':''} adicionado${added>1?'s':''}: ${icon} ${esc(file.name)} (${size})</div>`;
        }
        toast(`${file.name} adicionado!`,'ok');
        render();
      }catch(err){
        errors++;
        processed++;
        console.error('libHandleFiles error:',err);
        toast(`Erro ao salvar "${file.name}": ${err.message||'tente novamente'}`,'err');
      }
    };
    // Ler como DataURL (base64) — funciona para todos os tipos incluindo .docx
    reader.readAsDataURL(file);
  });
}

function libDownload(id){
  const f=libNodes().find(n=>n.id===id);
  if(!f)return toast('Arquivo não encontrado.','err');
  if(!f.data){
    // Tentar buscar do Firebase
    toast('Buscando arquivo...','info');
    FB.get('libTree',id).then(node=>{
      if(node&&node.data){
        const a=document.createElement('a');a.href=node.data;a.download=f.name;document.body.appendChild(a);a.click();a.remove();
        toast('Download: '+f.name,'ok');
      } else {
        toast('Arquivo sem conteúdo — reenvie o arquivo.','err');
      }
    }).catch(()=>toast('Erro ao baixar arquivo.','err'));
    return;
  }
  const a=document.createElement('a');
  a.href=f.data;
  a.download=f.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  toast('Download: '+f.name,'ok');
}

function showRelViewer(html,title){
  document.getElementById('rel-viewer')?.remove();
  const wrap=document.createElement('div');wrap.id='rel-viewer';wrap.style.cssText='position:fixed;inset:0;z-index:800;background:#1e293b;display:flex;flex-direction:column';
  const bar=document.createElement('div');bar.style.cssText='background:#0f172a;padding:10px 18px;display:flex;align-items:center;gap:10px;flex-shrink:0;border-bottom:1px solid #334155';

    <button onclick="document.getElementById('rel-iframe').contentWindow.print()" style="padding:7px 16px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;background:#e8a000;color:#000">🖨 Imprimir / PDF</button>

  const frame=document.createElement('iframe');frame.id='rel-iframe';frame.style.cssText='flex:1;border:none;background:#fff';frame.srcdoc=html;
  wrap.appendChild(bar);wrap.appendChild(frame);document.body.appendChild(wrap);
}

function relLib(){
  const nodes=DB.get('libTree');
