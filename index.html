<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#e9ebef;--s1:#f7f8fa;--s2:#fbfcfd;--s3:#eef0f4;
  --border:#d8dce4;--border2:#c2c8d3;
  --gold:#e8a000;--gold2:#fbbf24;--goldl:#e8a00022;
  --blue:#3b82f6;--bluel:#3b82f622;
  --green:#22c55e;--greenl:#22c55e22;
  --red:#ef4444;--redl:#ef444422;
  --amber:#f59e0b;--amberl:#f59e0b22;
  --purple:#a855f7;--purplel:#a855f722;
  --text:#242a35;--muted:#767f8e;--muted2:#4d5665;
  --goldt:#8a5a00;--bluet:#1d4ed8;--purplet:#7e22ce;--greent:#15803d;--redt:#b91c1c;
  --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;--disp:'Bebas Neue',cursive;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);height:100vh;overflow:hidden;-webkit-text-size-adjust:100%}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.shell{display:flex;height:100vh;overflow:hidden}
.sidebar{width:215px;min-width:215px;background:var(--s1);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.content{flex:1;overflow-y:auto;padding:22px 24px}
.topbar{background:var(--s1);border-bottom:1px solid var(--border);padding:12px 22px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.tb-title{font-family:var(--disp);font-size:20px;letter-spacing:1px}
.tb-sub{font-size:11px;color:var(--muted);margin-top:2px}
.sb-hdr{padding:16px 14px 12px;border-bottom:1px solid var(--border)}
.sb-name{font-family:var(--disp);font-size:15px;letter-spacing:1px}
.sb-sub{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:2px}
.sb-bdg{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:600;margin-top:5px;border:1px solid}
.sb-bdg.g{background:var(--goldl);color:var(--gold);border-color:#e8a00044}
.sb-bdg.b{background:var(--bluel);color:var(--blue);border-color:#3b82f644}
.sb-bdg.p{background:var(--purplel);color:var(--purple);border-color:#a855f744}
.sb-sec{padding:10px 14px 3px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;font-weight:600}
.sb-item{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:13px;font-weight:500;color:var(--muted2);border-left:2px solid transparent;cursor:pointer;transition:all .1s;user-select:none}
.sb-item:hover{color:var(--text);background:var(--s2)}
.sb-item.act{color:var(--text);border-left-color:var(--gold);background:var(--goldl)}
.sb-item.act-b{color:var(--text);border-left-color:var(--blue);background:var(--bluel)}
.sb-item.act-p{color:var(--text);border-left-color:var(--purple);background:var(--purplel)}
.pill{margin-left:auto;padding:1px 7px;border-radius:20px;font-size:10px;font-weight:700;min-width:18px;text-align:center}
.pill.g{background:var(--gold);color:#000}.pill.b{background:var(--blue);color:#fff}
.pill.r{background:var(--red);color:#fff}.pill.p{background:var(--purple);color:#fff}
.sb-foot{margin-top:auto;padding:10px 14px;border-top:1px solid var(--border)}
.card{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:14px}
.ctitle{font-family:var(--disp);font-size:14px;letter-spacing:.5px;color:var(--gold);margin-bottom:12px}
.ctitle.b{color:var(--blue)}.ctitle.p{color:var(--purple)}
.kgrid{display:grid;gap:11px;margin-bottom:18px}
.k4{grid-template-columns:repeat(4,1fr)}.k3{grid-template-columns:repeat(3,1fr)}.k2{grid-template-columns:repeat(2,1fr)}
.kpi{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;position:relative;overflow:hidden}
.kbar{position:absolute;top:0;left:0;right:0;height:2px}
.klbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;font-weight:600}
.kval{font-family:var(--disp);font-size:32px;line-height:1;margin:4px 0 2px;letter-spacing:1px}
.kval.sm{font-size:18px;margin-top:7px;letter-spacing:0}
.ksub{font-size:11px;color:var(--muted2)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;padding:7px 11px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 11px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#ffffff04}
.bdg{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;text-transform:uppercase;white-space:nowrap;border:1px solid}
.bdg.ok{background:var(--greenl);color:#15803d;border-color:#22c55e44}
.bdg.warn{background:var(--goldl);color:var(--gold2);border-color:#e8a00044}
.bdg.err{background:var(--redl);color:#b91c1c;border-color:#ef444444}
.bdg.info{background:var(--bluel);color:#1d4ed8;border-color:#3b82f644}
.bdg.amr{background:var(--amberl);color:#92400e;border-color:#f59e0b44}
.bdg.neu{background:var(--s3);color:var(--muted2);border-color:var(--border)}
.bdg.pur{background:var(--purplel);color:#7e22ce;border-color:#a855f744}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border:none;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;transition:all .13s;white-space:nowrap;font-family:var(--font);line-height:1}
.btn:active{transform:scale(.97)}
.btn-g{background:var(--gold);color:#000}.btn-g:hover{background:var(--gold2)}
.btn-b{background:var(--blue);color:#fff}.btn-b:hover{filter:brightness(1.15)}
.btn-p{background:var(--purple);color:#fff}.btn-p:hover{filter:brightness(1.15)}
.btn-gh{background:var(--s3);border:1px solid var(--border);color:var(--muted2)}.btn-gh:hover{border-color:var(--border2);color:var(--text)}
.btn-d{background:var(--redl);border:1px solid #ef444444;color:#b91c1c}.btn-d:hover{background:#ef444430}
.btn-sm{padding:4px 9px;font-size:11.5px}
.frow{display:grid;gap:11px;margin-bottom:11px}
.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:1fr 1fr 1fr}.c4{grid-template-columns:1fr 1fr 1fr 1fr}
label{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:3px}
input,select,textarea{width:100%;padding:7px 10px;background:var(--bg);border:1px solid var(--border2);border-radius:7px;color:var(--text);font-size:13px;outline:none;transition:border-color .15s;font-family:var(--font)}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 2px #e8a00018}
.fb input:focus,.fb select:focus{border-color:var(--blue);box-shadow:0 0 0 2px #3b82f618}
.fp input:focus,.fp select:focus{border-color:var(--purple);box-shadow:0 0 0 2px #a855f718}
select option{background:var(--s1)}
textarea{resize:vertical;min-height:60px}
.herr{font-size:11px;color:#b91c1c;margin-top:2px}
.overlay{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:500;padding:20px}
.modal{background:var(--s2);border:1px solid var(--border2);border-radius:12px;padding:22px;width:min(600px,96vw);max-height:90vh;overflow-y:auto;animation:fu .18s}
.mtitle{font-family:var(--disp);font-size:19px;letter-spacing:.5px;margin-bottom:16px;color:var(--gold)}
.mtitle.b{color:var(--blue)}.mtitle.p{color:var(--purple)}
.mfoot{display:flex;gap:7px;justify-content:flex-end;margin-top:16px;padding-top:13px;border-top:1px solid var(--border)}
.shdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;gap:10px;flex-wrap:wrap}
.stitle{font-family:var(--disp);font-size:16px;letter-spacing:.5px}
.toast-wrap{position:fixed;bottom:18px;right:18px;z-index:9999;display:flex;flex-direction:column;gap:7px;pointer-events:none}
.toast{background:var(--s2);border:1px solid var(--border2);border-radius:8px;padding:9px 15px;font-size:12.5px;color:var(--text);display:flex;align-items:center;gap:7px;pointer-events:all;max-width:300px;animation:si .2s ease}
.toast.ok{border-left:3px solid var(--green)}.toast.err{border-left:3px solid var(--red);color:#b91c1c}
.toast.info{border-left:3px solid var(--blue);color:#1d4ed8}.toast.warn{border-left:3px solid var(--amber);color:#92400e}
.toast-fade{opacity:0;transition:opacity .2s}
.infobox{background:var(--s3);border:1px solid var(--border2);border-radius:7px;padding:12px 14px;margin-bottom:12px;font-size:12.5px}
.empty{text-align:center;padding:36px 20px;color:var(--muted)}
.empty .ei{font-size:32px;margin-bottom:8px}.empty p{font-size:13px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;color:#000;flex-shrink:0;font-family:var(--disp)}
/* COVER */
.cover{height:100vh;max-height:100vh;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:16px 20px;position:relative;overflow-y:auto;overflow-x:hidden}
.cgrid{position:absolute;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:44px 44px;opacity:.18;pointer-events:none}
.cglow{position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(#e8a00012,transparent 65%);top:50%;left:50%;transform:translate(-50%,-50%)}
.cinner{position:relative;z-index:1;text-align:center;max-width:900px;width:100%;margin-top:auto;margin-bottom:auto;animation:fu .4s}
.ceye{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:4px;margin-bottom:14px;font-weight:600}
.ctit{font-family:var(--disp);font-size:clamp(44px,7vw,80px);letter-spacing:2px;line-height:.92;margin-bottom:10px}
.ctit span{color:var(--gold)}
.csub{font-size:14px;color:var(--muted2);margin:0 auto 44px;line-height:1.7;max-width:380px}
.ccards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;width:100%}
.ccard{background:var(--s1);border:1px solid var(--border);border-radius:13px;padding:24px 22px;cursor:pointer;transition:all .22s;text-align:left}
.ccard.cg:hover{border-color:#e8a00060;transform:translateY(-4px)}
.ccard.cb:hover{border-color:#3b82f660;transform:translateY(-4px)}
.ccard.cp:hover{border-color:#a855f760;transform:translateY(-4px)}
.ccard-ico{font-size:34px;margin-bottom:12px}
.ccard-name{font-family:var(--disp);font-size:24px;letter-spacing:1px;margin-bottom:5px}
.ccard-name.g{color:var(--gold)}.ccard-name.b{color:var(--blue)}.ccard-name.p{color:var(--purple)}
.ccard-desc{font-size:12.5px;color:var(--muted2);line-height:1.7;margin-bottom:14px}
.ctags{display:flex;flex-wrap:wrap;gap:5px}
.ctag{padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;border:1px solid}
.ctag.g{background:var(--goldl);color:var(--gold2);border-color:#e8a00044}
.ctag.b{background:var(--bluel);color:#1d4ed8;border-color:#3b82f644}
.ctag.p{background:var(--purplel);color:#7e22ce;border-color:#a855f744}
/* BIBLIOTECA */
.lib-wrap{display:flex;height:calc(100vh - 97px);overflow:hidden}
.lib-tree{width:260px;min-width:260px;border-right:1px solid var(--border);overflow-y:auto;padding:12px 0;flex-shrink:0}
.lib-main{flex:1;overflow-y:auto;padding:20px 22px}
.tree-item{display:flex;align-items:center;gap:6px;padding:7px 14px 7px 0;font-size:13px;cursor:pointer;border-radius:6px;transition:background .1s;user-select:none}
.tree-item:hover{background:var(--s2)}.tree-item.selected{background:var(--purplel);color:var(--purple)}
.tree-item .toggle{width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;color:var(--muted);transition:transform .15s}
.tree-item .toggle.open{transform:rotate(90deg)}
.tree-item .ico{font-size:15px;flex-shrink:0}.tree-item .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-item .cnt{font-size:10px;color:var(--muted);flex-shrink:0}
.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.file-card{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;transition:all .15s}
.file-card:hover{border-color:var(--purple);transform:translateY(-2px)}
.file-ico{font-size:38px;margin-bottom:8px;text-align:center}
.file-name{font-size:12px;font-weight:600;word-break:break-word;line-height:1.4;text-align:center;margin-bottom:4px}
.file-meta{font-size:10px;color:var(--muted);text-align:center}
.file-actions{display:flex;gap:4px;justify-content:center;margin-top:9px}
.breadcrumb{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted2);margin-bottom:16px;flex-wrap:wrap}
.breadcrumb span{cursor:pointer}.breadcrumb span:hover{color:var(--purple)}
.breadcrumb span.cur{color:var(--text);font-weight:600;cursor:default}.breadcrumb .sep{color:var(--muted)}
.drop-zone{border:2px dashed var(--border2);border-radius:10px;padding:28px;text-align:center;transition:all .2s;cursor:pointer;margin-bottom:14px}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--purple);background:var(--purplel)}
.drop-zone .dz-ico{font-size:28px;margin-bottom:7px}.drop-zone p{font-size:12.5px;color:var(--muted2)}
.ctx-menu{position:fixed;background:var(--s2);border:1px solid var(--border2);border-radius:8px;padding:5px;z-index:600;min-width:160px;box-shadow:0 8px 24px #0006;animation:fu .12s}
.ctx-item{padding:7px 12px;font-size:12.5px;border-radius:5px;cursor:pointer;display:flex;align-items:center;gap:7px;color:var(--text)}
.ctx-item:hover{background:var(--s3)}.ctx-item.danger{color:#b91c1c}.ctx-item.danger:hover{background:var(--redl)}
.ctx-sep{height:1px;background:var(--border);margin:4px 0}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes si{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}

/* ═══ RESPONSIVO COMPLETO ═══ */

/* Tablet largo / Desktop pequeno */
@media(max-width:1100px){
  .sidebar{width:185px;min-width:185px}
  .k4{grid-template-columns:repeat(2,1fr)}
  .ccards{grid-template-columns:repeat(2,1fr)}
}

/* Tablet */
@media(max-width:820px){
  .shell{flex-direction:column}
  .sidebar{width:100%;min-width:0;height:auto;flex-direction:row;flex-wrap:wrap;border-right:none;border-bottom:1px solid var(--border);overflow-x:auto;overflow-y:visible}
  .sb-hdr{padding:10px 12px;border-bottom:none;border-right:1px solid var(--border);flex-shrink:0}
  .sb-name{font-size:13px}.sb-sub{display:none}.sb-bdg{display:none}
  .sb-sec{display:none}
  .sb-item{padding:8px 12px;font-size:12px;border-left:none;border-bottom:2px solid transparent;white-space:nowrap}
  .sb-item.act{border-left:none;border-bottom-color:var(--gold)}
  .sb-item.act-b{border-left:none;border-bottom-color:var(--blue)}
  .sb-item.act-p{border-left:none;border-bottom-color:var(--purple)}
  .sb-foot{margin-top:0;padding:6px 10px;border-top:none;border-left:1px solid var(--border);margin-left:auto;flex-shrink:0}
  .main{min-height:0;flex:1}
  .content{padding:14px 14px}
  .topbar{padding:10px 14px}
  .k4{grid-template-columns:repeat(2,1fr)}
  .k3{grid-template-columns:repeat(2,1fr)}
  .g2{grid-template-columns:1fr}
  .ccards{grid-template-columns:1fr}
  .kval{font-size:24px}
  .lib-wrap{flex-direction:column;height:auto}
  .lib-tree{width:100%;min-width:0;border-right:none;border-bottom:1px solid var(--border);max-height:200px}
  .lib-main{padding:14px}
  table{font-size:11.5px}
  th,td{padding:7px 8px}
  .modal{padding:16px;width:calc(100vw - 24px)}
}

/* Mobile */
@media(max-width:540px){
  .k4{grid-template-columns:1fr 1fr}
  .k3{grid-template-columns:1fr 1fr}
  .k2{grid-template-columns:1fr}
  .kval{font-size:20px}
  .kval.sm{font-size:14px}
  .klbl{font-size:9px}
  .topbar{flex-direction:column;align-items:flex-start;gap:6px}
  .tb-title{font-size:16px}
  .tb-sub{font-size:10px}
  .shdr{flex-direction:column;align-items:flex-start}
  .stitle{font-size:14px}
  .content{padding:10px}
  .card{padding:12px}
  .login-box{padding:24px 18px}
  .confirm-box{padding:20px 18px}
  th,td{padding:5px 6px}
  th{font-size:9px}
  td{font-size:11px}
  .btn{padding:6px 10px;font-size:11.5px}
  .btn-sm{padding:3px 7px;font-size:10.5px}
  .frow.c2,.frow.c3,.frow.c4{grid-template-columns:1fr}
  .file-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .user-row{flex-wrap:wrap}
  .user-acts{width:100%;justify-content:flex-end}
  .net-bar{font-size:10.5px;padding:6px 10px}
  .g3{grid-template-columns:1fr}
  .ccards{grid-template-columns:1fr}
  .ccard{padding:16px 14px}
  .ccard-name{font-size:18px}
}

/* Mobile muito pequeno */
@media(max-width:360px){
  .k4,.k3,.k2{grid-template-columns:1fr}
  .login-box{padding:20px 14px}
  .sb-item span:last-child{display:none}
}
/* LOGIN */
.login-wrap{min-height:100vh;height:100%;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:clamp(12px,4vw,32px);position:relative;overflow-y:auto;overflow-x:hidden}
.login-grid{position:absolute;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:44px 44px;opacity:.15;pointer-events:none}
.login-glow{position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(#e8a00010,transparent 65%);top:50%;left:50%;transform:translate(-50%,-50%)}
.login-box{position:relative;z-index:1;background:var(--s1);border:1px solid var(--border2);border-radius:16px;padding:clamp(20px,5vw,36px) clamp(18px,6vw,38px);width:100%;max-width:min(420px,96vw);animation:fu .3s}
.login-logo{font-family:var(--disp);font-size:clamp(24px,5vw,36px);letter-spacing:2px;text-align:center;margin-bottom:4px}
.login-logo span{color:var(--gold)}
.login-eye{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:3px;text-align:center;margin-bottom:28px}
.login-tabs{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:3px;gap:3px;margin-bottom:22px}
.login-tab{flex:1;padding:7px;text-align:center;font-size:12.5px;font-weight:600;border-radius:6px;cursor:pointer;color:var(--muted2);transition:all .15s}
.login-tab.act{background:var(--s2);color:var(--text);border:1px solid var(--border2)}
.login-field{margin-bottom:13px}
.login-field label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;display:block;margin-bottom:4px}
.login-field input{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-size:13.5px;outline:none;transition:border-color .15s;font-family:var(--font)}
.login-field input:focus{border-color:var(--gold);box-shadow:0 0 0 2px #e8a00018}
.login-btn{width:100%;padding:11px;background:var(--gold);color:#000;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font);letter-spacing:.5px;transition:all .15s;margin-top:6px}
.login-btn:hover{background:var(--gold2)}.login-btn:active{transform:scale(.98)}
.login-btn.b{background:var(--blue);color:#fff}.login-btn.b:hover{filter:brightness(1.15)}
.login-err{background:var(--redl);border:1px solid #ef444444;border-radius:7px;padding:9px 12px;font-size:12px;color:#b91c1c;margin-bottom:12px;display:none}
.login-info{background:var(--bluel);border:1px solid #3b82f644;border-radius:7px;padding:9px 12px;font-size:12px;color:#1d4ed8;margin-bottom:12px;display:none}
.login-pending{text-align:center;padding:16px;background:var(--amberl);border:1px solid #f59e0b44;border-radius:10px;color:#92400e;font-size:13px}
.login-pending .lp-ico{font-size:36px;margin-bottom:8px}
/* ADMIN USERS */
.user-row{display:flex;align-items:center;gap:12px;padding:12px;background:var(--s2);border:1px solid var(--border);border-radius:10px;margin-bottom:8px}
.user-av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;font-family:var(--disp);flex-shrink:0}
.user-av.adm{background:var(--gold);color:#000}.user-av.usr{background:var(--blue);color:#fff}.user-av.pen{background:var(--s3);color:var(--muted2);border:1px solid var(--border2)}
.user-info{flex:1;min-width:0}
.user-name{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-meta{font-size:11px;color:var(--muted2)}
.user-acts{display:flex;gap:6px;flex-shrink:0}

/* CONFIRM MODAL CUSTOMIZADO */
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:9000;padding:20px;backdrop-filter:blur(4px);animation:fu .15s}
.confirm-box{background:var(--s2);border:1px solid var(--border2);border-radius:14px;padding:28px 30px;width:100%;max-width:360px;box-shadow:0 24px 60px #000a;animation:fu .18s}
.confirm-icon{font-size:36px;margin-bottom:12px;text-align:center}
.confirm-title{font-family:var(--disp);font-size:20px;letter-spacing:.5px;text-align:center;margin-bottom:6px}
.confirm-msg{font-size:13px;color:var(--muted2);text-align:center;line-height:1.6;margin-bottom:22px}
.confirm-btns{display:flex;gap:8px}
.confirm-btns button{flex:1;padding:10px;border:none;border-radius:8px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:var(--font);transition:all .13s;letter-spacing:.3px}
.confirm-btns button:active{transform:scale(.97)}
.cbtn-cancel{background:var(--s3);border:1px solid var(--border2)!important;color:var(--muted2)}
.cbtn-cancel:hover{border-color:var(--border2);color:var(--text)!important;background:var(--s3)!important}
.cbtn-confirm{background:var(--red);color:#fff}
.cbtn-confirm:hover{filter:brightness(1.15)}
.cbtn-confirm.warn{background:var(--amber);color:#000}
.cbtn-confirm.info{background:var(--blue);color:#fff}

/* UNIDADES POR USUÁRIO */
.unidades-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.unid-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid;cursor:pointer;transition:all .15s;user-select:none}
.unid-chip.on{background:var(--goldl);color:var(--gold2);border-color:#e8a00055}
.unid-chip.off{background:var(--s3);color:var(--muted);border-color:var(--border)}
.unid-chip:hover{transform:scale(1.04)}
.user-row-expanded{flex-direction:column;align-items:flex-start;gap:10px}
.user-row-top{display:flex;align-items:center;gap:12px;width:100%}

/* STATUS DE CONEXÃO */
.net-bar{position:fixed;top:0;left:0;right:0;z-index:9998;padding:7px 16px;display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;transition:all .4s;pointer-events:none;opacity:0}
.net-bar.show{opacity:1;pointer-events:all}
.net-bar.offline{background:#fdf4e7;border-bottom:1px solid #f59e0b55;color:#92400e}
.net-bar.syncing{background:#eaf1fb;border-bottom:1px solid #3b82f655;color:#1d4ed8}
.net-bar.synced{background:#eaf6ee;border-bottom:1px solid #22c55e55;color:#15803d}
.net-bar-left{display:flex;align-items:center;gap:8px}
.net-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.net-bar.offline .net-dot{background:#f59e0b;box-shadow:0 0 6px #f59e0b}
.net-bar.syncing .net-dot{background:#3b82f6;box-shadow:0 0 6px #3b82f6;animation:pulse .8s infinite}
.net-bar.synced .net-dot{background:#22c55e;box-shadow:0 0 6px #22c55e}
.net-pending{background:#f59e0b22;border:1px solid #f59e0b44;border-radius:20px;padding:1px 9px;font-size:10px;color:#92400e}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* IMPORTAÇÃO */
.import-drop{border:2px dashed var(--border2);border-radius:10px;padding:32px 20px;text-align:center;transition:all .2s;cursor:pointer;margin-bottom:14px;position:relative}
.import-drop:hover,.import-drop.drag{border-color:var(--gold);background:var(--goldl)}
.import-drop input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.import-drop .di{font-size:32px;margin-bottom:8px}
.import-drop p{font-size:12.5px;color:var(--muted2);margin:0}
.import-drop .ds{font-size:11px;color:var(--muted);margin-top:4px}
.import-preview{max-height:240px;overflow-y:auto;margin-bottom:12px}
.import-preview table{font-size:11px}
.import-preview th{font-size:9.5px}
.import-row-ok td{background:#22c55e08}
.import-row-err td{background:#ef444408}
.import-stats{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.import-stat{padding:6px 12px;border-radius:7px;font-size:12px;font-weight:600}
.import-stat.ok{background:#22c55e15;color:#15803d;border:1px solid #22c55e33}
.import-stat.err{background:#ef444415;color:#b91c1c;border:1px solid #ef444433}
.import-stat.info{background:var(--bluel);color:#1d4ed8;border:1px solid #3b82f633}

/* ANÁLISE DE ÓLEO */
.ccard.co:hover{border-color:#14b8a660;transform:translateY(-4px)}
.ccard-name.o{color:#14b8a6}
.ctag.o{background:#14b8a615;color:#14b8a6;border-color:#14b8a630}
.oil-select{height:100vh;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden}
.oil-back{position:fixed;top:14px;left:18px;z-index:10}
.oil-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:100%;max-width:820px}
.oil-card{background:var(--s1);border:1px solid var(--border);border-radius:16px;padding:32px 24px;cursor:pointer;transition:all .22s;text-align:center;position:relative;overflow:hidden}
.oil-card::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at top,var(--glow-c,transparent) 0%,transparent 70%);opacity:0;transition:opacity .3s}
.oil-card:hover{transform:translateY(-5px)}
.oil-card:hover::before{opacity:1}
.oil-card.og{--glow-c:#e8a00015}.oil-card.og:hover{border-color:#e8a00060}
.oil-card.ob{--glow-c:#3b82f615}.oil-card.ob:hover{border-color:#3b82f660}
.oil-card.op{--glow-c:#a855f715}.oil-card.op:hover{border-color:#a855f760}
.oil-card-ico{font-size:48px;margin-bottom:14px;display:block}
.oil-card-name{font-family:var(--disp);font-size:22px;letter-spacing:1px;margin-bottom:8px}
.oil-card-name.g{color:var(--gold)}.oil-card-name.b{color:var(--blue)}.oil-card-name.p{color:var(--purple)}
.oil-card-desc{font-size:12px;color:var(--muted2);line-height:1.7}
.oil-card-badge{display:inline-block;margin-top:12px;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.oil-card-badge.coming{background:var(--s3);color:var(--muted);border:1px solid var(--border)}
.oil-header{text-align:center;margin-bottom:32px}
.oil-header-title{font-family:var(--disp);font-size:clamp(28px,4vw,42px);letter-spacing:2px;margin-bottom:6px}
.oil-header-title span{color:#14b8a6}
.oil-header-sub{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:3px}
@media(max-width:640px){.oil-cards{grid-template-columns:1fr}.oil-select{justify-content:flex-start;padding-top:60px}}

/* ÓLEO MODULE */
.oil-status-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.oil-status-badge.normal{background:#22c55e15;color:#15803d;border:1px solid #22c55e33}
.oil-status-badge.atencao{background:#f59e0b15;color:#92400e;border:1px solid #f59e0b33}
.oil-status-badge.anormal{background:#ef444415;color:#b91c1c;border:1px solid #ef444433}
.oil-status-badge.critico{background:#ef444430;color:#991b1b;border:1px solid #ef444466;animation:pulse .8s infinite}
.oil-gauge{width:100%;height:8px;background:var(--s3);border-radius:4px;overflow:hidden;margin-top:6px}
.oil-gauge-fill{height:100%;border-radius:4px;transition:width .5s}
.oil-gauge-fill.normal{background:var(--green)}
.oil-gauge-fill.atencao{background:var(--amber)}
.oil-gauge-fill.anormal{background:var(--red)}
.oil-gauge-fill.critico{background:#ff0000}
.oil-sample-card{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .15s}
.oil-sample-card:hover{border-color:var(--border2);transform:translateX(2px)}
.oil-sample-card .osc-left{flex:1;min-width:0}
.oil-sample-card .osc-eq{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oil-sample-card .osc-meta{font-size:11px;color:var(--muted2);margin-top:2px}
.oil-coming{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 20px;text-align:center;gap:12px}
.oil-coming-ico{font-size:56px}
.oil-coming-title{font-family:var(--disp);font-size:24px;letter-spacing:1px;color:#14b8a6}
.oil-coming-sub{font-size:13px;color:var(--muted2);max-width:400px;line-height:1.7}
.oil-api-badge{display:inline-flex;align-items:center;gap:6px;background:var(--s3);border:1px solid var(--border);border-radius:20px;padding:5px 14px;font-size:11px;color:var(--muted2);margin-top:8px}
.oil-api-dot{width:7px;height:7px;border-radius:50%;background:#14b8a6;box-shadow:0 0 6px #14b8a6}

/* ═══ MEIO-TERMO CLARO ═══ */
body{-webkit-font-smoothing:antialiased}
tr:hover td{background:rgba(0,0,0,.03)}
input,select,textarea,.login-field input{background:#fff}
select option{background:#fff;color:var(--text)}
.overlay{background:rgba(18,22,30,.5)}.confirm-overlay{background:rgba(18,22,30,.45)}
.ctx-menu,.modal,.confirm-box{box-shadow:0 14px 40px rgba(24,30,42,.13)}
.toast{box-shadow:0 6px 18px rgba(24,30,42,.11)}
.card,.kpi,.user-row,.file-card,.oil-sample-card{box-shadow:0 1px 2px rgba(24,30,42,.05)}
.cgrid,.login-grid{opacity:.45}.cglow,.login-glow{opacity:.6}
.ctitle,.mtitle,.confirm-title{color:var(--goldt)}
.ctitle.b,.mtitle.b{color:var(--bluet)}.ctitle.p,.mtitle.p{color:var(--purplet)}
.ccard-name.g,.oil-card-name.g,.login-logo span,.ctit span{color:var(--goldt)}
.ccard-name.b,.oil-card-name.b{color:var(--bluet)}.ccard-name.p,.oil-card-name.p{color:var(--purplet)}
.tree-item.selected,.breadcrumb span:hover{color:var(--purplet)}
.sb-bdg.g{color:var(--goldt)}.sb-bdg.b{color:var(--bluet)}.sb-bdg.p{color:var(--purplet)}
.ctag.g,.unid-chip.on,.bdg.warn{color:var(--goldt)}
.ctag.b{color:var(--bluet)}.ctag.p{color:var(--purplet)}
.oil-coming-title,.oil-header-title span,.ccard-name.o,.ctag.o{color:#0f766e}
.oil-status-badge.normal{color:var(--greent)}.oil-status-badge.atencao{color:#92400e}
.oil-status-badge.anormal,.oil-status-badge.critico{color:var(--redt)}
.import-stat.ok{color:var(--greent)}.import-stat.err{color:var(--redt)}.import-stat.info{color:var(--bluet)}
.bdg.ok{color:var(--greent)}.bdg.err{color:var(--redt)}.bdg.info{color:var(--bluet)}
.bdg.amr{color:#92400e}.bdg.pur{color:var(--purplet)}
.toast.err{color:var(--redt)}.toast.info{color:var(--bluet)}.toast.warn{color:#92400e}
.btn-d,.login-err,.herr,.ctx-item.danger{color:var(--redt)}
.login-info{color:var(--bluet)}.login-pending{color:#92400e}
.user-av.pen{color:var(--muted2)}
table{font-size:13.5px}th{font-size:11px;letter-spacing:.7px;color:var(--muted2)}td{padding:10px 11px}
.klbl{font-size:11px;letter-spacing:.7px;color:var(--muted2)}.ksub{font-size:12px}
label,.login-field label{font-size:11px;letter-spacing:.4px;color:var(--muted2)}
.sb-sec{font-size:11px;letter-spacing:1.2px}.sb-item{font-size:13.5px}.tb-sub{font-size:12px}
.sb-item.act{background:#e8a00018}.sb-item.act-b{background:#3b82f614}.sb-item.act-p{background:#a855f714}

// ═══════ AUTH ═══════
// E-mail do administrador — altere para o seu
const ADMIN_EMAIL = 'admin@pcmgest.com';

const AUTH = {
  _key: 'gi_auth_user',
  _usersKey: 'gi_users_cache',

  // Usuário atual em sessão
  current() {
    try { return JSON.parse(sessionStorage.getItem(this._key) || 'null'); } catch(e){ return null; }
  },
  save(u) { sessionStorage.setItem(this._key, JSON.stringify(u)); },
  logout() { sessionStorage.removeItem(this._key); APP = {...APP, module:null, page:'dash', unidade:null}; localStorage.removeItem('gi_unidade'); render(); },
  isAdmin() { const u=this.current(); return u && u.email === ADMIN_EMAIL; },
  isLogged() { return !!this.current(); },

  // Hash simples (SHA-256 via SubtleCrypto)
  async hash(str) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  },

  // Busca usuário no Firebase (coleção "users")
  async findUser(email) {
    try {
      const r = await fetch(`https://firestore.googleapis.com/v1/projects/pcm-gest/databases/(default)/documents/users/${encodeURIComponent(email)}?key=AIzaSyDylbEPtXs35nw9r2Q1n8lSou5r8u2c_WA`);
      if (!r.ok) return null;
      const d = await r.json();
      if (!d.fields) return null;
      return FB.fromFS(d);
    } catch(e){ return null; }
  },

  // Salva usuário no Firebase
  async saveUser(user) {
    await FB.set('users', user.email, user);
  },

  // Lista todos os usuários
  async listUsers() {
    return await FB.getAll('users');
  },

  // Login
  async login(email, password) {
    email = email.trim().toLowerCase();
    const hashed = await this.hash(password);
    const user = await this.findUser(email);
    if (!user) return { ok: false, msg: 'E-mail não encontrado.' };
    if (user.passwordHash !== hashed) return { ok: false, msg: 'Senha incorreta.' };
    if (user.status === 'pending') return { ok: false, msg: 'pending' };
    if (user.status === 'blocked') return { ok: false, msg: 'Conta bloqueada. Entre em contato com o administrador.' };
    this.save(user);
    return { ok: true };
  },

  // Registro
  async register(name, email, password) {
    email = email.trim().toLowerCase();
    if (!name || !email || !password) return { ok: false, msg: 'Preencha todos os campos.' };
    if (password.length < 6) return { ok: false, msg: 'A senha deve ter no mínimo 6 caracteres.' };
    const existing = await this.findUser(email);
    if (existing) return { ok: false, msg: 'Este e-mail já está cadastrado.' };
    const hashed = await this.hash(password);
    const isAdmin = email === ADMIN_EMAIL;
    const user = {
      id: uid(),
      email,
      name,
      passwordHash: hashed,
      status: isAdmin ? 'active' : 'pending',
      role: isAdmin ? 'admin' : 'user',
      createdAt: new Date().toISOString()
    };
    await this.saveUser(user);
    if (isAdmin) { this.save(user); return { ok: true }; }
    return { ok: true, pending: true };
  },

  // Admin: aprovar usuário com unidades
  async approveUser(email, unidades) {
    const u = await this.findUser(email);
    if (!u) return;
    const upd = {...u, status:'active'};
    if(unidades !== undefined) upd.unidades = unidades; // array ou null (= todas)
    await this.saveUser(upd);
  },

  // Admin: atualizar unidades de usuário ativo
  async setUnidades(email, unidades) {
    const u = await this.findUser(email);
    if (!u) return;
    await this.saveUser({...u, unidades});
  },

  // Unidades acessíveis ao usuário atual
  unidadesPermitidas() {
    const u = this.current();
    if (!u) return [];
    if (u.role === 'admin') return null; // null = todas
    if (!u.unidades || u.unidades.length === 0) return [];
    return u.unidades;
  },

  // Admin: bloquear usuário
  async blockUser(email) {
    const u = await this.findUser(email);
    if (!u) return;
    await this.saveUser({...u, status:'blocked'});
  },

  // Admin: excluir usuário
  async deleteUser(email) {
    await FB.delete('users', email);
  }
};

const firebaseConfig={apiKey:"AIzaSyDylbEPtXs35nw9r2Q1n8lSou5r8u2c_WA",projectId:"pcm-gest"};
const FB={
  base(col){return`https://firestore.googleapis.com/v1/projects/${firebaseConfig.projectId}/databases/(default)/documents/${col}`},
  key(){return firebaseConfig.apiKey},
  toFS(obj){const f={};for(const[k,v]of Object.entries(obj)){if(v===null||v===undefined)f[k]={nullValue:null};else if(typeof v==='boolean')f[k]={booleanValue:v};else if(typeof v==='number')f[k]={doubleValue:v};else if(typeof v==='string')f[k]={stringValue:v};else f[k]={stringValue:JSON.stringify(v)};}return{fields:f}},
  fromFS(doc){if(!doc||!doc.fields)return null;const o={};for(const[k,v]of Object.entries(doc.fields)){if(v.nullValue!==undefined)o[k]=null;else if(v.booleanValue!==undefined)o[k]=v.booleanValue;else if(v.doubleValue!==undefined)o[k]=v.doubleValue;else if(v.integerValue!==undefined)o[k]=Number(v.integerValue);else if(v.stringValue!==undefined){try{const p=JSON.parse(v.stringValue);o[k]=(typeof p==='object'&&p!==null)?p:v.stringValue;}catch(e){o[k]=v.stringValue;}}}return o},
  async getAll(col){try{let out=[],tok='';do{const r=await fetch(`${this.base(col)}?key=${this.key()}&pageSize=300${tok?'&pageToken='+encodeURIComponent(tok):''}`);if(!r.ok)break;const d=await r.json();if(d.documents)out=out.concat(d.documents.map(doc=>this.fromFS(doc)));tok=d.nextPageToken||'';}while(tok);return out;}catch(e){return[];}},
  async get(col,id){try{const r=await fetch(`${this.base(col)}/${encodeURIComponent(id)}?key=${this.key()}`);if(!r.ok)return null;return this.fromFS(await r.json());}catch(e){return null;}},
  async set(col,id,obj){try{const r=await fetch(`${this.base(col)}/${encodeURIComponent(id)}?key=${this.key()}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(this.toFS(obj))});return r.ok;}catch(e){return false;}},
  async delete(col,id){try{const r=await fetch(`${this.base(col)}/${encodeURIComponent(id)}?key=${this.key()}`,{method:'DELETE'});return r.ok;}catch(e){return false;}}
};

// ═══════ LOCAL CACHE ═══════
const KEYS={tools:'gi_tools',mechs:'gi_mechs',loans:'gi_loans',machines:'gi_machines',batteries:'gi_batteries',batHist:'gi_bathist',libTree:'gi_libtree',lubFrota:'gi_lubfrota',lubExec:'gi_lubexec',progOS:'gi_progos',quadroBoard:'gi_quadroboard',quadroCat:'gi_quadrocat'};
const LOCAL={
  get(k){try{return JSON.parse(localStorage.getItem(KEYS[k])||'[]')}catch(e){return[]}},
  set(k,v){try{localStorage.setItem(KEYS[k],JSON.stringify(v))}catch(e){}},
  upsert(k,obj){const a=LOCAL.get(k);const i=a.findIndex(x=>x.id===obj.id);if(i>=0)a[i]={...a[i],...obj};else a.push(obj);LOCAL.set(k,a)},
  remove(k,id){LOCAL.set(k,LOCAL.get(k).filter(x=>x.id!==id))},
  find(k,id){return LOCAL.get(k).find(x=>x.id===id)||null}
};

// ═══════ OFFLINE QUEUE ═══════
const QUEUE_KEY = 'gi_sync_queue';
const QUEUE = {
  get(){ try{ return JSON.parse(localStorage.getItem(QUEUE_KEY)||'[]'); }catch(e){ return []; } },
  add(op){ const q=this.get(); q.push({...op, _qid: uid(), _ts: Date.now()}); localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); NET.updateBar(); },
  remove(qid){ const q=this.get().filter(x=>x._qid!==qid); localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); },
  clear(){ localStorage.removeItem(QUEUE_KEY); },
  count(){ return this.get().length; }
};

const NET = {
  _online: navigator.onLine,
  _syncing: false,

  init(){
    window.addEventListener('online',  ()=>{ this._online=true;  this.updateBar(); this.flushQueue(); });
    window.addEventListener('offline', ()=>{ this._online=false; this.updateBar(); });
    this.updateBar();
  },

  isOnline(){ return this._online && navigator.onLine; },

  updateBar(){
    const bar = document.getElementById('net-bar');
    if(!bar) return;
    const pending = QUEUE.count();
    if(this._syncing){
      bar.className='net-bar show syncing';
      bar.innerHTML=`<div class="net-bar-left"><div class="net-dot"></div>Sincronizando com o servidor...</div><div>${pending} pendente(s)</div>`;
    } else if(!this.isOnline()){
      bar.className='net-bar show offline';
      bar.innerHTML=`<div class="net-bar-left"><div class="net-dot"></div>⚠ Sem internet — dados salvos localmente${pending>0?`, <strong>${pending} aguardando envio</strong>`:''}</div>${pending>0?'<span class="net-pending">'+pending+' na fila</span>':''}`;
    } else if(pending>0){
      bar.className='net-bar show syncing';
      bar.innerHTML=`<div class="net-bar-left"><div class="net-dot"></div>Enviando ${pending} alteração(ões) pendente(s)...</div>`;
      this.flushQueue();
    } else {
      bar.className='net-bar show synced';
      bar.innerHTML=`<div class="net-bar-left"><div class="net-dot"></div>Online · dados sincronizados</div>`;
      setTimeout(()=>{ const b=document.getElementById('net-bar'); if(b) b.classList.remove('show'); },3000);
    }
  },

  async flushQueue(){
    if(this._syncing || !this.isOnline()) return;
    const queue = QUEUE.get();
    if(queue.length === 0){ this.updateBar(); return; }
    this._syncing = true;
    this.updateBar();
    let failed = 0;
    for(const op of queue){
      try{
        const ok = op.type==='set' ? await FB.set(op.col, op.id, op.data)
                 : op.type==='delete' ? await FB.delete(op.col, op.id) : true;
        if(ok) QUEUE.remove(op._qid); else failed++;
      }catch(e){ failed++; }
    }
    this._syncing = false;
    if(failed>0){ toast(`${failed} item(s) não sincronizaram. Tentando novamente...`,'warn'); }
    this.updateBar();
  }
};

// ═══════ DB ═══════
const DB={
  get(k){
    const all=LOCAL.get(k);
    if(!APP.unidade) return all;
    return all.filter(x=>!x.unidade||x.unidade===APP.unidade);
  },
  find(k,id){return this.get(k).find(x=>x.id===id)||null},
  async add(k,obj){
    const withU={...obj, unidade: APP.unidade||'geral'};
    LOCAL.upsert(k, withU);
    if(NET.isOnline()){ FB.set(k, withU.id, withU).then(ok=>{ if(!ok){ QUEUE.add({type:'set', col:k, id:withU.id, data:withU}); NET.updateBar(); } }); }
    else { QUEUE.add({type:'set', col:k, id:withU.id, data:withU}); NET.updateBar(); }
    return withU;
  },
  async update(k,id,data){
    const e=LOCAL.find(k,id)||{};
    const u={...e,...data,id,unidade:APP.unidade||'geral'};
    LOCAL.upsert(k,u);
    if(NET.isOnline()){ FB.set(k,id,u).then(ok=>{ if(!ok){ QUEUE.add({type:'set', col:k, id, data:u}); NET.updateBar(); } }); }
    else { QUEUE.add({type:'set', col:k, id, data:u}); NET.updateBar(); }
    return u;
  },
  async remove(k,id){
    LOCAL.remove(k,id);
    if(NET.isOnline()){ FB.delete(k,id).then(ok=>{ if(!ok){ QUEUE.add({type:'delete', col:k, id}); NET.updateBar(); } }); }
    else { QUEUE.add({type:'delete', col:k, id}); NET.updateBar(); }
  },
  async syncAll(){
    const tables=['tools','mechs','loans','machines','batteries','batHist','libTree','lubFrota','lubExec','progOS','quadroBoard','quadroCat'];
    let total=0;
    // Primeiro envia fila pendente se estiver online
    if(NET.isOnline()) await NET.flushQueue();
    await Promise.all(tables.map(async t=>{
      const docs=await FB.getAll(t);
      if(docs.length>0){
        // Mescla: mantém registros locais que não vieram do Firebase (criados offline)
        const local=LOCAL.get(t);
        const localById=new Map(local.map(l=>[l.id,l]));
        const fbIds=new Set(docs.map(d=>d.id));
        const onlyLocal=local.filter(l=>!fbIds.has(l.id));
        const merged=docs.map(d=>{const l=localById.get(d.id);return (l&&l.data&&!d.data)?{...d,data:l.data}:d;});
        LOCAL.set(t,[...merged,...onlyLocal]);
        total+=docs.length;
      }
    }));
    return total;
  }
};

let _importRows = [];

function handleImportDrop(e, type){
  e.preventDefault();
  document.getElementById('import-drop').classList.remove('drag');
  const file = e.dataTransfer.files[0];
  if(file) processImportFile(file, type);
}

function handleImportFile(input, type){
  const file = input.files[0];
  if(file) processImportFile(file, type);
}

function processImportFile(file, type){
  const s = SCHEMAS[type];
  const reader = new FileReader();
  reader.onload = e => {
    try{
      let rows = [];
      if(file.name.endsWith('.csv')){
        const text = e.target.result;
        rows = text.split('\n').map(l=>l.split(/[,;]/).map(c=>c.trim().replace(/^"|"$/g,'')));
      } else {
        const wb = XLSX.read(e.target.result, {type:'binary'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
      }
      // Remove cabeçalho e linhas vazias
      const dataRows = rows.slice(1).filter(r=>r.some(c=>c!==''&&c!==null&&c!==undefined));
      _importRows = dataRows.map(row => {
        const err = s.validate(row);
        return { row, err, obj: err ? null : s.toObj(row) };
      });
      renderImportPreview(type, s);
    } catch(err){
      toast('Erro ao ler arquivo: '+err.message,'err');
    }
  };
  if(file.name.endsWith('.csv')) reader.readAsText(file, 'UTF-8');
  else reader.readAsBinaryString(file);
}

function renderImportPreview(type, s){
  const valid = _importRows.filter(r=>!r.err);
  const invalid = _importRows.filter(r=>r.err);
  document.getElementById('import-drop').style.display='none';
  document.getElementById('import-preview-area').style.display='';
  document.getElementById('import-stats').innerHTML=`
    <div class="import-stat info">📄 ${_importRows.length} linhas lidas</div>
    <div class="import-stat ok">✓ ${valid.length} válidas</div>
    ${invalid.length?`<div class="import-stat err">✕ ${invalid.length} com erro</div>`:''}`;
  const thead = `<thead><tr><th>#</th>${s.headers.map(h=>`<th>${h}</th>`).join('')}<th>Status</th></tr></thead>`;
  const tbody = '<tbody>'+_importRows.map((r,i)=>`
    <tr class="${r.err?'import-row-err':'import-row-ok'}">
      <td>${i+1}</td>
      ${r.row.slice(0,s.headers.length).map(c=>`<td>${esc(String(c??''))}</td>`).join('')}
      <td>${r.err?`<span style="color:#b91c1c">✕ ${esc(r.err)}</span>`:'<span style="color:#15803d">✓</span>'}</td>
    </tr>`).join('')+'</tbody>';
  document.getElementById('import-table').innerHTML = thead+tbody;
  if(!valid.length) document.getElementById('import-confirm-btn').disabled=true;
}

async function confirmImport(type){
  const valid = _importRows.filter(r=>!r.err);
  if(!valid.length){ toast('Nenhum registro válido.','warn'); return; }
  const btn = document.getElementById('import-confirm-btn');
  btn.disabled=true; btn.textContent='Importando...';
  let ok=0, fail=0;
  for(const {obj} of valid){
    try{ await DB.add(type, {...obj, id:uid()}); ok++; }
    catch(e){ fail++; }

          CURVA_DIRTY.forEach(i=>{ if(st.apont[i]!==undefined)merged[i]=st.apont[i]; else delete merged[i]; });
          fin={apont:merged,
               janelas: CURVA_JANELAS_DIRTY ? st.janelas : (JSON.parse(d.janelas||'null')||st.janelas),
               extras: _exDirty ? (st.extras||[]) : JSON.parse(d.extras||'[]')};
        }
      }catch(e){}
    }
    const dados={id:'safra2627',apont:JSON.stringify(fin.apont),janelas:JSON.stringify(fin.janelas),

// --- curva S teórica: normal acumulada (média no meio da janela, sd 0,23) ---
const SD=0.23;
function probit(p){ // Acklam
  const a=[-39.69683028665376,220.9460984245205,-275.9285104469687,138.3577518672690,-30.66479806614716,2.506628277459239],
        b=[-54.47609879822406,161.5858368580409,-155.6989798598866,66.80131188771972,-13.28068155288572],
        c=[-0.007784894002430293,-0.3223964580411365,-2.400758277161838,-2.549732539343734,4.374664141464968,2.938163982698783],
        d=[0.007784695709041462,0.3224671290700398,2.445134137142996,3.754408661907416];
  const pl=0.02425;
  if(p<pl){const q=Math.sqrt(-2*Math.log(p));return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
  if(p>1-pl){const q=Math.sqrt(-2*Math.log(1-p));return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
  const q=p-0.5,r=q*q;
  return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
}
const ncdf=z=>{const t=1/(1+0.2316419*Math.abs(z)),d0=0.3989423*Math.exp(-z*z/2);
  let p=d0*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p;};
const F0=ncdf(-0.5/SD), F1=ncdf(0.5/SD);
const posS=r=>Math.min(1,Math.max(0,0.5+SD*probit(F0+r*(F1-F0))));
let DT={};                     // idx -> [iniMs, fimMs]
function recalcDatas(){
  DT={};
  const dia0=x=>Math.round(x/dia)*dia;
  D.grp.forEach((_,g)=>{
    const ini=pd(G[g].ini).getTime(), span=pd(G[g].fim)-ini, fl=span/(spanBase(g)*dia);
    // a curva S é montada dentro de cada UNIDADE: cada fazenda tem a sua S no grupo
    D.faz.forEach((_,u)=>{
      const idx=D.t.map((t,i)=>i).filter(i=>D.t[i][1]===g&&D.t[i][0]===u&&ativo(i));
      if(!idx.length)return;
      if(DIST==="s"){
        const ord=idx.slice().sort((a,b)=>(D.t[a][6]-D.t[b][6])||(D.t[a][5]-D.t[b][5]));
        const n=ord.length;
        ord.forEach((i,k)=>{const f=ini+span*posS((k+0.5)/n), dur=(D.t[i][6]-D.t[i][5])*dia*fl;
          DT[i]=[dia0(f-dur),dia0(f)];});
      } else {
        idx.forEach(i=>DT[i]=[dia0(ini+(D.t[i][5]-D.ini[g])*dia*fl),dia0(ini+(D.t[i][6]-D.ini[g])*dia*fl)]);
      }
    });
  });
}

function serieIdx(idx){
  const tot=idx.length;
  if(!tot)return{ws:[],prev:[],real:[],tot:0};
  const gs=[...new Set(idx.map(i=>D.t[i][1]))];
  const a=seg(new Date(Math.min.apply(null,gs.map(g=>+pd(G[g].ini))))), b=seg(new Date(Math.max.apply(null,gs.map(g=>+pd(G[g].fim)))));
  const ws=[];
  for(let t=a.getTime();t<=b.getTime();t+=7*dia)ws.push(new Date(t));
  const temA=idx.some(i=>apont[i]);
  let ap=0,ar=0;const prev=[],real=[];
  ws.forEach(w=>{const wf=w.getTime()+6*dia;
    idx.forEach(i=>{const f=+fimAj(i);
      if(f>=w.getTime()&&f<=wf)ap++;
      if(apont[i]){const p=pd(apont[i]).getTime();if(p>=w.getTime()&&p<=wf)ar++;}});
    prev.push(+(ap/tot*100).toFixed(1));
    real.push(temA&&w.getTime()<=HOJE.getTime()?+(ar/tot*100).toFixed(1):null);});
  return{ws,prev,real,tot};
}

const MESc=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];

function cronoMap(g){const ini=pd(G[g].ini).getTime(), span=pd(G[g].fim)-ini, fl=span/(spanBase(g)*dia);
  return w=>ini+(w-D.ini[g])*dia*fl;}
function cronoRender(){
  const wrap=document.getElementById("cronoWrap"), WK=30, LW=220;
  let ctrl='<div class="gt-ctrl"><b style="color:#000;margin-right:2px">Janela por grupo:</b>';
  D.grp.forEach((_,g)=>{ctrl+=`<span><b>${D.grp[g].split(" ")[0]}</b> `+
    `<input type="date" class="gci" data-g="${g}" value="${G[g].ini}"> a `+
    `<input type="date" class="gcf" data-g="${g}" value="${G[g].fim}"></span>`;});
  ctrl+='</div>';
  const rows=[];
  D.grp.forEach((_,g)=>{const map=cronoMap(g);
    const fros=[...new Set(D.t.filter((t,i)=>t[1]===g&&ativo(i)).map(t=>t[2]))];
    D.faz.forEach((_,u)=>{fros.forEach(fr=>{
      const idx=D.t.map((t,i)=>i).filter(i=>D.t[i][1]===g&&D.t[i][2]===fr&&D.t[i][0]===u&&ativo(i));
      if(!idx.length)return; let a=1/0,b=-1/0,ok=0;
      idx.forEach(i=>{a=Math.min(a,map(D.t[i][5]));b=Math.max(b,map(D.t[i][6]));if(apont[i])ok++;});
      rows.push({g,u,fro:fr,ini:new Date(a),fim:new Date(b),tot:idx.length,ok});});});});
  if(!rows.length){wrap.innerHTML=ctrl+'<div class="vazio" style="padding:20px">Nenhuma frota ativa.</div>';
    wireCtrl();document.getElementById("cronoCtx").textContent="";return;}
  const min=Math.min(...rows.map(r=>+r.ini)), max=Math.max(...rows.map(r=>+r.fim));
  const start=seg(new Date(min-7*dia)), end=seg(new Date(max+7*dia));
  const weeks=[]; for(let t=+start;t<=+end;t+=7*dia)weeks.push(new Date(t));
  const trackW=weeks.length*WK, spanMs=(+end)-(+start)||1, fullW=LW+trackW;
  const px=t=>((t-(+start))/spanMs*trackW);
  document.getElementById("cronoCtx").textContent=`${rows.length} frotas · ${br(start)} a ${br(end)}`;
  let head=`<div class="gt-row" style="grid-template-columns:${LW}px ${trackW}px"><div class="gt-left gt-hcol">FROTA / EQUIPAMENTO</div><div class="gt-head" style="width:${trackW}px">`;
  weeks.forEach(w=>head+=`<div class="gt-wk" style="width:${WK}px;flex:0 0 ${WK}px"><span>${MESc[w.getUTCMonth()]}</span><b>${brc(w)}</b></div>`);
  head+=`</div></div>`;
  let body="";
  D.grp.forEach((_,g)=>{const gr=rows.filter(r=>r.g===g); if(!gr.length)return;
    const done=gr.filter(r=>r.ok>=r.tot).length;
    body+=`<div class="gt-grp" style="width:${fullW}px">${D.grp[g]} <small>${done}/${gr.length} concluídas</small></div>`;
    D.faz.forEach((_,u)=>{const fr=gr.filter(r=>r.u===u).sort((x,y)=>x.ini-y.ini); if(!fr.length)return;
      body+=`<div class="gt-faz" style="width:${fullW}px">${D.faz[u]}</div>`;
      fr.forEach(r=>{const L=px(+r.ini), W=Math.max(px(+r.fim)-L,3), pc=r.tot?Math.round(r.ok/r.tot*100):0;
        body+=`<div class="gt-row" style="grid-template-columns:${LW}px ${trackW}px"><div class="gt-left" title="${D.fro[r.fro]}">${D.fro[r.fro]}<small>${br(r.ini)}–${br(r.fim)} · ${r.tot} ativ. · ${pc}%</small></div>
        <div class="gt-track" style="width:${trackW}px">${weeks.map((w,k)=>`<i class="gt-gl" style="left:${k*WK}px"></i>`).join("")}
          <div class="gt-bar g${g}" style="left:${L}px;width:${W}px"><span class="gt-fill" style="width:${pc}%"></span><em>${pc}%</em></div>
        </div></div>`;});});});
  const hL=px(+HOJE);
  const hoje=(hL>=0&&hL<=trackW)?`<div class="gt-hoje" style="left:${LW+hL}px"><b>HOJE ${brc(HOJE)}</b></div>`:"";
  wrap.innerHTML=ctrl+`<div class="gt" style="width:${fullW}px">${head}<div class="gt-body">${body}</div>${hoje}</div>
    <div class="gt-legend"><b style="color:#000">Grupos:</b>
     <span><i style="background:#2e7d4f"></i>Plantadeiras</span>
     <span><i style="background:#c9820e"></i>Plataformas</span>
     <span><i style="background:#12241c"></i>Colheitadeiras</span>
     <span style="margin-left:12px"><i style="background:#c00000"></i>Hoje</span>
     <span style="margin-left:auto;color:#888">Barra clara = % concluído · datas das semanas do .mpp reescaladas na janela do grupo</span></div>`;
  wireCtrl();
}

function loginTab(tab){
  const tabs=['login','reg','pending'];
  tabs.forEach(t=>{
    const el=document.getElementById('form-'+t);
    if(el) el.style.display = t===tab ? '' : 'none';
    const tb=document.getElementById('tab-'+t);
    if(tb){ if(t===tab) tb.classList.add('act'); else tb.classList.remove('act'); }
  });
  setLoginMsg('','','');
}

function setLoginMsg(err='', info=''){
  const e=document.getElementById('login-err'),i=document.getElementById('login-info');
  if(e){ e.style.display=err?'block':'none'; e.textContent=err; }
  if(i){ i.style.display=info?'block':'none'; i.textContent=info; }
}

async function doLogin(){
  const email=document.getElementById('l-email')?.value||'';

  if(!email||!pass){setLoginMsg('Preencha e-mail e senha.');return;}
  const btn=document.querySelector('#form-login .login-btn');
  btn.disabled=true; btn.textContent='Verificando...';
  const r=await AUTH.login(email,pass);
  btn.disabled=false; btn.textContent='Entrar no sistema';
  if(r.ok){ render(); return; }
  if(r.msg==='pending'){
    setLoginMsg('');
    loginTab('pending');

  }
  setLoginMsg(r.msg);
}

async function doRegister(){
  const name=document.getElementById('r-name')?.value||'';

  function userCard(u){
    const isMe=u.email===me.email;
    const avCls=u.role==='admin'?'adm':u.status==='pending'?'pen':'usr';
    const avLetter=(u.name||u.email||'?')[0].toUpperCase();
    const statusBdg=u.status==='active'?`<span class="bdg ok">Ativo</span>`:u.status==='pending'?`<span class="bdg amr">Pendente</span>`:`<span class="bdg err">Bloqueado</span>`;
    const roleBdg=u.role==='admin'?`<span class="bdg warn">Admin</span>`:`<span class="bdg info">Usuário</span>`;

    // Chips de unidades (só para não-admin)
    let unidChips='';
    if(u.role!=='admin'){
      const uPerms = u.unidades||[];
      const temTodas = uPerms.length===0;
      unidChips=`<div style="margin-top:8px">
        <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;font-weight:600">Unidades permitidas${temTodas?' · <span style=\'color:var(--muted)\'>nenhuma liberada</span>':''}</div>
        <div class="unidades-grid">
          ${UNIDADES.map(un=>{
            const on=uPerms.includes(un);
            return`<span class="unid-chip ${on?'on':'off'}" onclick="adminToggleUnidade('${esc(u.email)}','${esc(un)}')" title="${on?'Remover acesso':'Dar acesso'}">${on?'✓ ':'+'}${esc(un)}</span>`;
          }).join('')}
        </div>
      </div>`;
    }

    let acts='';
    if(!isMe){
      if(u.status==='pending') acts+=`<button class="btn btn-b btn-sm" onclick="adminApprove('${esc(u.email)}')">✓ Aprovar</button>`;
      if(u.status==='active') acts+=`<button class="btn btn-gh btn-sm" onclick="adminBlock('${esc(u.email)}')">Bloquear</button>`;
      if(u.status==='blocked') acts+=`<button class="btn btn-b btn-sm" onclick="adminApprove('${esc(u.email)}')">Reativar</button>`;
      acts+=`<button class="btn btn-d btn-sm" onclick="adminDelete('${esc(u.email)}')">✕</button>`;
    } else {
      acts=`<span style="font-size:11px;color:var(--muted)">Você</span>`;
    }
    return`<div class="user-row" style="flex-direction:column;align-items:stretch;gap:0">
      <div style="display:flex;align-items:center;gap:12px">
        <div class="user-av ${avCls}">${avLetter}</div>
        <div class="user-info">
          <div class="user-name">${esc(u.name||'Sem nome')}</div>
          <div class="user-meta">${esc(u.email)} · ${fmtDate(u.createdAt)}</div>
          <div style="margin-top:4px;display:flex;gap:4px">${statusBdg}${roleBdg}</div>
        </div>
        <div class="user-acts">${acts}</div>
      </div>
      ${unidChips}
    </div>`;
  }

  return`<div class="shell">
    <div class="sidebar">
      <div class="sb-hdr">
        <div class="sb-name">PCM <span style="color:var(--gold)">GEST</span></div>
        <div class="sb-sub">Gestão Integrada</div>
        <div class="sb-bdg g">Administrador</div>
      </div>
      <div class="sb-sec">Navegação</div>
      <div class="sb-item" onclick="APP.module=null;APP.unidade=null;render()">🏠 Início</div>
      <div class="sb-item act" onclick="">👥 Usuários</div>
      <div class="sb-foot">
        <div style="font-size:11px;color:var(--muted2);margin-bottom:6px">${esc(AUTH.current()?.name||'')} · Admin</div>
        <button class="btn btn-gh btn-sm" style="width:100%" onclick="AUTH.logout()">Sair</button>
      </div>
    </div>
    <div class="main">
      <div class="topbar">
        <div><div class="tb-title">GERENCIAR USUÁRIOS</div><div class="tb-sub">Aprovações e controle de acesso · PCM Gest</div></div>
      </div>
      <div class="content">
        ${pending.length>0?`
        <div class="card" style="border-color:#f59e0b44">
          <div class="ctitle" style="color:var(--amber)">⏳ Aguardando Aprovação (${pending.length})</div>
          ${pending.map(userCard).join('')}
        </div>`:''}
        <div class="card">
          <div class="ctitle">✓ Usuários Ativos (${active.length})</div>
          ${active.length?active.map(userCard).join(''):`<div class="empty"><div class="ei">👤</div><p>Nenhum usuário ativo.</p></div>`}
        </div>
        ${blocked.length>0?`
        <div class="card">
          <div class="ctitle" style="color:var(--red)">🚫 Bloqueados (${blocked.length})</div>
          ${blocked.map(userCard).join('')}
        </div>`:''}
      </div>
    </div>

}

async function adminApprove(email){
  await AUTH.approveUser(email);
  toast('Usuário aprovado!','ok');
  const html=await buildAdminShell();
  document.getElementById('root').innerHTML=html;
}
async function adminBlock(email){
  if(!await customConfirm({title:'Bloquear Usuário',msg:'Este usuário não conseguirá mais acessar o sistema.',icon:'🚫',confirmLabel:'Bloquear',type:'warn'}))return;
  await AUTH.blockUser(email);
  toast('Usuário bloqueado.','warn');
  const html=await buildAdminShell();
  document.getElementById('root').innerHTML=html;
}
async function adminDelete(email){
  if(!await customConfirm({title:'Excluir Usuário',msg:'Esta ação é permanente e não pode ser desfeita.',icon:'👤',confirmLabel:'Sim, excluir'}))return;
  await AUTH.deleteUser(email);
  toast('Usuário removido.','ok');
  const html=await buildAdminShell();
  document.getElementById('root').innerHTML=html;
}

async function adminToggleUnidade(email, unidade){
  const u = await AUTH.findUser(email);
  if(!u) return;
  let perms = Array.isArray(u.unidades) ? [...u.unidades] : [];
  if(perms.includes(unidade)){
    perms = perms.filter(x=>x!==unidade);
    toast(`Acesso à ${unidade} removido.`,'warn');
  } else {
    perms.push(unidade);
    toast(`${unidade} liberada para ${u.name||u.email}!`,'ok');
  }
  await AUTH.setUnidades(email, perms);
  // Atualizar só a sessão caso seja o próprio user logado (não é o caso aqui pois só admin acessa)
  const html=await buildAdminShell();
  document.getElementById('root').innerHTML=html;
}

function oilStatusColor(s){ return {critico:'#ef4444',anormal:'#dc2626',atencao:'#f59e0b',normal:'#22c55e'}[s]||'#888'; }
function oilStatusLabel(s){ return {critico:'CRÍTICO',anormal:'ANORMAL',atencao:'ATENÇÃO',normal:'NORMAL'}[s]||s; }
function oilStatusIco(s)  { return {critico:'🛑',anormal:'⚠️',atencao:'⚡',normal:'✅'}[s]||'•'; }
function oilRulColor(v)   { return v<=20?'#ef4444':v<=40?'#dc2626':v<=60?'#f59e0b':'#22c55e'; }

function oilParamStatus(val, lim){
  if(val > lim[1]*1.5 || val < lim[0]*0.5) return 'critico';
  if(val > lim[1] || val < lim[0]) return 'anormal';
  if(val > lim[1]*0.85 || (lim[0]>0 && val < lim[0]*1.15)) return 'atencao';
  return 'normal';
}

function buildOilMotoresReais(equips){
  var s360res = getS360Resultados();
  var syncAt = localStorage.getItem('s360_sync_at');
  var html = '<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">';
  html += '<div><div class="ctitle">🚜 Equipamentos S360 — Dados Reais</div>';
  html += '<div style="font-size:11px;color:var(--muted2)">Sincronizado: '+(syncAt?new Date(syncAt).toLocaleString('pt-BR'):'—')+' · '+equips.length+' equipamentos</div></div>';
  html += '<button class="btn btn-b btn-sm" onclick="s360SincronizarTudo()">↺ Atualizar</button></div>';
  html += '<div style="display:flex;flex-direction:column;gap:8px">';
  equips.forEach(function(eq){
    // Buscar último resultado deste equipamento
    var res = s360res.filter(function(r){ return r.idEquipamento===eq.id; });
    var ultimo = res.sort(function(a,b){ return new Date(b.data)-new Date(a.data); })[0];
    var status = ultimo ? ultimo.status : 'SEM_DADO';
    var color = S360.statusColor(status);
    var ico = S360.statusIco(status);
    html += '<div style="background:var(--s2);border:1px solid '+color+'44;border-left:3px solid '+color+';border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">';
    html += '<div style="font-size:22px">'+ico+'</div>';
    html += '<div style="flex:1;min-width:150px">';
    html += '<div style="font-weight:600;font-size:13.5px">'+esc(eq.modelo||eq.tagFrota)+'</div>';
    html += '<div style="font-size:11px;color:var(--muted2)">'+esc(eq.tagFrota)+' · '+esc(eq.chassiSerie)+'</div>';
    html += '<div style="font-size:11px;color:var(--muted2)">'+esc(eq.setor||eq.area||'')+(eq.obra?(' · '+esc(eq.obra.nome)):'')+'</div>';
    html += '<div style="margin-top:5px;display:flex;gap:5px;flex-wrap:wrap">';
    html += '<span style="background:'+color+'15;color:'+color+';border:1px solid '+color+'33;border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700">'+status.replace('_',' ')+'</span>';
    html += '<span style="background:var(--s3);border:1px solid var(--border);border-radius:20px;padding:2px 8px;font-size:10px;color:var(--muted2)">'+res.length+' análise(s)</span>';
    if(ultimo) html += '<span style="background:var(--s3);border:1px solid var(--border);border-radius:20px;padding:2px 8px;font-size:10px;color:var(--muted2)">'+new Date(ultimo.data).toLocaleDateString('pt-BR')+'</span>';
    html += '</div></div>';
    html += '</div>';
  });
  html += '</div></div>';
  return html;
}

    html+='<button class="btn btn-sm" style="background:#14b8a6;color:#000;border:none;border-radius:6px;padding:8px 16px;font-size:12px;font-weight:700;cursor:pointer" data-oa="plia" data-oid="'+id+'">🤖 Gerar Plano IA</button></div>';
  } else {
    if(pendentes.length)html+='<div style="margin-bottom:12px"><div style="font-size:11px;font-weight:700;color:#f59e0b;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">⏳ Pendentes ('+pendentes.length+')</div>'+pendentes.map(mkPlanoCard).join('')+'</div>';
    if(emExec.length)html+='<div style="margin-bottom:12px"><div style="font-size:11px;font-weight:700;color:#3b82f6;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">🔄 Em Execução ('+emExec.length+')</div>'+emExec.map(mkPlanoCard).join('')+'</div>';
    if(concluidos.length)html+='<div><div style="font-size:11px;font-weight:700;color:#22c55e;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">✅ Concluídos ('+concluidos.length+')</div>'+concluidos.map(mkPlanoCard).join('')+'</div>';
  }
  html+='</div>';

  // Event delegation via setTimeout para garantir que o DOM está pronto
  setTimeout(function(){
    document.addEventListener("click",function oilRelDlg(e){
      var t=e.target.closest("[data-oa],[data-pa]");
      if(!t)return;
      var oa=t.dataset.oa, pa=t.dataset.pa, oid=t.dataset.oid, pid=t.dataset.pid, sid=t.dataset.sid;
      if(oa==="back"){document.removeEventListener("click",oilRelDlg);APP.oilPage="maquinas_rel";render();}
      else if(oa==="plia"&&oid)openOilPlanoModalIA(oid);
      else if(oa==="plman"&&oid)openOilPlanoModal(oid);
      else if(oa==="rel"&&oid)gerarRelatorioOilIA(oid);
      else if(pa==="ini"&&pid)updateOilPlanoStatus(pid,"execucao");
      else if(pa==="con"&&pid)updateOilPlanoStatus(pid,"concluido");
      else if(pa==="del"&&pid)deleteOilPlano(pid);
      else if(pa==="tog"&&pid&&sid)toggleOilPasso(pid,parseInt(sid));
    });
  },50);

  return html;
}

async function gerarRelatorioOilIA(motorId){
  const m = OIL_MOTORES.find(x=>x.id===motorId);
  if(!m) return;
  const out = document.getElementById('oil-relatorio-output');
  if(!out) return;
  out.innerHTML=`<div style="padding:32px;text-align:center;color:var(--muted2)">
    <div style="width:24px;height:24px;border:2px solid var(--gold);border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px"></div>
    <div>Gerando relatório científico com IA...</div>
  </div>`;

  const prompt = `Você é um engenheiro especialista em lubrificação e análise de óleo mineral para motores agrícolas e industriais. 
Analise os seguintes dados de análise de óleo e gere um relatório técnico científico completo em português.

SETOR: ${m.setor}
HORAS MOTOR: ${m.horasMotor}h | HORAS ÓLEO ATUAL: ${m.horasOleo}h
STATUS: ${oilStatusLabel(m.status)}
RUL ESTIMADO: ${m.rul}%
ÚLTIMA ANÁLISE: ${m.ultimaAnalise}

PARÂMETROS ANALISADOS:
- Viscosidade: ${m.params.viscosidade} cSt (limite: ${m.limites.viscosidade.join('–')})
- Acidez TAN: ${m.params.acidez} (limite: 0–${m.limites.acidez[1]})
- Ferro (Fe): ${m.params.ferro} ppm (limite: 0–${m.limites.ferro[1]})
- Cobre (Cu): ${m.params.cobre} ppm (limite: 0–${m.limites.cobre[1]})
- Chumbo (Pb): ${m.params.chumbo} ppm (limite: 0–${m.limites.chumbo[1]})

HISTÓRICO:
${m.historico.map(h=>`${h.data}: Fe=${h.ferro}ppm, Viscosidade=${h.viscosidade}, Acidez=${h.acidez}, Status=${h.status}`).join('\n')}

Gere um relatório com as seguintes seções:

Seja específico, técnico e objetivo. Use dados concretos do laudo.`;

  try{

        max_tokens:1500,
        messages:[{role:"user",content:prompt}]
      })
    });
    const data = await response.json();
    const text = data.content?.map(i=>i.text||'').join('\n') || 'Erro ao gerar relatório.';

    const formatted = text
      .replace(/^(#{1,3} .+)$/gm, '<div style="font-family:var(--disp);font-size:16px;color:#14b8a6;margin:16px 0 6px;letter-spacing:.5px">$1</div>')

function saveOilPlanoModal(){
  const motorId  = document.getElementById('oil-plano-motor')?.value;
  const acao     = document.getElementById('oil-plano-acao')?.value?.trim();
  const resp     = document.getElementById('oil-plano-resp')?.value?.trim();
  const prazo    = document.getElementById('oil-plano-prazo')?.value;
  const prioridade = document.getElementById('oil-plano-prioridade')?.value;
  const obs      = document.getElementById('oil-plano-obs')?.value?.trim();
  if(!acao||!resp||!prazo){ toast('Preencha todos os campos obrigatórios.','warn'); return; }
  const planos = getOilPlanos();
  planos.push({id:uid(), motorId, acao, responsavel:resp, prazo, prioridade, obs, status:'pendente', criadoEm:new Date().toISOString()});
  saveOilPlanos(planos);
  closeModal();
  toast('Plano de ação criado!','ok');
  render();

function updateOilPlanoStatus(id, novoStatus){
  const planos = getOilPlanos().map(p=>p.id===id?{...p,status:novoStatus}:p);
  saveOilPlanos(planos);
  toast(novoStatus==='concluido'?'Plano concluído! ✅':'Plano iniciado!','ok');
  render();
}

function deleteOilPlano(id){
  const planos = getOilPlanos().filter(p=>p.id!==id);
  saveOilPlanos(planos);
  toast('Plano removido.','warn');
  render();
}

function toggleOilPasso(planoId, passoId){
  const planos = getOilPlanos().map(p=>{
    if(p.id!==planoId) return p;
    const passos = (p.passos||[]).map(s=>s.id===passoId?{...s,done:!s.done}:s);
    const allDone = passos.every(s=>s.done);
    return {...p, passos, status: allDone?'concluido':(passos.some(s=>s.done)?'execucao':'pendente')};
  });
  saveOilPlanos(planos);
  render();
}

// ── CONFIG ──
// ═══════ S360 API ═══════
// SOLUÇÃO CORS: as chamadas passam pelo proxy local em servidor.py.
// O navegador acessa /api/s360/producao/... ou /api/s360/teste/... e o servidor encaminha para o ambiente S360 correspondente.
// O arquivo DEVE ser aberto via servidor.py, não por file:// nem por servidor HTTP simples.
const S360={
  _key:'oil_s360_cfg',
  envs:{producao:{label:'Produção',basePath:'/api/s360/producao',host:'https://api.s360web.com'},teste:{label:'Teste',basePath:'/api/s360/teste',host:'https://integration.s360web.com'}},
  getEnv(){const c=this.getCfg();return (c.environment==='teste'||c.environment==='producao')?c.environment:'producao'},
  setEnv(env){const c=this.getCfg();const novo=(env==='teste')?'teste':'producao';this.saveCfg({...c,environment:novo});return novo},
  getEnvInfo(){return this.envs[this.getEnv()]||this.envs.producao},
  base(){return window.location.origin+this.getEnvInfo().basePath},
  getCfg(){try{return JSON.parse(localStorage.getItem(this._key)||'{}')}catch(e){return{}}},
  saveCfg(c){localStorage.setItem(this._key,JSON.stringify(c))},
  getToken(){return this.getCfg().access_token||null},
  isConfigured(){return!!this.getToken()},

  // Requisição com tratamento robusto de erros
  async _req(url,options){
    try{
      const response=await fetch(url,{
        ...options,
        headers:{
          'Content-Type':'application/json',
          ...(options.headers||{})
        }
      });
      
      // Tratamento de status HTTP
      if(response.status===401)throw new Error('Credenciais inválidas (401). Verifique usuário e senha.');
      if(response.status===403)throw new Error('Acesso negado (403). Verifique as permissões da conta.');
      if(response.status===404)throw new Error('Endpoint não encontrado (404): '+url);
      if(response.status===500)throw new Error('Erro no servidor S360 (500). Tente novamente.');
      if(!response.ok)throw new Error('Erro HTTP '+response.status+': '+response.statusText);
      
      const data=await response.json();
      return data;
    }catch(e){
      // Melhor diagnóstico de erro
      const msg=e.message||'';
      if(msg.includes('Failed to fetch')||msg.includes('NetworkError')||msg.includes('CORS')){
        throw new Error('Erro de conexão. Verifique sua internet e tente novamente.');
      }
      throw e;
    }
  },

  async login(username,password){
    if(!username||!password)throw new Error('Usuário e senha são obrigatórios');
    
    const data=await this._req(this.base()+'/login',{
      method:'POST',
      body:JSON.stringify({username,password})
    });
    
    if(!data.access_token)throw new Error('Token não retornado pela API S360. Resposta: '+JSON.stringify(data));
    
    const environment=this.getEnv();
    this.saveCfg({...data,username,environment,saved_at:Date.now()});
    console.log('[S360] Login bem-sucedido para: '+username+' em '+environment);
    return data;
  },

  async authHeaders(){
    const cfg=this.getCfg();
    if(!cfg.access_token)throw new Error('Não autenticado — configure em Análise de Óleo → Configurações');
    return{
      'Content-Type':'application/json',
      'Authorization':'Bearer '+cfg.access_token
    };
  },

  async getEquipamentos(filtro){
    const h=await this.authHeaders();
    const data=await this._req(this.base()+'/v1/equipamento/list',{
      method:'POST',
      headers:h,
      body:JSON.stringify({ativo:true,maximoPorPagina:100,numeroPagina:1,...(filtro||{})})
    });
    if(!data.resultados)throw new Error('Formato inesperado na resposta de equipamentos');
    return data;
  },

  async getResultados(filtro){
    const h=await this.authHeaders();
    const hoje=new Date().toISOString().slice(0,10);
    const d30=new Date(Date.now()-30*24*60*60*1000).toISOString().slice(0,10);
    const data=await this._req(this.base()+'/v3/resultadoAmostra/list',{
      method:'POST',
      headers:h,
      body:JSON.stringify({statusLeitura:'TODOS',maximoPorPagina:50,numeroPagina:1,dataDe:d30,dataAte:hoje,...(filtro||{})})
    });
    if(!data.resultados)throw new Error('Formato inesperado na resposta de resultados');
    return data;
  },

  statusColor(s){return{NORMAL:'#22c55e',ATENCAO:'#f59e0b',ANORMAL:'#dc2626',CRITICO:'#ef4444',COLETADA:'#3b82f6',SEGREGADA:'#a855f7'}[s]||'#888';},
  statusIco(s){return{NORMAL:'✅',ATENCAO:'⚡',ANORMAL:'⚠️',CRITICO:'🛑',COLETADA:'🧪',SEGREGADA:'🔬'}[s]||'•';},
  
  // Teste de conectividade
  async testConnection(){
    try{
      const response=await fetch(this.base()+'/login',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({username:'__test__',password:'__test__'})
      });
      return response.status!==502&&response.status!==0;
    }catch(e){
      console.error('[S360] Teste de conexão falhou:',e.message);
      return false;
    }
  }
};

function s360ChangeEnv(){
  var env=document.getElementById('s360-env')?.value||'producao';
  var old=S360.getEnv();
  S360.setEnv(env);
  if(old!==env){
    localStorage.removeItem('s360_equipamentos');
    localStorage.removeItem('s360_resultados');
    localStorage.removeItem('s360_sync_at');
    toast('Ambiente S360 alterado para '+S360.getEnvInfo().label+'. Faça login novamente se necessário.','warn');
    APP.oilPage='config';render();
  }
}

async function s360TestConnection(){
  var statusEl=document.getElementById('s360-conn-status');
  function setStatus(msg,color){if(statusEl){statusEl.innerHTML='<div style="font-size:12px;padding:8px 12px;border-radius:7px;background:'+color+'15;border:1px solid '+color+'33;color:'+color+';margin-top:10px">'+msg+'</div>';}}
  var env=S360.getEnvInfo();
  setStatus('🔍 Testando conexão com a API S360 em '+env.label+' ('+env.host+')...','#3b82f6');
  try{
    var isConnected=await S360.testConnection();
    if(isConnected){
      setStatus('✓ Conexão OK! Você pode fazer login agora.','#22c55e');
      toast('Conexão com API S360 está funcionando!','ok');
    }else{
      setStatus('✕ Não foi possível conectar. Verifique sua conexão e tente novamente.','#ef4444');
      toast('Erro de conexão. Veja as instruções acima.','err');
    }
  }catch(e){
    setStatus('✕ Erro: '+e.message,'#ef4444');
    toast('Erro ao testar conexão: '+e.message,'err');
  }
}

async function s360Login(){
  var user=document.getElementById('s360-user')?.value?.trim();
  var pass=document.getElementById('s360-pass')?.value;
  if(!user||!pass){toast('Preencha usuário e senha.','warn');return;}
  var btn=document.querySelector('button[onclick="s360Login()"]');
  var statusEl=document.getElementById('s360-conn-status');
  function setStatus(msg,color){if(statusEl){statusEl.innerHTML='<div style="font-size:12px;padding:8px 12px;border-radius:7px;background:'+color+'15;border:1px solid '+color+'33;color:'+color+';margin-top:10px">'+msg+'</div>';}}
  if(btn){btn.disabled=true;btn.textContent='🔄 Conectando...';}
  var envSel=document.getElementById('s360-env')?.value||S360.getEnv();
  S360.setEnv(envSel);
  var env=S360.getEnvInfo();
  setStatus('⏳ Conectando à API S360 em '+env.label+' ('+env.host+')...','#3b82f6');
  try{
    await S360.login(user,pass);
    setStatus('','transparent');
    toast('✓ Conectado à API S360!','ok');
    APP.oilPage='config';render();
  }catch(e){
    var msg=e.message||'';
    var isCred=msg.includes('401')||msg.includes('403')||msg.includes('credencial')||msg.includes('senha')||msg.includes('inválidas');
    var isHttp=msg.includes('HTTP')||msg.includes('Erro de conex');
    var hint='';
    if(isCred) hint='Verifique usuário, senha e ambiente selecionado. Credenciais de Teste normalmente não funcionam em Produção, e vice-versa.';
    else if(isHttp) hint='Erro de conexão com a API S360. Verifique suas credenciais.';
    else hint='Erro desconhecido. Verifique as instruções acima.';
    setStatus('✕ '+msg+'<br><span style="opacity:.8;font-size:11px">'+hint+'</span>','#ef4444');
    toast('Erro ao conectar: '+msg,'err');
    if(btn){btn.disabled=false;btn.textContent='🔐 Conectar à API S360';}
  }
}

function s360Logout(){
  localStorage.removeItem('oil_s360_cfg');
  localStorage.removeItem('s360_equipamentos');
  localStorage.removeItem('s360_resultados');
  localStorage.removeItem('s360_sync_at');
  toast('Desconectado da API S360.','warn');
  APP.oilPage='config';render();
}

async function s360SincronizarTudo(){
  var el=document.getElementById('s360-sync-status');
  var spin='<div style="display:flex;align-items:center;gap:8px;color:var(--muted2);font-size:13px"><div style="width:16px;height:16px;border:2px solid var(--gold);border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite"></div>';
  if(el)el.innerHTML=spin+'Buscando equipamentos...</div>';
  try{
    var eqData=await S360.getEquipamentos({ativo:true});
    var equips=eqData.resultados||[];
    localStorage.setItem('s360_equipamentos',JSON.stringify(equips));
    if(el)el.innerHTML=spin+'Buscando resultados ('+equips.length+' equip. carregados)...</div>';
    var resData=await S360.getResultados({statusLeitura:'TODOS',maximoPorPagina:50});
    var resultados=resData.resultados||[];
    localStorage.setItem('s360_resultados',JSON.stringify(resultados));
    localStorage.setItem('s360_sync_at',new Date().toISOString());
    toast('Sincronizado! '+equips.length+' equip. · '+resultados.length+' resultados','ok');
    APP.oilPage='config';render();
  }catch(e){
    if(el)el.innerHTML='<div style="color:#b91c1c">✕ Erro: '+e.message+'</div>';
    toast('Erro: '+e.message,'err');
  }
}

function buildOilMotoresReais(equips){
  var s360res=getS360Resultados();

  var html='<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">';

    html+='<div style="font-size:11px;color:var(--muted2)">'+esc(eq.tagFrota||'')+' · '+esc(eq.chassiSerie||'')+'</div>';
    html+='<div style="font-size:11px;color:var(--muted2)">'+(eq.setor?esc(eq.setor):'')+(eq.obra?(' · '+esc(eq.obra.nome)):'')+'</div>';
    html+='<div style="margin-top:5px;display:flex;gap:5px;flex-wrap:wrap">';
    html+='<span style="background:'+color+'15;color:'+color+';border:1px solid '+color+'33;border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700">'+status.replace('_',' ')+'</span>';

  return html;
