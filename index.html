<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Gestão Integrada — PCM</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0c0f;--s1:#111417;--s2:#181c22;--s3:#1f242d;
  --border:#252c38;--border2:#2e3848;
  --gold:#e8a000;--gold2:#fbbf24;--goldl:#e8a00022;
  --blue:#3b82f6;--bluel:#3b82f622;
  --green:#22c55e;--greenl:#22c55e22;
  --red:#ef4444;--redl:#ef444422;
  --amber:#f59e0b;--amberl:#f59e0b22;
  --purple:#a855f7;--purplel:#a855f722;
  --text:#dde3ef;--muted:#5a6478;--muted2:#8896af;
  --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;--disp:'Bebas Neue',cursive;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);height:100vh;overflow:hidden}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.shell{display:flex;height:100vh;overflow:hidden}
.sidebar{width:215px;min-width:215px;background:var(--s1);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.content{flex:1;overflow-y:auto;padding:22px 24px}
.topbar{background:var(--s1);border-bottom:1px solid var(--border);padding:12px 22px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.tb-title{font-family:var(--disp);font-size:20px;letter-spacing:1px}
.tb-sub{font-size:11px;color:var(--muted);margin-top:2px}
.sb-hdr{padding:16px 14px 12px;border-bottom:1px solid var(--border)}
.sb-name{font-family:var(--disp);font-size:15px;letter-spacing:1px}
.sb-sub{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:2px}
.sb-bdg{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:600;margin-top:5px;border:1px solid}
.sb-bdg.g{background:var(--goldl);color:var(--gold);border-color:#e8a00044}
.sb-bdg.b{background:var(--bluel);color:var(--blue);border-color:#3b82f644}
.sb-bdg.p{background:var(--purplel);color:var(--purple);border-color:#a855f744}
.sb-sec{padding:10px 14px 3px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;font-weight:600}
.sb-item{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:13px;font-weight:500;color:var(--muted2);border-left:2px solid transparent;cursor:pointer;transition:all .1s;user-select:none}
.sb-item:hover{color:var(--text);background:var(--s2)}
.sb-item.act{color:var(--text);border-left-color:var(--gold);background:var(--goldl)}
.sb-item.act-b{color:var(--text);border-left-color:var(--blue);background:var(--bluel)}
.sb-item.act-p{color:var(--text);border-left-color:var(--purple);background:var(--purplel)}
.pill{margin-left:auto;padding:1px 7px;border-radius:20px;font-size:10px;font-weight:700;min-width:18px;text-align:center}
.pill.g{background:var(--gold);color:#000}.pill.b{background:var(--blue);color:#fff}
.pill.r{background:var(--red);color:#fff}.pill.p{background:var(--purple);color:#fff}
.sb-foot{margin-top:auto;padding:10px 14px;border-top:1px solid var(--border)}
.card{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:14px}
.ctitle{font-family:var(--disp);font-size:14px;letter-spacing:.5px;color:var(--gold);margin-bottom:12px}
.ctitle.b{color:var(--blue)}.ctitle.p{color:var(--purple)}
.kgrid{display:grid;gap:11px;margin-bottom:18px}
.k4{grid-template-columns:repeat(4,1fr)}.k3{grid-template-columns:repeat(3,1fr)}.k2{grid-template-columns:repeat(2,1fr)}
.kpi{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;position:relative;overflow:hidden}
.kbar{position:absolute;top:0;left:0;right:0;height:2px}
.klbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;font-weight:600}
.kval{font-family:var(--disp);font-size:32px;line-height:1;margin:4px 0 2px;letter-spacing:1px}
.kval.sm{font-size:18px;margin-top:7px;letter-spacing:0}
.ksub{font-size:11px;color:var(--muted2)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;padding:7px 11px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 11px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#ffffff04}
.bdg{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;text-transform:uppercase;white-space:nowrap;border:1px solid}
.bdg.ok{background:var(--greenl);color:#4ade80;border-color:#22c55e44}
.bdg.warn{background:var(--goldl);color:var(--gold2);border-color:#e8a00044}
.bdg.err{background:var(--redl);color:#fca5a5;border-color:#ef444444}
.bdg.info{background:var(--bluel);color:#93c5fd;border-color:#3b82f644}
.bdg.amr{background:var(--amberl);color:#fcd34d;border-color:#f59e0b44}
.bdg.neu{background:var(--s3);color:var(--muted2);border-color:var(--border)}
.bdg.pur{background:var(--purplel);color:#d8b4fe;border-color:#a855f744}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border:none;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;transition:all .13s;white-space:nowrap;font-family:var(--font);line-height:1}
.btn:active{transform:scale(.97)}
.btn-g{background:var(--gold);color:#000}.btn-g:hover{background:var(--gold2)}
.btn-b{background:var(--blue);color:#fff}.btn-b:hover{filter:brightness(1.15)}
.btn-p{background:var(--purple);color:#fff}.btn-p:hover{filter:brightness(1.15)}
.btn-gh{background:var(--s3);border:1px solid var(--border);color:var(--muted2)}.btn-gh:hover{border-color:var(--border2);color:var(--text)}
.btn-d{background:var(--redl);border:1px solid #ef444444;color:#fca5a5}.btn-d:hover{background:#ef444430}
.btn-sm{padding:4px 9px;font-size:11.5px}
.frow{display:grid;gap:11px;margin-bottom:11px}
.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:1fr 1fr 1fr}.c4{grid-template-columns:1fr 1fr 1fr 1fr}
label{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:3px}
input,select,textarea{width:100%;padding:7px 10px;background:var(--bg);border:1px solid var(--border2);border-radius:7px;color:var(--text);font-size:13px;outline:none;transition:border-color .15s;font-family:var(--font)}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 2px #e8a00018}
.fb input:focus,.fb select:focus{border-color:var(--blue);box-shadow:0 0 0 2px #3b82f618}
.fp input:focus,.fp select:focus{border-color:var(--purple);box-shadow:0 0 0 2px #a855f718}
select option{background:var(--s1)}
textarea{resize:vertical;min-height:60px}
.herr{font-size:11px;color:#fca5a5;margin-top:2px}
.overlay{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:500;padding:20px}
.modal{background:var(--s2);border:1px solid var(--border2);border-radius:12px;padding:22px;width:600px;max-width:96vw;max-height:90vh;overflow-y:auto;animation:fu .18s}
.mtitle{font-family:var(--disp);font-size:19px;letter-spacing:.5px;margin-bottom:16px;color:var(--gold)}
.mtitle.b{color:var(--blue)}.mtitle.p{color:var(--purple)}
.mfoot{display:flex;gap:7px;justify-content:flex-end;margin-top:16px;padding-top:13px;border-top:1px solid var(--border)}
.shdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;gap:10px;flex-wrap:wrap}
.stitle{font-family:var(--disp);font-size:16px;letter-spacing:.5px}
.toast-wrap{position:fixed;bottom:18px;right:18px;z-index:9999;display:flex;flex-direction:column;gap:7px;pointer-events:none}
.toast{background:var(--s2);border:1px solid var(--border2);border-radius:8px;padding:9px 15px;font-size:12.5px;color:var(--text);display:flex;align-items:center;gap:7px;pointer-events:all;max-width:300px;animation:si .2s ease}
.toast.ok{border-left:3px solid var(--green)}.toast.err{border-left:3px solid var(--red);color:#fca5a5}
.toast.info{border-left:3px solid var(--blue);color:#93c5fd}.toast.warn{border-left:3px solid var(--amber);color:#fcd34d}
.toast-fade{opacity:0;transition:opacity .2s}
.infobox{background:var(--s3);border:1px solid var(--border2);border-radius:7px;padding:12px 14px;margin-bottom:12px;font-size:12.5px}
.empty{text-align:center;padding:36px 20px;color:var(--muted)}
.empty .ei{font-size:32px;margin-bottom:8px}.empty p{font-size:13px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;color:#000;flex-shrink:0;font-family:var(--disp)}
/* COVER */
.cover{height:100vh;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden}
.cgrid{position:absolute;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:44px 44px;opacity:.18;pointer-events:none}
.cglow{position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(#e8a00012,transparent 65%);top:50%;left:50%;transform:translate(-50%,-50%)}
.cinner{position:relative;z-index:1;text-align:center;max-width:900px;width:100%;animation:fu .4s}
.ceye{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:4px;margin-bottom:14px;font-weight:600}
.ctit{font-family:var(--disp);font-size:clamp(44px,7vw,80px);letter-spacing:2px;line-height:.92;margin-bottom:10px}
.ctit span{color:var(--gold)}
.csub{font-size:14px;color:var(--muted2);margin:0 auto 44px;line-height:1.7;max-width:380px}
.ccards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;width:100%}
.ccard{background:var(--s1);border:1px solid var(--border);border-radius:13px;padding:24px 22px;cursor:pointer;transition:all .22s;text-align:left}
.ccard.cg:hover{border-color:#e8a00060;transform:translateY(-4px)}
.ccard.cb:hover{border-color:#3b82f660;transform:translateY(-4px)}
.ccard.cp:hover{border-color:#a855f760;transform:translateY(-4px)}
.ccard-ico{font-size:34px;margin-bottom:12px}
.ccard-name{font-family:var(--disp);font-size:24px;letter-spacing:1px;margin-bottom:5px}
.ccard-name.g{color:var(--gold)}.ccard-name.b{color:var(--blue)}.ccard-name.p{color:var(--purple)}
.ccard-desc{font-size:12.5px;color:var(--muted2);line-height:1.7;margin-bottom:14px}
.ctags{display:flex;flex-wrap:wrap;gap:5px}
.ctag{padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;border:1px solid}
.ctag.g{background:var(--goldl);color:var(--gold2);border-color:#e8a00044}
.ctag.b{background:var(--bluel);color:#93c5fd;border-color:#3b82f644}
.ctag.p{background:var(--purplel);color:#d8b4fe;border-color:#a855f744}
/* BIBLIOTECA */
.lib-wrap{display:flex;height:calc(100vh - 97px);overflow:hidden}
.lib-tree{width:260px;min-width:260px;border-right:1px solid var(--border);overflow-y:auto;padding:12px 0;flex-shrink:0}
.lib-main{flex:1;overflow-y:auto;padding:20px 22px}
.tree-item{display:flex;align-items:center;gap:6px;padding:7px 14px 7px 0;font-size:13px;cursor:pointer;border-radius:6px;transition:background .1s;user-select:none}
.tree-item:hover{background:var(--s2)}.tree-item.selected{background:var(--purplel);color:var(--purple)}
.tree-item .toggle{width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;color:var(--muted);transition:transform .15s}
.tree-item .toggle.open{transform:rotate(90deg)}
.tree-item .ico{font-size:15px;flex-shrink:0}.tree-item .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-item .cnt{font-size:10px;color:var(--muted);flex-shrink:0}
.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.file-card{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;transition:all .15s}
.file-card:hover{border-color:var(--purple);transform:translateY(-2px)}
.file-ico{font-size:38px;margin-bottom:8px;text-align:center}
.file-name{font-size:12px;font-weight:600;word-break:break-word;line-height:1.4;text-align:center;margin-bottom:4px}
.file-meta{font-size:10px;color:var(--muted);text-align:center}
.file-actions{display:flex;gap:4px;justify-content:center;margin-top:9px}
.breadcrumb{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted2);margin-bottom:16px;flex-wrap:wrap}
.breadcrumb span{cursor:pointer}.breadcrumb span:hover{color:var(--purple)}
.breadcrumb span.cur{color:var(--text);font-weight:600;cursor:default}.breadcrumb .sep{color:var(--muted)}
.drop-zone{border:2px dashed var(--border2);border-radius:10px;padding:28px;text-align:center;transition:all .2s;cursor:pointer;margin-bottom:14px}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--purple);background:var(--purplel)}
.drop-zone .dz-ico{font-size:28px;margin-bottom:7px}.drop-zone p{font-size:12.5px;color:var(--muted2)}
.ctx-menu{position:fixed;background:var(--s2);border:1px solid var(--border2);border-radius:8px;padding:5px;z-index:600;min-width:160px;box-shadow:0 8px 24px #0006;animation:fu .12s}
.ctx-item{padding:7px 12px;font-size:12.5px;border-radius:5px;cursor:pointer;display:flex;align-items:center;gap:7px;color:var(--text)}
.ctx-item:hover{background:var(--s3)}.ctx-item.danger{color:#fca5a5}.ctx-item.danger:hover{background:var(--redl)}
.ctx-sep{height:1px;background:var(--border);margin:4px 0}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes si{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
@media(max-width:820px){.k4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}.ccards{grid-template-columns:1fr}}
</style>
<!-- Firebase SDK oficial -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>
<div id="root"></div>
<div class="toast-wrap" id="toasts"></div>
<script>
// ═══════ FIREBASE SDK OFICIAL ═══════
const firebaseConfig={
  apiKey:"AIzaSyDylbEPtXs35nw9r2Q1n8lSou5r8u2c_WA",
  authDomain:"pcm-gest.firebaseapp.com",
  projectId:"pcm-gest",
  storageBucket:"pcm-gest.firebasestorage.app",
  messagingSenderId:"173070863997",
  appId:"1:173070863997:web:eb5cdab8a2342e2519ab14"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ═══════ FIREBASE HELPER ═══════
const FB={
  col(k){ return db.collection(k); },

  async getAll(k){
    try{
      const snap = await db.collection(k).get();
      return snap.docs.map(d=>({id:d.id,...d.data()}));
    }catch(e){ console.error('FB.getAll',k,e); return []; }
  },

  async set(k, id, obj){
    try{
      await db.collection(k).doc(id).set(obj, {merge:true});
    }catch(e){ console.error('FB.set',k,id,e); }
  },

  async delete(k, id){
    try{
      await db.collection(k).doc(id).delete();
    }catch(e){ console.error('FB.delete',k,id,e); }
  }
};

// ═══════ LOCAL CACHE ═══════
const KEYS={tools:'gi_tools',mechs:'gi_mechs',loans:'gi_loans',machines:'gi_machines',batteries:'gi_batteries',batHist:'gi_bathist',libTree:'gi_libtree'};
const LOCAL={
  get(k){try{return JSON.parse(localStorage.getItem(KEYS[k])||'[]')}catch(e){return[]}},
  set(k,v){try{localStorage.setItem(KEYS[k],JSON.stringify(v))}catch(e){}},
  upsert(k,obj){const a=LOCAL.get(k);const i=a.findIndex(x=>x.id===obj.id);if(i>=0)a[i]={...a[i],...obj};else a.push(obj);LOCAL.set(k,a)},
  remove(k,id){LOCAL.set(k,LOCAL.get(k).filter(x=>x.id!==id))},
  find(k,id){return LOCAL.get(k).find(x=>x.id===id)||null}
};

// ═══════ DB ═══════
const DB={
  get(k){
    const all=LOCAL.get(k);
    if(!APP.unidade) return all;
    return all.filter(x=>!x.unidade||x.unidade===APP.unidade);
  },
  find(k,id){return this.get(k).find(x=>x.id===id)||null},
  async add(k,obj){
    const withU={...obj, unidade: APP.unidade||'geral'};
    LOCAL.upsert(k, withU);
    FB.set(k, withU.id, withU);
    return withU;
  },
  async update(k,id,data){
    const e=LOCAL.find(k,id)||{};
    const u={...e,...data,id,unidade:APP.unidade||'geral'};
    LOCAL.upsert(k,u);FB.set(k,id,u);return u;
  },
  async remove(k,id){LOCAL.remove(k,id);FB.delete(k,id)},
  async syncAll(){
    const tables=['tools','mechs','loans','machines','batteries','batHist','libTree'];
    let total=0;
    await Promise.all(tables.map(async t=>{
      const docs=await FB.getAll(t);
      if(docs.length>0){LOCAL.set(t,docs);total+=docs.length;}
    }));
    return total;
  }
};

// ═══════ HELPERS ═══════
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)}
function fmt(v){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0)}
function fmtD(s){return s?new Date(s).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'—'}
function fmtDate(s){return s?new Date(s).toLocaleDateString('pt-BR'):'—'}
function fmtSize(b){if(!b)return'—';if(b<1024)return b+'B';if(b<1048576)return(b/1024).toFixed(1)+'KB';return(b/1048576).toFixed(1)+'MB'}
function nowDT(){return new Date().toISOString().slice(0,16)}
function daysLeft(d){return d?Math.floor((new Date(d)-new Date())/86400000):null}
function daysAgo(d){return Math.floor((new Date()-new Date(d))/86400000)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fileIcon(ext){const m={pdf:'📄',xlsx:'📊',xls:'📊',docx:'📝',doc:'📝',pptx:'📋',ppt:'📋',txt:'📃',csv:'📊',zip:'🗜',jpg:'🖼',jpeg:'🖼',png:'🖼'};return m[ext?.toLowerCase()]||'📎'}
function fileType(ext){const m={pdf:'PDF',xlsx:'Excel',xls:'Excel',docx:'Word',doc:'Word',pptx:'PPT',csv:'CSV',txt:'Texto'};return m[ext?.toLowerCase()]||ext?.toUpperCase()||'Arquivo'}
function wBadge(w){const d=daysLeft(w);if(d===null)return`<span class="bdg neu">Sem garantia</span>`;if(d<0)return`<span class="bdg err">⚠ Venc. há ${Math.abs(d)}d</span>`;if(d<60)return`<span class="bdg amr">⏳ ${d}d</span>`;if(d<180)return`<span class="bdg warn">✓ ${d}d</span>`;return`<span class="bdg ok">✓ Válida</span>`}

// ═══════ TOAST & MODAL ═══════
function toast(msg,type='ok'){const c=document.getElementById('toasts');const t=document.createElement('div');t.className='toast '+type;t.innerHTML=`<span>${{ok:'✓',err:'✕',info:'ℹ',warn:'⚠'}[type]||'•'}</span><span>${esc(msg)}</span>`;c.appendChild(t);setTimeout(()=>{t.classList.add('toast-fade');setTimeout(()=>t.remove(),220)},3200)}
function openModal(html){closeModal();const d=document.createElement('div');d.id='modal-overlay';d.className='overlay';d.innerHTML=html;d.addEventListener('click',e=>{if(e.target===d)closeModal()});document.body.appendChild(d)}
function closeModal(){document.getElementById('modal-overlay')?.remove()}
function qid(id){return document.getElementById(id)}
function qval(id){const el=qid(id);return el?el.value.trim():''}
function qfloat(id){return parseFloat(qval(id))||0}

// ═══════ UNIDADES ═══════
const UNIDADES = ['Tunica','Santo André II','Caregi','Reata','Sulinense'];

// ═══════ APP STATE ═══════
let APP={module:null,page:'dash',toolSearch:'',toolFilter:'todos',batSearch:'',libSelected:null,libOpenFolders:{},libSearchQ:'',unidade:localStorage.getItem('gi_unidade')||null};

function render(){document.getElementById('root').innerHTML=buildApp();bindEvents()}
function bindEvents(){document.onkeydown=e=>{if(e.key==='Escape'){closeModal();document.getElementById('lib-ctx')?.remove()}}}

function buildApp(){
  if(!APP.unidade) return buildUnidadeSelect();
  if(!APP.module)return buildCover();
  if(APP.module==='tools')return buildToolsShell();
  if(APP.module==='battery')return buildBatShell();
  if(APP.module==='library')return buildLibShell();
  return'';
}

// ═══════ SELEÇÃO DE UNIDADE ═══════
function buildUnidadeSelect(){
  return`<div class="cover">
  <div class="cgrid"></div><div class="cglow"></div>
  <div class="cinner" style="max-width:560px">
    <div class="ceye">Sistema de Gestão de Manutenção Agrícola</div>
    <div class="ctit">PCM<br/><span>GEST</span></div>
    <p class="csub">Selecione sua unidade para continuar.</p>
    <div style="display:flex;flex-direction:column;gap:10px;width:100%">
      ${UNIDADES.map(u=>`
      <div onclick="selecionarUnidade('${esc(u)}')" style="background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:18px 22px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:all .2s" onmouseover="this.style.borderColor='var(--gold)';this.style.transform='translateY(-2px)'" onmouseout="this.style.borderColor='var(--border)';this.style.transform='none'">
        <div style="display:flex;align-items:center;gap:12px">
          <span style="font-size:28px">🏭</span>
          <div><div style="font-family:var(--disp);font-size:20px;letter-spacing:1px;color:var(--gold)">${esc(u)}</div>
          <div style="font-size:11px;color:var(--muted)">Unidade · PCM Gest</div></div>
        </div>
        <span style="color:var(--muted2);font-size:18px">→</span>
      </div>`).join('')}
    </div>
  </div>
</div>`;
}

function selecionarUnidade(u){
  APP.unidade=u;
  localStorage.setItem('gi_unidade',u);
  render();
}

// ═══════ COVER ═══════
function buildCover(){
  return`<div class="cover">
  <div class="cgrid"></div><div class="cglow"></div>
  <div class="cinner">
    <div class="ceye">🏭 ${esc(APP.unidade)} · Sistema de Gestão de Manutenção Agrícola</div>
    <div class="ctit">PCM<br/><span>GEST</span></div>
    <p class="csub">Selecione o módulo para acessar o sistema.</p>
    <div class="ccards">
      <div class="ccard cg" onclick="APP.module='tools';APP.page='dash';render()">
        <div class="ccard-ico">🔧</div><div class="ccard-name g">FERRAMENTARIA</div>
        <p class="ccard-desc">Ferramentas, mecânicos, empréstimos e termos de responsabilidade.</p>
        <div class="ctags"><span class="ctag g">Ferramentas</span><span class="ctag g">Mecânicos</span><span class="ctag g">Termos PDF</span></div>
      </div>
      <div class="ccard cb" onclick="APP.module='battery';APP.page='dash';render()">
        <div class="ccard-ico">🔋</div><div class="ccard-name b">BATERIAS</div>
        <p class="ccard-desc">Máquinas, baterias, alocações e controle de garantias.</p>
        <div class="ctags"><span class="ctag b">Máquinas</span><span class="ctag b">Baterias</span><span class="ctag b">Garantias</span></div>
      </div>
      <div class="ccard cp" onclick="APP.module='library';APP.page='files';render()">
        <div class="ccard-ico">📚</div><div class="ccard-name p">BIBLIOTECA</div>
        <p class="ccard-desc">Pastas, subpastas e arquivos Excel, PDF, Word organizados.</p>
        <div class="ctags"><span class="ctag p">Pastas</span><span class="ctag p">PDF</span><span class="ctag p">Excel</span><span class="ctag p">Word</span></div>
      </div>
    </div>
    <div style="margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <button class="btn btn-gh" onclick="openRelatorioModal()">📊 Relatórios PDF</button>
      <button class="btn btn-gh" onclick="trocarUnidade()">🏭 Trocar Unidade</button>
    </div>
  </div>
</div>`}

function trocarUnidade(){
  APP.unidade=null;APP.module=null;
  localStorage.removeItem('gi_unidade');
  render();
}

// ═══════ FERRAMENTARIA ═══════
function buildToolsShell(){
  const tools=DB.get('tools'),mechs=DB.get('mechs'),loans=DB.get('loans');
  const active=loans.filter(l=>!l.returnDate);
  const disp=tools.filter(t=>t.status==='disponivel').length;
  const old=active.filter(l=>daysAgo(l.loanDate)>5);
  const pages=[{id:'dash',ico:'📊',lbl:'Dashboard',sec:'Principal'},{id:'tools',ico:'🔧',lbl:'Ferramentas',sec:null,pill:disp,pillc:'g'},{id:'mechs',ico:'👷',lbl:'Mecânicos',sec:null,pill:mechs.length,pillc:'b'},{id:'loans',ico:'📋',lbl:'Empréstimos Ativos',sec:'Movimentação',pill:active.length||'',pillc:active.length?'r':'g'},{id:'hist',ico:'📁',lbl:'Histórico',sec:null},{id:'reports',ico:'📈',lbl:'Relatórios',sec:'Análise'}];
  let pc='';
  if(APP.page==='dash')pc=buildToolsDash(tools,mechs,loans,active);
  else if(APP.page==='tools')pc=buildToolsList(tools);
  else if(APP.page==='mechs')pc=buildMechsList(mechs,tools,active);
  else if(APP.page==='loans')pc=buildLoansList(loans,tools,mechs,true);
  else if(APP.page==='hist')pc=buildLoansList(loans,tools,mechs,false);
  else if(APP.page==='reports')pc=buildToolsReports();
  return`<div class="shell">
  <div class="sidebar">
    <div class="sb-hdr"><div class="sb-name">⚙ FERRAMENTARIA</div><div class="sb-sub">${esc(APP.unidade)}</div><span class="sb-bdg g">ATIVO</span></div>
    ${pages.map(p=>`${p.sec?`<div class="sb-sec">${p.sec}</div>`:''}<div class="sb-item ${APP.page===p.id?'act':''}" onclick="APP.page='${p.id}';render()"><span>${p.ico}</span><span style="flex:1">${p.lbl}</span>${p.pill?`<span class="pill ${p.pillc}">${p.pill}</span>`:''}</div>`).join('')}
    <div class="sb-foot">
      <div class="sb-item" onclick="openRelatorioModal()" style="border-radius:6px"><span>📊</span><span>Relatórios PDF</span></div>
      <div class="sb-item" onclick="APP.module=null;render()" style="border-radius:6px"><span>←</span><span>Menu Principal</span></div>
      <div class="sb-item" onclick="trocarUnidade()" style="border-radius:6px;margin-top:4px"><span>🏭</span><span style="font-size:11px">Trocar Unidade</span></div>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <div><div class="tb-title">${pages.find(p=>p.id===APP.page)?.ico} ${pages.find(p=>p.id===APP.page)?.lbl}</div>
      <div class="tb-sub">🏭 ${esc(APP.unidade)} · ${tools.length} ferramentas · ${mechs.length} mecânicos · ${active.length} ativos${old.length?` · <span style="color:var(--red)">${old.length} vencidos</span>`:''}</div></div>
      <span style="font-size:12px;color:var(--muted2)">Acervo: <strong style="color:var(--gold)">${fmt(tools.reduce((s,t)=>s+(t.value||0),0))}</strong></span>
    </div>
    <div class="content">${pc}</div>
  </div>
</div>`}

function buildToolsDash(tools,mechs,loans,active){
  const lentVal=tools.filter(t=>t.status==='emprestada').reduce((s,t)=>s+(t.value||0),0);
  const old=active.filter(l=>daysAgo(l.loanDate)>5);
  const cats=[...new Set(tools.map(t=>t.category).filter(Boolean))];
  return`<div class="kgrid k4">
    <div class="kpi"><div class="kbar" style="background:var(--gold)"></div><div class="klbl">Ferramentas</div><div class="kval">${tools.length}</div><div class="ksub">${tools.filter(t=>t.status==='disponivel').length} disponíveis</div></div>
    <div class="kpi"><div class="kbar" style="background:var(--blue)"></div><div class="klbl">Emp. Ativos</div><div class="kval">${active.length}</div></div>
    <div class="kpi"><div class="kbar" style="background:var(--green)"></div><div class="klbl">Valor Acervo</div><div class="kval sm">${fmt(tools.reduce((s,t)=>s+(t.value||0),0))}</div><div class="ksub">${fmt(lentVal)} emprestado</div></div>
    <div class="kpi"><div class="kbar" style="background:var(--red)"></div><div class="klbl">Emp. &gt;5 dias</div><div class="kval" style="${old.length?'color:var(--red)':''}">${old.length}</div></div>
  </div>
  <div class="g2">
    <div class="card"><div class="ctitle">📋 Empréstimos Ativos</div>
    ${active.length===0?`<div class="empty"><div class="ei">✅</div><p>Nenhum empréstimo ativo</p></div>`:`<div class="tw"><table><thead><tr><th>Ferramenta</th><th>Mecânico</th><th>Dias</th></tr></thead><tbody>
    ${active.slice(0,8).map(l=>{const t=tools.find(x=>x.id===l.toolId),m=mechs.find(x=>x.id===l.mechId),d=daysAgo(l.loanDate);return`<tr><td><strong>${esc(t?.name||'?')}</strong></td><td>${esc(m?.name||'?')}</td><td><span class="bdg ${d>7?'err':d>3?'amr':'ok'}">${d}d</span></td></tr>`}).join('')}</tbody></table></div>`}
    </div>
    <div class="card"><div class="ctitle">👷 Valor em Posse</div>
    <div class="tw"><table><thead><tr><th>Mecânico</th><th>Itens</th><th>Valor</th></tr></thead><tbody>
    ${mechs.map(m=>{const ml=active.filter(l=>l.mechId===m.id);const v=ml.reduce((s,l)=>s+(tools.find(t=>t.id===l.toolId)?.value||0),0);return`<tr><td><strong>${esc(m.name)}</strong></td><td><span class="bdg info">${ml.length}</span></td><td style="color:var(--gold);font-weight:600">${fmt(v)}</td></tr>`}).join('')}</tbody></table></div>
    </div>
    <div class="card"><div class="ctitle">📦 Por Categoria</div>
    <div class="tw"><table><thead><tr><th>Categoria</th><th>Total</th><th>Disp.</th><th>Emp.</th></tr></thead><tbody>
    ${cats.map(c=>{const ct=tools.filter(t=>t.category===c);return`<tr><td><strong>${esc(c)}</strong></td><td>${ct.length}</td><td><span class="bdg ok">${ct.filter(t=>t.status==='disponivel').length}</span></td><td><span class="bdg warn">${ct.filter(t=>t.status==='emprestada').length}</span></td></tr>`}).join('')}</tbody></table></div>
    </div>
    <div class="card"><div class="ctitle">💰 Resumo</div>
    ${[{l:'Total acervo',v:tools.reduce((s,t)=>s+(t.value||0),0),c:'var(--text)'},{l:'Disponível',v:tools.filter(t=>t.status==='disponivel').reduce((s,t)=>s+(t.value||0),0),c:'var(--green)'},{l:'Emprestado',v:lentVal,c:'var(--gold)'}].map(r=>`<div style="display:flex;justify-content:space-between;padding:8px 11px;background:var(--s3);border-radius:6px;margin-bottom:7px"><span style="font-size:12px;color:var(--muted2)">${r.l}</span><strong style="color:${r.c}">${fmt(r.v)}</strong></div>`).join('')}
    </div>
  </div>`}

function buildToolsList(tools){
  const q=APP.toolSearch||'',f=APP.toolFilter||'todos';
  const filtered=tools.filter(t=>(f==='todos'||t.status===f)&&[t.name,t.category,t.serial,t.desc].some(s=>(s||'').toLowerCase().includes(q.toLowerCase())));
  return`<div class="shdr">
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <input id="tsearch" value="${esc(q)}" placeholder="Buscar..." style="width:220px" oninput="APP.toolSearch=this.value;render()"/>
      <select onchange="APP.toolFilter=this.value;render()">
        <option value="todos" ${f==='todos'?'selected':''}>Todos</option>
        <option value="disponivel" ${f==='disponivel'?'selected':''}>Disponíveis</option>
        <option value="emprestada" ${f==='emprestada'?'selected':''}>Emprestadas</option>
      </select>
    </div>
    <button class="btn btn-g" onclick="openToolModal()">+ Nova Ferramenta</button>
  </div>
  <div class="card"><div class="tw"><table>
    <thead><tr><th>Ferramenta</th><th>Categoria</th><th>Valor</th><th>Série</th><th>Local</th><th>Status</th><th>Ações</th></tr></thead>
    <tbody>
    ${filtered.length===0?`<tr><td colspan="7"><div class="empty"><div class="ei">🔧</div><p>Nenhuma encontrada</p></div></td></tr>`:''}
    ${filtered.map(t=>`<tr>
      <td><strong>${esc(t.name)}</strong><div style="font-size:11px;color:var(--muted2)">${esc(t.desc||'')}</div></td>
      <td><span class="bdg neu">${esc(t.category||'—')}</span></td>
      <td style="color:var(--gold);font-weight:600">${fmt(t.value)}</td>
      <td style="font-family:var(--mono);font-size:11px;color:var(--muted2)">${esc(t.serial||'—')}</td>
      <td style="font-size:11px;color:var(--muted2)">${esc(t.location||'—')}</td>
      <td>${t.status==='disponivel'?`<span class="bdg ok">✓ Disponível</span>`:`<span class="bdg warn">↗ Emprestada</span>`}</td>
      <td><div style="display:flex;gap:4px"><button class="btn btn-gh btn-sm" onclick="openToolModal('${t.id}')">✏</button><button class="btn btn-d btn-sm" onclick="delTool('${t.id}')">✕</button></div></td>
    </tr>`).join('')}
    </tbody></table></div></div>`}

function buildMechsList(mechs,tools,active){
  return`<div class="shdr"><div class="stitle">Mecânicos (${mechs.length})</div><button class="btn btn-g" onclick="openMechModal()">+ Novo Mecânico</button></div>
  <div class="g3">${mechs.map(m=>{const ml=active.filter(l=>l.mechId===m.id);const v=ml.reduce((s,l)=>s+(tools.find(t=>t.id===l.toolId)?.value||0),0);return`<div class="card" style="cursor:pointer;margin-bottom:0" onclick="openMechDetail('${m.id}')">
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:11px"><div class="avatar">${esc(m.name[0])}</div>
    <div><div style="font-weight:700;font-size:14px">${esc(m.name)}</div><div style="font-size:11px;color:var(--muted2)">Mat. ${esc(m.mat)}</div></div></div>
    <div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--border)">
      <div><div style="font-size:10px;color:var(--muted);margin-bottom:3px">Em posse</div><span class="bdg warn">${ml.length} itens</span></div>
      <div style="text-align:right"><div style="font-size:10px;color:var(--muted);margin-bottom:3px">Valor</div><span style="color:var(--gold);font-weight:700">${fmt(v)}</span></div>
    </div>
    <div style="display:flex;gap:6px;margin-top:10px" onclick="event.stopPropagation()">
      <button class="btn btn-gh btn-sm" style="flex:1" onclick="openMechModal('${m.id}')">✏ Editar</button>
      <button class="btn btn-d btn-sm" onclick="delMech('${m.id}')">✕</button>
    </div>
  </div>`}).join('')}</div>`}

function buildLoansList(loans,tools,mechs,onlyActive){
  const list=onlyActive?[...loans.filter(l=>!l.returnDate)]:[...loans.filter(l=>l.returnDate)];
  list.sort((a,b)=>new Date(b.loanDate)-new Date(a.loanDate));
  return`<div class="shdr">
    <div style="font-size:13px;color:var(--muted2)">${list.length} ${onlyActive?'empréstimos ativos':'devoluções'}</div>
    <div style="display:flex;gap:7px;flex-wrap:wrap">
      ${onlyActive&&list.length>0?`<button class="btn btn-gh" onclick="openTermoMechModal()">🖨 Termo por Mecânico</button>`:''}
      ${onlyActive?`<button class="btn btn-g" onclick="openLoanModal()">+ Novo Empréstimo</button>`:''}
    </div>
  </div>
  <div class="card"><div class="tw"><table>
    <thead><tr><th>Ferramenta</th><th>Mecânico</th><th>Valor</th><th>Data</th><th>${onlyActive?'Dias':'Devolvido'}</th><th>Obs.</th><th>Ações</th></tr></thead>
    <tbody>
    ${list.length===0?`<tr><td colspan="7"><div class="empty"><div class="ei">${onlyActive?'✅':'📁'}</div><p>${onlyActive?'Nenhum ativo.':'Nenhuma devolução.'}</p></div></td></tr>`:''}
    ${list.map(l=>{const t=tools.find(x=>x.id===l.toolId),m=mechs.find(x=>x.id===l.mechId),d=daysAgo(l.loanDate);return`<tr>
      <td><strong>${esc(t?.name||'?')}</strong></td>
      <td><strong>${esc(m?.name||'?')}</strong><div style="font-size:10px;color:var(--muted2)">Mat. ${esc(m?.mat||'—')}</div></td>
      <td style="color:var(--gold);font-weight:600">${fmt(t?.value)}</td>
      <td style="font-size:11px;color:var(--muted2)">${fmtD(l.loanDate)}</td>
      <td>${onlyActive?`<span class="bdg ${d>7?'err':d>3?'amr':'ok'}">${d}d</span>`:`<span style="font-size:11px">${fmtD(l.returnDate)}</span>`}</td>
      <td style="font-size:11px;color:var(--muted2)">${esc(l.note||'—')}</td>
      <td><div style="display:flex;gap:4px;flex-wrap:wrap">
        <button class="btn btn-gh btn-sm" onclick="printTermo('${l.id}')">🖨 Termo</button>
        ${onlyActive?`<button class="btn btn-g btn-sm" onclick="openReturnModal('${l.id}')">↩ Devolver</button>`:''}
      </div></td>
    </tr>`}).join('')}
    </tbody></table></div></div>`}

function buildToolsReports(){
  return`<div class="shdr"><div class="stitle">Relatórios PDF</div><button class="btn btn-g" onclick="openRelatorioModal()">📊 Gerar Relatório</button></div>
  <div class="g2">${[{t:'Inventário',s:'Lista completa',fn:'relTools',ico:'🔧'},{t:'Empréstimos',s:'Ativos',fn:'relLoans',ico:'📋'},{t:'Por Mecânico',s:'Responsabilidade',fn:'relMechs',ico:'👷'},{t:'Completo',s:'Todos os módulos',fn:'relAll',ico:'📦'}].map(r=>`<div class="card" style="cursor:pointer" onclick="${r.fn}()"><div style="font-size:28px;margin-bottom:8px">${r.ico}</div><div style="font-weight:700;margin-bottom:4px">${r.t}</div><div style="font-size:12px;color:var(--muted2)">${r.s}</div></div>`).join('')}</div>`}

// ═══════ BATTERY SHELL ═══════
function buildBatShell(){
  const machines=DB.get('machines'),batteries=DB.get('batteries'),batHist=DB.get('batHist');
  const inUse=batteries.filter(b=>b.machineId);
  const exp=batteries.filter(b=>b.warranty&&daysLeft(b.warranty)<0);
  const soon=batteries.filter(b=>{const d=daysLeft(b.warranty);return d!==null&&d>=0&&d<90});
  const pages=[{id:'dash',ico:'📊',lbl:'Dashboard',sec:'Principal'},{id:'machines',ico:'🚜',lbl:'Máquinas',sec:null,pill:machines.length,pillc:'b'},{id:'batteries',ico:'🔋',lbl:'Baterias',sec:null,pill:batteries.length,pillc:'b'},{id:'alloc',ico:'🔄',lbl:'Alocação',sec:'Operação',pill:inUse.length,pillc:'b'},{id:'warranty',ico:'🛡',lbl:'Garantias',sec:null,pill:(exp.length+soon.length)||'',pillc:exp.length?'r':'amr'},{id:'reports',ico:'📈',lbl:'Relatórios',sec:'Análise'}];
  let pc='';
  if(APP.page==='dash')pc=buildBatDash(machines,batteries);
  else if(APP.page==='machines')pc=buildMachinesList(machines,batteries);
  else if(APP.page==='batteries')pc=buildBatteriesList(batteries,machines);
  else if(APP.page==='alloc')pc=buildAllocPage(batteries,machines,batHist);
  else if(APP.page==='warranty')pc=buildWarrantyPage(batteries,machines);
  else if(APP.page==='reports')pc=`<div class="shdr"><div class="stitle">Relatórios PDF</div><button class="btn btn-b" onclick="openRelatorioModal()">📊 Gerar</button></div><div class="g2">${[{t:'Baterias',fn:'relBat',ico:'🔋'},{t:'Garantias',fn:'relWarranty',ico:'🛡'}].map(r=>`<div class="card" style="cursor:pointer" onclick="${r.fn}()"><div style="font-size:28px;margin-bottom:8px">${r.ico}</div><div style="font-weight:700">${r.t}</div></div>`).join('')}</div>`;
  return`<div class="shell">
  <div class="sidebar">
    <div class="sb-hdr"><div class="sb-name">🔋 BATERIAS</div><div class="sb-sub">${esc(APP.unidade)}</div><span class="sb-bdg b">ATIVO</span></div>
    ${pages.map(p=>`${p.sec?`<div class="sb-sec">${p.sec}</div>`:''}<div class="sb-item ${APP.page===p.id?'act-b':''}" onclick="APP.page='${p.id}';render()"><span>${p.ico}</span><span style="flex:1">${p.lbl}</span>${p.pill?`<span class="pill ${p.pillc}">${p.pill}</span>`:''}</div>`).join('')}
    <div class="sb-foot">
      <div class="sb-item" onclick="openRelatorioModal()" style="border-radius:6px"><span>📊</span><span>Relatórios PDF</span></div>
      <div class="sb-item" onclick="APP.module=null;render()" style="border-radius:6px"><span>←</span><span>Menu Principal</span></div>
      <div class="sb-item" onclick="trocarUnidade()" style="border-radius:6px;margin-top:4px"><span>🏭</span><span style="font-size:11px">Trocar Unidade</span></div>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <div><div class="tb-title" style="color:var(--blue)">${pages.find(p=>p.id===APP.page)?.ico} ${pages.find(p=>p.id===APP.page)?.lbl}</div>
      <div class="tb-sub">🏭 ${esc(APP.unidade)} · ${machines.length} máquinas · ${batteries.length} baterias · ${inUse.length} alocadas</div></div>
      <div style="display:flex;gap:8px;align-items:center">${exp.length?`<span class="bdg err">⚠ ${exp.length} vencidas</span>`:''}</div>
    </div>
    <div class="content">${pc}</div>
  </div>
</div>`}

function buildBatDash(machines,batteries){

// ═══════ BIBLIOTECA SHELL ═══════

  else if(APP.page==='recent')pc=buildLibRecent();
  else if(APP.page==='search')pc=buildLibSearch();

  <div class="sidebar">
    <div class="sb-hdr"><div class="sb-name">📚 BIBLIOTECA</div><div class="sb-sub">Documentos</div><span class="sb-bdg p">ATIVO</span></div>

      <div style="display:flex;justify-content:space-between;margin-bottom:5px"><span style="color:var(--muted2)">Pastas</span><strong style="color:var(--purple)">${totalFolders}</strong></div>

    </div></div>

      <div class="sb-item" onclick="openRelatorioModal()" style="border-radius:6px"><span>📊</span><span>Relatórios PDF</span></div>
      <div class="sb-item" onclick="APP.module=null;render()" style="border-radius:6px"><span>←</span><span>Menu Principal</span></div>

      <div><div class="tb-title" style="color:var(--purple)">📚 Biblioteca de Documentos</div>

        <button class="btn btn-p btn-sm" onclick="openUploadModal(${APP.libSelected?`'${APP.libSelected}'`:'null'})">⬆ Upload</button>

function libNodes(){return DB.get('libTree')}
function libPath(nodeId){const nodes=libNodes();const path=[];let cur=nodeId;while(cur){const n=nodes.find(x=>x.id===cur);if(!n)break;path.unshift(n);cur=n.parentId}return path}
function libCountChildren(id){const nodes=libNodes();let c=0;function r(fid){nodes.filter(n=>n.parentId===fid).forEach(n=>{c++;if(n.type==='folder')r(n.id)})}r(id);return c}
function libSelectFolder(id){APP.libSelected=(id===null||id==='null')?null:id;APP.page='files';render()}
function libToggleFolder(id){if(!APP.libOpenFolders)APP.libOpenFolders={};APP.libOpenFolders[id]=!APP.libOpenFolders[id];render()}

function buildLibTree(){
  const nodes=libNodes();
  function renderFolder(parentId,depth){
    return nodes.filter(n=>n.type==='folder'&&n.parentId===(parentId||null)).map(f=>{
      const isOpen=APP.libOpenFolders[f.id],isSel=APP.libSelected===f.id;
      const childFolders=nodes.filter(n=>n.type==='folder'&&n.parentId===f.id).length;
      const total=nodes.filter(n=>n.parentId===f.id).length;
      return`<div>
        <div class="tree-item ${isSel?'selected':''}" style="padding-left:${12+depth*14}px" onclick="libSelectFolder('${f.id}')">
          <span class="toggle ${isOpen?'open':''}" onclick="event.stopPropagation();libToggleFolder('${f.id}')">${childFolders?'▶':''}</span>
          <span class="ico">${isOpen?'📂':'📁'}</span><span class="lbl">${esc(f.name)}</span>
          ${total?`<span class="cnt">${total}</span>`:''}
        </div>
        ${isOpen?`<div>${renderFolder(f.id,depth+1)}</div>`:''}
      </div>`;
    }).join('');
  }
  return`<div class="lib-tree">
    <div class="tree-item ${!APP.libSelected?'selected':''}" style="padding-left:12px" onclick="libSelectFolder(null)">
      <span class="toggle"></span><span class="ico">🏠</span><span class="lbl">Raiz</span>
    </div>${renderFolder(null,0)}
  </div>`}

function buildLibBrowser(){
  const nodes=libNodes(),parentId=APP.libSelected||null;
  const folders=nodes.filter(n=>n.parentId===parentId&&n.type==='folder');
  const files=nodes.filter(n=>n.parentId===parentId&&n.type==='file');
  const path=parentId?libPath(parentId):[];
  return`<div class="breadcrumb"><span onclick="libSelectFolder(null)">🏠 Raiz</span>${path.map((n,i)=>`<span class="sep">/</span><span class="${i===path.length-1?'cur':''}" onclick="libSelectFolder('${n.id}')">${esc(n.name)}</span>`).join('')}</div>
  <div class="shdr" style="margin-bottom:10px">
    <div style="font-size:13px;color:var(--muted2)">${folders.length} pasta${folders.length!==1?'s':''} · ${files.length} arquivo${files.length!==1?'s':''}</div>
    <div style="display:flex;gap:6px">
      <button class="btn btn-gh btn-sm" onclick="openNewFolderModal(${parentId?`'${parentId}'`:'null'})">📁 Nova Pasta</button>
      <button class="btn btn-p btn-sm" onclick="openUploadModal(${parentId?`'${parentId}'`:'null'})">⬆ Upload</button>
    </div>
  </div>
  ${folders.length===0&&files.length===0?`<div class="empty" style="padding:50px"><div class="ei">📂</div><p>Pasta vazia. Crie subpastas ou faça upload.</p></div>`:`
  ${folders.length>0?`<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:8px">Pastas</div>
  <div class="file-grid" style="margin-bottom:18px">
    ${folders.map(f=>{const sub=nodes.filter(n=>n.parentId===f.id).length;return`<div class="file-card" onclick="libSelectFolder('${f.id}')" oncontextmenu="libCtxMenu(event,'${f.id}','folder')">
      <div class="file-ico">📁</div><div class="file-name">${esc(f.name)}</div><div class="file-meta">${sub} item${sub!==1?'s':''}</div>
      <div class="file-actions" onclick="event.stopPropagation()">
        <button class="btn btn-gh btn-sm" onclick="openRenameFolderModal('${f.id}')">✏</button>
        <button class="btn btn-d btn-sm" onclick="libDelFolder('${f.id}')">✕</button>
      </div>
    </div>`}).join('')}
  </div>`:''}
  ${files.length>0?`<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:8px">Arquivos</div>
  <div class="file-grid">
    ${files.map(f=>{const ext=f.name?.split('.').pop();return`<div class="file-card" oncontextmenu="libCtxMenu(event,'${f.id}','file')">
      <div class="file-ico">${fileIcon(ext)}</div><div class="file-name">${esc(f.name)}</div>
      <div class="file-meta"><span class="bdg pur" style="font-size:9px">${fileType(ext)}</span></div>
      <div class="file-meta" style="margin-top:4px">${fmtSize(f.size)} · ${fmtDate(f.uploadedAt)}</div>
      ${f.desc?`<div class="file-meta" style="font-style:italic;margin-top:3px">${esc(f.desc)}</div>`:''}
      <div class="file-actions">
        <button class="btn btn-gh btn-sm" onclick="libDownload('${f.id}')">⬇</button>
        <button class="btn btn-gh btn-sm" onclick="openEditFileModal('${f.id}')">✏</button>
        <button class="btn btn-d btn-sm" onclick="libDelFile('${f.id}')">✕</button>
      </div>
    </div>`}).join('')}
  </div>`:''}
  `}`}

function buildLibRecent(){
  const files=libNodes().filter(n=>n.type==='file').sort((a,b)=>new Date(b.uploadedAt)-new Date(a.uploadedAt)).slice(0,30);
  return`<div class="stitle" style="margin-bottom:14px">🕐 Recentes</div>
  ${files.length===0?`<div class="empty"><div class="ei">📂</div><p>Nenhum arquivo ainda.</p></div>`:`
  <div class="card"><div class="tw"><table><thead><tr><th>Arquivo</th><th>Tipo</th><th>Tamanho</th><th>Data</th><th>Caminho</th><th>Ações</th></tr></thead><tbody>
  ${files.map(f=>{const ext=f.name?.split('.').pop();const path=libPath(f.parentId).map(n=>n.name).join(' / ')||'Raiz';return`<tr>
    <td><span style="font-size:15px;margin-right:6px">${fileIcon(ext)}</span><strong>${esc(f.name)}</strong></td>
    <td><span class="bdg pur">${fileType(ext)}</span></td>
    <td style="font-size:11px;color:var(--muted2)">${fmtSize(f.size)}</td>

      <button class="btn btn-gh btn-sm" onclick="libSelectFolder('${f.parentId||'null'}');APP.page='files';render()">📂 Abrir</button>
    </div></td>
  </tr>`}).join('')}</tbody></table></div></div>`}`}

function buildLibSearch(){
  const q=APP.libSearchQ||'';
  const results=q?libNodes().filter(n=>(n.name||'').toLowerCase().includes(q.toLowerCase())):[];
  return`<div class="stitle" style="margin-bottom:14px">🔍 Buscar</div>
  <div style="margin-bottom:14px"><input value="${esc(q)}" placeholder="Nome do arquivo ou pasta..." style="max-width:400px" oninput="APP.libSearchQ=this.value;render()"/></div>
  ${q&&results.length===0?`<div class="empty"><div class="ei">🔍</div><p>Nenhum resultado.</p></div>`:''}
  ${results.length>0?`<div class="card"><div class="tw"><table><thead><tr><th>Nome</th><th>Tipo</th><th>Caminho</th><th>Ações</th></tr></thead><tbody>
  ${results.map(n=>{const ext=n.type==='file'?n.name?.split('.').pop():null;const path=libPath(n.parentId).map(x=>x.name).join(' / ')||'Raiz';return`<tr>
    <td><span style="font-size:14px;margin-right:6px">${n.type==='folder'?'📁':fileIcon(ext)}</span><strong>${esc(n.name)}</strong></td>
    <td><span class="bdg ${n.type==='folder'?'warn':'pur'}">${n.type==='folder'?'Pasta':fileType(ext)}</span></td>
    <td style="font-size:11px;color:var(--muted2)">📁 ${esc(path)}</td>
    <td><button class="btn btn-gh btn-sm" onclick="libSelectFolder('${n.type==='folder'?n.id:n.parentId||'null'}');APP.page='files';render()">📂 Abrir</button></td>
  </tr>`}).join('')}</tbody></table></div></div>`:''}`;
}

function libCtxMenu(e,id,type){
  e.preventDefault();document.getElementById('lib-ctx')?.remove();
  const m=document.createElement('div');m.id='lib-ctx';m.className='ctx-menu';
  m.style.left=e.clientX+'px';m.style.top=e.clientY+'px';
  if(type==='folder'){m.innerHTML=`<div class="ctx-item" onclick="libCtxClose();libSelectFolder('${id}')">📂 Abrir</div><div class="ctx-item" onclick="libCtxClose();openNewFolderModal('${id}')">📁 Nova subpasta</div><div class="ctx-item" onclick="libCtxClose();openUploadModal('${id}')">⬆ Upload aqui</div><div class="ctx-item" onclick="libCtxClose();openRenameFolderModal('${id}')">✏ Renomear</div><div class="ctx-sep"></div><div class="ctx-item danger" onclick="libCtxClose();libDelFolder('${id}')">✕ Excluir</div>`;}
  else{m.innerHTML=`<div class="ctx-item" onclick="libCtxClose();libDownload('${id}')">⬇ Baixar</div><div class="ctx-item" onclick="libCtxClose();openEditFileModal('${id}')">✏ Editar</div><div class="ctx-sep"></div><div class="ctx-item danger" onclick="libCtxClose();libDelFile('${id}')">✕ Excluir</div>`;}
  document.body.appendChild(m);setTimeout(()=>document.addEventListener('click',libCtxClose,{once:true}),10);
}
function libCtxClose(){document.getElementById('lib-ctx')?.remove()}

// ═══════ LIB MODALS ═══════
function openNewFolderModal(parentId){
  const pid=(parentId===null||parentId==='null')?null:parentId;
  const name=pid?libNodes().find(n=>n.id===pid)?.name:null;
  openModal(`<div class="modal fp"><div class="mtitle p">📁 Nova Pasta</div>
    ${name?`<div class="infobox" style="font-size:12px">Dentro de: <strong>📁 ${esc(name)}</strong></div>`:'<div class="infobox" style="font-size:12px">Na <strong>raiz</strong></div>'}
    <div class="frow"><div><label>Nome *</label><input id="fn" placeholder="Ex: Manuais..."/></div></div>
    <div class="mfoot"><button class="btn btn-gh" onclick="closeModal()">Cancelar</button><button class="btn btn-p" onclick="libCreateFolder('${pid||'null'}')">Criar</button></div>
  </div>`);setTimeout(()=>qid('fn')?.focus(),50);
}

async function libCreateFolder(parentId){
  const name=qval('fn');if(!name)return toast('Digite um nome.','err');
  const pid=(parentId===null||parentId==='null')?null:parentId;
  const nodes=libNodes();

  nodes.push(node);LOCAL.set('libTree',nodes);FB.set('libTree',node.id,node);
  if(pid)APP.libOpenFolders[pid]=true;

async function libDelFolder(id){
  const count=libCountChildren(id);
  if(count>0&&!confirm(`Contém ${count} item(ns). Excluir tudo?`))return;
  const nodes=libNodes();const toDelete=[];
  function collect(fid){nodes.filter(n=>n.parentId===fid).forEach(n=>{toDelete.push(n.id);if(n.type==='folder')collect(n.id)});}
  collect(id);toDelete.push(id);
  LOCAL.set('libTree',nodes.filter(n=>!toDelete.includes(n.id)));
  toDelete.forEach(did=>FB.delete('libTree',did));
  if(APP.libSelected===id)APP.libSelected=null;
  toast('Excluída.');render();
}

      <div class="dz-ico">📎</div><p><strong>Clique para selecionar</strong> ou arraste</p>
      <p style="margin-top:5px;font-size:11px;color:var(--muted)">PDF, Excel, Word, imagens...</p>
    </div>

    <div class="frow"><div><label>Descrição (opcional)</label><input id="fdesc"/></div></div>
    <div id="upload-preview"></div>

  </div>`);

function libHandleDrop(e,parentId){e.preventDefault();document.getElementById('dz')?.classList.remove('drag-over');libHandleFiles(e.dataTransfer.files,parentId);}

function libHandleFiles(fileList,parentId){
  const pid=(parentId===null||parentId==='null')?null:parentId;
  const desc=qval('fdesc');let added=0;
  Array.from(fileList).forEach(file=>{
    const reader=new FileReader();
    reader.onload=async e=>{
      const node={id:uid(),name:file.name,type:'file',parentId:pid,size:file.size,uploadedAt:new Date().toISOString(),desc,ext:file.name.split('.').pop().toLowerCase(),data:e.target.result};
      const fresh=libNodes();fresh.push(node);
      try{LOCAL.set('libTree',fresh);FB.set('libTree',node.id,node);added++;
        const prev=document.getElementById('upload-preview');
        if(prev)prev.innerHTML=`<div class="infobox" style="margin-top:8px;font-size:12px;color:var(--green)">✓ ${added} arquivo${added>1?'s':''} adicionado${added>1?'s':''}</div>`;
        toast(`${file.name} adicionado!`);
        if(pid)APP.libOpenFolders[pid]=true;
      }catch(err){toast('Arquivo grande demais.','err');}
    };reader.readAsDataURL(file);
  });
}

function relWarranty(){
  const batteries=DB.get('batteries'),machines=DB.get('machines');
  const sorted=[...batteries].sort((a,b)=>(daysLeft(a.warranty)??9999)-(daysLeft(b.warranty)??9999));
  const exp=batteries.filter(b=>b.warranty&&daysLeft(b.warranty)<0);
  const s90=batteries.filter(b=>{const d=daysLeft(b.warranty);return d!==null&&d>=0&&d<90});
  showRelViewer(`<!DOCTYPE html><html><head><meta charset="UTF-8"/>${relCSS()}</head><body>
${relHeader('RELATÓRIO DE GARANTIAS')}
<div class="kpis k3"><div class="kpi r"><div class="kpi-lbl">Vencidas</div><div class="kpi-val">${exp.length}</div></div><div class="kpi b"><div class="kpi-lbl">Vencem &lt;90 dias</div><div class="kpi-val">${s90.length}</div></div><div class="kpi gr"><div class="kpi-lbl">Válidas</div><div class="kpi-val">${batteries.length-exp.length-s90.length}</div></div></div>
<div class="sec"><div class="sec-ttl">Por Criticidade</div>
<table><thead><tr><th>#</th><th>Código</th><th>Marca/Modelo</th><th>Validade</th><th>Dias</th><th>Status</th><th>Máquina</th></tr></thead>
<tbody>${sorted.map((b,i)=>{const m=machines.find(x=>x.id===b.machineId);const d=daysLeft(b.warranty);return`<tr><td>${i+1}</td><td style="font-family:monospace;font-weight:700">${esc(b.code)}</td><td><strong>${esc(b.brand||'')}</strong> ${esc(b.model||'')}</td><td>${fmtDate(b.warranty)||'—'}</td><td>${d===null?'—':d<0?`<span class="bdg err">Venc. há ${Math.abs(d)}d</span>`:`${d}d`}</td><td>${d===null?`<span class="bdg neu">S/Garantia</span>`:d<0?`<span class="bdg err">Vencida</span>`:d<90?`<span class="bdg warn">A vencer</span>`:`<span class="bdg ok">Válida</span>`}</td><td>${m?esc(m.name):'Estoque'}</td></tr>`;}).join('')}
</tbody></table></div>
<div class="footer">PCM Gest · Garantias · ${new Date().toLocaleString('pt-BR')}</div></body></html>`,'Relatório de Garantias');
}

function relLib(){
  const nodes=DB.get('libTree');
  const files=nodes.filter(n=>n.type==='file');
  function getPath(id){const p=[];let cur=id;while(cur){const n=nodes.find(x=>x.id===cur);if(!n)break;p.unshift(n.name);cur=n.parentId;}return p.join(' / ')||'Raiz';}
  showRelViewer(`<!DOCTYPE html><html><head><meta charset="UTF-8"/>${relCSS()}</head><body>
${relHeader('ÍNDICE DA BIBLIOTECA')}
<div class="kpis k3"><div class="kpi pur"><div class="kpi-lbl">Pastas</div><div class="kpi-val">${nodes.filter(n=>n.type==='folder').length}</div></div><div class="kpi b"><div class="kpi-lbl">Arquivos</div><div class="kpi-val">${files.length}</div></div><div class="kpi g"><div class="kpi-lbl">Tamanho</div><div class="kpi-val" style="font-size:16px">${fmtSize(files.reduce((s,f)=>s+(f.size||0),0))}</div></div></div>
<div class="sec"><div class="sec-ttl">Arquivos</div>
<table><thead><tr><th>#</th><th>Nome</th><th>Tipo</th><th>Tamanho</th><th>Caminho</th><th>Upload</th></tr></thead>
<tbody>${files.length===0?`<tr><td colspan="6" style="text-align:center;color:#999;padding:20px">Nenhum arquivo</td></tr>`:files.map((f,i)=>{const ext=f.name?.split('.').pop();return`<tr><td>${i+1}</td><td><strong>${esc(f.name)}</strong>${f.desc?`<br/><span style="color:#666">${esc(f.desc)}</span>`:''}</td><td><span class="bdg pur">${fileType(ext)}</span></td><td>${fmtSize(f.size)}</td><td style="font-size:10px;color:#666">📁 ${esc(getPath(f.parentId))}</td><td>${fmtDate(f.uploadedAt)}</td></tr>`;}).join('')}
</tbody></table></div>
<div class="footer">PCM Gest · Biblioteca · ${new Date().toLocaleString('pt-BR')}</div></body></html>`,'Índice da Biblioteca');
}

<tbody>${batteries.map(b=>{const m=machines.find(x=>x.id===b.machineId);const d=daysLeft(b.warranty);return`<tr><td style="font-family:monospace;font-weight:700">${esc(b.code)}</td><td><strong>${esc(b.brand||'')}</strong> ${esc(b.model||'')}</td><td>${esc(b.capacity||'—')}</td><td style="font-weight:700">${fmt(b.purchaseValue)}</td><td>${d===null?'—':d<0?`<span class="bdg err">Vencida</span>`:d<90?`<span class="bdg warn">${d}d</span>`:`<span class="bdg ok">Válida</span>`}</td><td>${m?esc(m.name):'Estoque'}</td></tr>`;}).join('')}
