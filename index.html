function updateOilPlanoStatus(id, novoStatus){
  const planos = getOilPlanos().map(p=>p.id===id?{...p,status:novoStatus}:p);
  saveOilPlanos(planos);
  toast(novoStatus==='concluido'?'Plano concluído! ✅':'Plano iniciado!','ok');
  render();
}

function deleteOilPlano(id){
  const planos = getOilPlanos().filter(p=>p.id!==id);
  saveOilPlanos(planos);
  toast('Plano removido.','warn');
  render();
}

function toggleOilPasso(planoId, passoId){
  const planos = getOilPlanos().map(p=>{
    if(p.id!==planoId) return p;
    const passos = (p.passos||[]).map(s=>s.id===passoId?{...s,done:!s.done}:s);
    const allDone = passos.every(s=>s.done);
    return {...p, passos, status: allDone?'concluido':(passos.some(s=>s.done)?'execucao':'pendente')};
  });
  saveOilPlanos(planos);
  render();
}

// ── CONFIG ──
// ═══════ S360 API ═══════
// SOLUÇÃO CORS: as chamadas passam pelo proxy local em servidor.py.
// O navegador acessa /api/s360/producao/... ou /api/s360/teste/... e o servidor encaminha para o ambiente S360 correspondente.
// O arquivo DEVE ser aberto via servidor.py, não por file:// nem por servidor HTTP simples.
const S360={
  _key:'oil_s360_cfg',
  envs:{producao:{label:'Produção',basePath:'/api/s360/producao',host:'https://api.s360web.com'},teste:{label:'Teste',basePath:'/api/s360/teste',host:'https://integration.s360web.com'}},
  getEnv(){const c=this.getCfg();return (c.environment==='teste'||c.environment==='producao')?c.environment:'producao'},
  setEnv(env){const c=this.getCfg();const novo=(env==='teste')?'teste':'producao';this.saveCfg({...c,environment:novo});return novo},
  getEnvInfo(){return this.envs[this.getEnv()]||this.envs.producao},
  base(){return window.location.origin+this.getEnvInfo().basePath},
  getCfg(){try{return JSON.parse(localStorage.getItem(this._key)||'{}')}catch(e){return{}}},
  saveCfg(c){localStorage.setItem(this._key,JSON.stringify(c))},
  getToken(){return this.getCfg().access_token||null},
  isConfigured(){return!!this.getToken()},

  // Requisição com tratamento robusto de erros
  async _req(url,options){
    try{
      const response=await fetch(url,{
        ...options,
        headers:{
          'Content-Type':'application/json',
          ...(options.headers||{})
        }
      });
      
      // Tratamento de status HTTP
      if(response.status===401)throw new Error('Credenciais inválidas (401). Verifique usuário e senha.');
      if(response.status===403)throw new Error('Acesso negado (403). Verifique as permissões da conta.');
      if(response.status===404)throw new Error('Endpoint não encontrado (404): '+url);
      if(response.status===500)throw new Error('Erro no servidor S360 (500). Tente novamente.');
      if(!response.ok)throw new Error('Erro HTTP '+response.status+': '+response.statusText);
      
      const data=await response.json();
      return data;
    }catch(e){
      // Melhor diagnóstico de erro
      const msg=e.message||'';
      if(msg.includes('Failed to fetch')||msg.includes('NetworkError')||msg.includes('CORS')){
        throw new Error('Erro de conexão. Verifique sua internet e tente novamente.');
      }
      throw e;
    }
  },

  async login(username,password){
    if(!username||!password)throw new Error('Usuário e senha são obrigatórios');
    
    const data=await this._req(this.base()+'/login',{
      method:'POST',
      body:JSON.stringify({username,password})
    });
    
    if(!data.access_token)throw new Error('Token não retornado pela API S360. Resposta: '+JSON.stringify(data));
    
    const environment=this.getEnv();
    this.saveCfg({...data,username,environment,saved_at:Date.now()});
    console.log('[S360] Login bem-sucedido para: '+username+' em '+environment);
    return data;
  },

  async authHeaders(){
    const cfg=this.getCfg();
    if(!cfg.access_token)throw new Error('Não autenticado — configure em Análise de Óleo → Configurações');
    return{
      'Content-Type':'application/json',
      'Authorization':'Bearer '+cfg.access_token
    };
  },

  async getEquipamentos(filtro){
    const h=await this.authHeaders();
    const data=await this._req(this.base()+'/v1/equipamento/list',{
      method:'POST',
      headers:h,
      body:JSON.stringify({ativo:true,maximoPorPagina:100,numeroPagina:1,...(filtro||{})})
    });
    if(!data.resultados)throw new Error('Formato inesperado na resposta de equipamentos');
    return data;
  },

  async getResultados(filtro){
    const h=await this.authHeaders();
    const hoje=new Date().toISOString().slice(0,10);
    const d30=new Date(Date.now()-30*24*60*60*1000).toISOString().slice(0,10);
    const data=await this._req(this.base()+'/v3/resultadoAmostra/list',{
      method:'POST',
      headers:h,
      body:JSON.stringify({statusLeitura:'TODOS',maximoPorPagina:50,numeroPagina:1,dataDe:d30,dataAte:hoje,...(filtro||{})})
    });
    if(!data.resultados)throw new Error('Formato inesperado na resposta de resultados');
    return data;
  },

  statusColor(s){return{NORMAL:'#22c55e',ATENCAO:'#f59e0b',ANORMAL:'#dc2626',CRITICO:'#ef4444',COLETADA:'#3b82f6',SEGREGADA:'#a855f7'}[s]||'#888';},
  statusIco(s){return{NORMAL:'✅',ATENCAO:'⚡',ANORMAL:'⚠️',CRITICO:'🛑',COLETADA:'🧪',SEGREGADA:'🔬'}[s]||'•';},
  
  // Teste de conectividade
  async testConnection(){
    try{
      const response=await fetch(this.base()+'/login',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({username:'__test__',password:'__test__'})
      });
      return response.status!==502&&response.status!==0;
    }catch(e){
      console.error('[S360] Teste de conexão falhou:',e.message);
      return false;
    }
  }
};

function s360ChangeEnv(){
  var env=document.getElementById('s360-env')?.value||'producao';
  var old=S360.getEnv();
  S360.setEnv(env);
  if(old!==env){
    localStorage.removeItem('s360_equipamentos');
    localStorage.removeItem('s360_resultados');
    localStorage.removeItem('s360_sync_at');
    toast('Ambiente S360 alterado para '+S360.getEnvInfo().label+'. Faça login novamente se necessário.','warn');
    APP.oilPage='config';render();
  }
}

async function s360TestConnection(){
  var statusEl=document.getElementById('s360-conn-status');
  function setStatus(msg,color){if(statusEl){statusEl.innerHTML='<div style="font-size:12px;padding:8px 12px;border-radius:7px;background:'+color+'15;border:1px solid '+color+'33;color:'+color+';margin-top:10px">'+msg+'</div>';}}
  var env=S360.getEnvInfo();
  setStatus('🔍 Testando conexão com a API S360 em '+env.label+' ('+env.host+')...','#3b82f6');
  try{
    var isConnected=await S360.testConnection();
    if(isConnected){
      setStatus('✓ Conexão OK! Você pode fazer login agora.','#22c55e');
      toast('Conexão com API S360 está funcionando!','ok');
    }else{
      setStatus('✕ Não foi possível conectar. Verifique sua conexão e tente novamente.','#ef4444');
      toast('Erro de conexão. Veja as instruções acima.','err');

    setStatus('✕ Erro: '+e.message,'#ef4444');

async function s360Login(){
  var user=document.getElementById('s360-user')?.value?.trim();
  var pass=document.getElementById('s360-pass')?.value;
  if(!user||!pass){toast('Preencha usuário e senha.','warn');return;}
  var btn=document.querySelector('button[onclick="s360Login()"]');
  var statusEl=document.getElementById('s360-conn-status');
  function setStatus(msg,color){if(statusEl){statusEl.innerHTML='<div style="font-size:12px;padding:8px 12px;border-radius:7px;background:'+color+'15;border:1px solid '+color+'33;color:'+color+';margin-top:10px">'+msg+'</div>';}}
  if(btn){btn.disabled=true;btn.textContent='🔄 Conectando...';}
  var envSel=document.getElementById('s360-env')?.value||S360.getEnv();
  S360.setEnv(envSel);
  var env=S360.getEnvInfo();
  setStatus('⏳ Conectando à API S360 em '+env.label+' ('+env.host+')...','#3b82f6');
  try{
    await S360.login(user,pass);
    setStatus('','transparent');
    toast('✓ Conectado à API S360!','ok');
    APP.oilPage='config';render();
  }catch(e){
    var msg=e.message||'';
    var isCred=msg.includes('401')||msg.includes('403')||msg.includes('credencial')||msg.includes('senha')||msg.includes('inválidas');
    var isHttp=msg.includes('HTTP')||msg.includes('Erro de conex');
    var hint='';
    if(isCred) hint='Verifique usuário, senha e ambiente selecionado. Credenciais de Teste normalmente não funcionam em Produção, e vice-versa.';
    else if(isHttp) hint='Erro de conexão com a API S360. Verifique suas credenciais.';
    else hint='Erro desconhecido. Verifique as instruções acima.';
    setStatus('✕ '+msg+'<br><span style="opacity:.8;font-size:11px">'+hint+'</span>','#ef4444');
    toast('Erro ao conectar: '+msg,'err');
    if(btn){btn.disabled=false;btn.textContent='🔐 Conectar à API S360';}
  }
}

  localStorage.removeItem('oil_s360_cfg');
  localStorage.removeItem('s360_equipamentos');
  localStorage.removeItem('s360_resultados');
  localStorage.removeItem('s360_sync_at');

  html+='<div style="font-size:11px;color:var(--muted2)">Sync: '+(syncAt?new Date(syncAt).toLocaleString('pt-BR'):'—')+' · '+equips.length+' equip.</div></div>';
  html+='<button class="btn btn-b btn-sm" onclick="s360SincronizarTudo()">↺ Atualizar</button></div>';
  html+='<div style="display:flex;flex-direction:column;gap:8px">';
  equips.forEach(function(eq){
    var res=s360res.filter(function(r){return r.idEquipamento===eq.id;});
    var ultimo=res.sort(function(a,b){return new Date(b.data)-new Date(a.data);})[0];
    var status=ultimo?ultimo.status:'SEM_DADO';
    var color=S360.statusColor(status);
    var ico=S360.statusIco(status);
    html+='<div style="background:var(--s2);border:1px solid '+color+'44;border-left:3px solid '+color+';border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">';
    html+='<div style="font-size:22px">'+ico+'</div>';
    html+='<div style="flex:1;min-width:150px">';
    html+='<div style="font-weight:600;font-size:13.5px">'+esc(eq.modelo||eq.tagFrota||'')+'</div>';
    html+='<div style="font-size:11px;color:var(--muted2)">'+esc(eq.tagFrota||'')+' · '+esc(eq.chassiSerie||'')+'</div>';
    html+='<div style="font-size:11px;color:var(--muted2)">'+(eq.setor?esc(eq.setor):'')+(eq.obra?(' · '+esc(eq.obra.nome)):'')+'</div>';
    html+='<div style="margin-top:5px;display:flex;gap:5px;flex-wrap:wrap">';
    html+='<span style="background:'+color+'15;color:'+color+';border:1px solid '+color+'33;border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700">'+status.replace('_',' ')+'</span>';
    html+='<span style="background:var(--s3);border:1px solid var(--border);border-radius:20px;padding:2px 8px;font-size:10px;color:var(--muted2)">'+res.length+' análise(s)</span>';
    if(ultimo)html+='<span style="background:var(--s3);border:1px solid var(--border);border-radius:20px;padding:2px 8px;font-size:10px;color:var(--muted2)">'+new Date(ultimo.data).toLocaleDateString('pt-BR')+'</span>';
    html+='</div></div></div>';
  });
  html+='</div></div>';
  return html;
}

function libNodes(){return DB.get('libTree')}
function libPath(nodeId){const nodes=libNodes();const path=[];let cur=nodeId;while(cur){const n=nodes.find(x=>x.id===cur);if(!n)break;path.unshift(n);cur=n.parentId}return path}
function libCountChildren(id){const nodes=libNodes();let c=0;function r(fid){nodes.filter(n=>n.parentId===fid).forEach(n=>{c++;if(n.type==='folder')r(n.id)})}r(id);return c}
function libSelectFolder(id){APP.libSelected=(id===null||id==='null')?null:id;APP.page='files';render()}
function libToggleFolder(id){if(!APP.libOpenFolders)APP.libOpenFolders={};
NET.init();APP.libOpenFolders[id]=!APP.libOpenFolders[id];render()}

function buildLibTree(){
  const nodes=libNodes();
  function renderFolder(parentId,depth){
    return nodes.filter(n=>n.type==='folder'&&n.parentId===(parentId||null)).map(f=>{
      const isOpen=APP.libOpenFolders[f.id],isSel=APP.libSelected===f.id;
      const childFolders=nodes.filter(n=>n.type==='folder'&&n.parentId===f.id).length;
      const total=nodes.filter(n=>n.parentId===f.id).length;
      return`<div>
        <div class="tree-item ${isSel?'selected':''}" style="padding-left:${12+depth*14}px" onclick="libSelectFolder('${f.id}')">
          <span class="toggle ${isOpen?'open':''}" onclick="event.stopPropagation();libToggleFolder('${f.id}')">${childFolders?'▶':''}</span>
          <span class="ico">${isOpen?'📂':'📁'}</span><span class="lbl">${esc(f.name)}</span>
          ${total?`<span class="cnt">${total}</span>`:''}
        </div>
        ${isOpen?`<div>${renderFolder(f.id,depth+1)}</div>`:''}
      </div>`;
    }).join('');
  }
  return`<div class="lib-tree">
    <div class="tree-item ${!APP.libSelected?'selected':''}" style="padding-left:12px" onclick="libSelectFolder(null)">
      <span class="toggle"></span><span class="ico">🏠</span><span class="lbl">Raiz</span>
    </div>${renderFolder(null,0)}
  </div>`}

function buildLibBrowser(){
  const nodes=libNodes(),parentId=APP.libSelected||null;
  const folders=nodes.filter(n=>n.parentId===parentId&&n.type==='folder');
  const files=nodes.filter(n=>n.parentId===parentId&&n.type==='file');
  const path=parentId?libPath(parentId):[];
  return`<div class="breadcrumb"><span onclick="libSelectFolder(null)">🏠 Raiz</span>${path.map((n,i)=>`<span class="sep">/</span><span class="${i===path.length-1?'cur':''}" onclick="libSelectFolder('${n.id}')">${esc(n.name)}</span>`).join('')}</div>
  <div class="shdr" style="margin-bottom:10px">
    <div style="font-size:13px;color:var(--muted2)">${folders.length} pasta${folders.length!==1?'s':''} · ${files.length} arquivo${files.length!==1?'s':''}</div>
    <div style="display:flex;gap:6px">
      <button class="btn btn-gh btn-sm" onclick="openNewFolderModal(${parentId?`'${parentId}'`:'null'})">📁 Nova Pasta</button>
      <button class="btn btn-p btn-sm" onclick="openUploadModal(${parentId?`'${parentId}'`:'null'})">⬆ Upload</button>
    </div>
  </div>
  ${folders.length===0&&files.length===0?`<div class="empty" style="padding:50px"><div class="ei">📂</div><p>Pasta vazia. Crie subpastas ou faça upload.</p></div>`:`
  ${folders.length>0?`<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:8px">Pastas</div>
  <div class="file-grid" style="margin-bottom:18px">
    ${folders.map(f=>{const sub=nodes.filter(n=>n.parentId===f.id).length;return`<div class="file-card" onclick="libSelectFolder('${f.id}')" oncontextmenu="libCtxMenu(event,'${f.id}','folder')">
      <div class="file-ico">📁</div><div class="file-name">${esc(f.name)}</div><div class="file-meta">${sub} item${sub!==1?'s':''}</div>
      <div class="file-actions" onclick="event.stopPropagation()">
        <button class="btn btn-gh btn-sm" onclick="openRenameFolderModal('${f.id}')">✏</button>
        <button class="btn btn-d btn-sm" onclick="libDelFolder('${f.id}')">✕</button>
      </div>

async function libDelFolder(id){

  const nodes=libNodes();const toDelete=[];
  function collect(fid){nodes.filter(n=>n.parentId===fid).forEach(n=>{toDelete.push(n.id);if(n.type==='folder')collect(n.id)});}

function libHandleFiles(fileList,parentId){
  const pid=(parentId===null||parentId==='null')?null:parentId;
  const desc=qval('fdesc');
  const MAX_SIZE = 4 * 1024 * 1024; // 4MB limite seguro para localStorage
  let added=0, errors=0;
  const files = Array.from(fileList);
  let processed = 0;

  files.forEach(file=>{
    // Verificar tamanho antes de ler
    if(file.size > MAX_SIZE){
      errors++;
      processed++;
      const prev=document.getElementById('upload-preview');
      if(prev)prev.innerHTML=`<div class="infobox" style="margin-top:8px;font-size:12px;color:var(--red)">✕ "${file.name}" é grande demais (${(file.size/1024/1024).toFixed(1)}MB). Limite: 4MB.</div>`;
      toast(`"${file.name}" grande demais — máx 4MB.`,'err');
      return;
    }

    const reader=new FileReader();
    reader.onerror=()=>{
      errors++;
      processed++;
      toast(`Erro ao ler "${file.name}".`,'err');
    };
    reader.onload=async e=>{
      try{
        const ext = file.name.split('.').pop().toLowerCase();
        const node={
          id:uid(),
          name:file.name,
          type:'file',
          parentId:pid,
          size:file.size,
          uploadedAt:new Date().toISOString(),
          desc: desc||'',
          ext,
          mimeType: file.type||'',
          data:e.target.result  // base64 — salvo só no localStorage
        };
        // Salvar no localStorage (com data)
        const fresh=libNodes();
        fresh.push(node);
        LOCAL.set('libTree',fresh);
        // Salvar no Firestore SEM o data (evita limite 1MB)
        const nodeForFS={...node};
        delete nodeForFS.data;
        await FB.set('libTree',node.id,nodeForFS);
        added++;
        processed++;
        if(pid)APP.libOpenFolders[pid]=true;
        const prev=document.getElementById('upload-preview');
        if(prev){
          const icon = fileIcon(ext);
          const size = file.size < 1024 ? file.size+'B' : file.size < 1024*1024 ? (file.size/1024).toFixed(0)+'KB' : (file.size/1024/1024).toFixed(1)+'MB';
          prev.innerHTML=`<div class="infobox" style="margin-top:8px;font-size:12px;color:var(--green)">✓ ${added} arquivo${added>1?'s':''} adicionado${added>1?'s':''}: ${icon} ${esc(file.name)} (${size})</div>`;
        }
        toast(`${file.name} adicionado!`,'ok');
        render();
      }catch(err){
        errors++;
        processed++;
        console.error('libHandleFiles error:',err);
        toast(`Erro ao salvar "${file.name}": ${err.message||'tente novamente'}`,'err');
      }
    };
    // Ler como DataURL (base64) — funciona para todos os tipos incluindo .docx
    reader.readAsDataURL(file);
  });
}

function libDownload(id){
  const f=libNodes().find(n=>n.id===id);
  if(!f)return toast('Arquivo não encontrado.','err');
  if(!f.data){
    // Tentar buscar do Firebase
    toast('Buscando arquivo...','info');
    FB.get('libTree',id).then(node=>{
      if(node&&node.data){
        const a=document.createElement('a');a.href=node.data;a.download=f.name;document.body.appendChild(a);a.click();a.remove();
        toast('Download: '+f.name,'ok');
      } else {
        toast('Arquivo sem conteúdo — reenvie o arquivo.','err');
      }
    }).catch(()=>toast('Erro ao baixar arquivo.','err'));
    return;
  }
  const a=document.createElement('a');
  a.href=f.data;
  a.download=f.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  toast('Download: '+f.name,'ok');
}

async function saveMachine(id){

async function saveBat(id){

}

  if(DB.find('batteries',id)?.machineId)return toast('Bateria alocada.','err');
  if(!await customConfirm({title:'Excluir Bateria',msg:'Esta ação não pode ser desfeita.',icon:'🔋',confirmLabel:'Sim, excluir'}))return;await DB.remove('batteries',id);toast('Removida.');render();
}

function openAllocModal(){
  const batteries=DB.get('batteries'),machines=DB.get('machines');
  const stock=batteries.filter(b=>!b.machineId);
  const free=machines.filter(m=>!batteries.some(b=>b.machineId===m.id));
  openModal(`<div class="modal fb"><div class="mtitle b">🔄 Alocar Bateria</div>
    <div class="frow c2">
      <div><label>Bateria *</label><select id="fbat"><option value="">Selecione...</option>${stock.map(b=>`<option value="${b.id}">${esc(b.code)} — ${esc(b.brand||'')} ${esc(b.capacity||'')}</option>`).join('')}</select>${stock.length===0?`<div class="herr">Nenhuma em estoque.</div>`:''}</div>
      <div><label>Máquina *</label><select id="fmach"><option value="">Selecione...</option>${free.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select>${free.length===0?`<div class="herr">Todas têm bateria.</div>`:''}</div>

async function saveAlloc(){
  const batId=qval('fbat'),machId=qval('fmach');
  if(!batId)return toast('Selecione bateria.','err');
  if(!machId)return toast('Selecione máquina.','err');
  await DB.update('batteries',batId,{machineId:machId});
  await DB.add('batHist',{id:uid(),batId,machId,action:'alocada',date:nowDT()});
  closeModal();toast('Alocada!');render();
}

async function deallocBat(batId){
  const b=DB.find('batteries',batId);if(!b)return;
  if(!await customConfirm({title:'Remover Bateria',msg:'Desalocar esta bateria da máquina?',icon:'🔋',confirmLabel:'Remover',type:'warn'}))return;
  await DB.add('batHist',{id:uid(),batId,machId:b.machineId,action:'removida',date:nowDT()});
  await DB.update('batteries',batId,{machineId:null});
  toast('Desalocada.');render();
}

function termoCSS(){return`<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet"/><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'DM Sans',Arial,sans-serif;background:#fff;color:#111;padding:32px 40px;font-size:13px;line-height:1.55;max-width:760px;margin:0 auto}.hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;padding-bottom:14px;border-bottom:2px solid #000}.logo{font-family:'Bebas Neue',Arial,sans-serif;font-size:26px}.logo span{color:#e8a000}.doc-num{text-align:right;font-size:12px;color:#666}.doc-num strong{display:block;font-size:16px;color:#000;font-family:'Bebas Neue',Arial,sans-serif}.sec{margin-bottom:16px}.sec-ttl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:#999;margin-bottom:7px;padding-bottom:3px;border-bottom:1px solid #eee}.grid{display:grid;gap:10px;margin-bottom:6px}.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:1fr 1fr 1fr}.fld label{font-size:9px;color:#888;text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:3px}.fld p{font-size:13px;font-weight:600;padding:6px 10px;background:#f4f4f4;border-radius:4px;min-height:30px}.terms{font-size:12px;color:#333;line-height:1.75;padding:14px 16px;background:#f9f9f9;border-radius:5px;border-left:3px solid #000}.sigs{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-top:30px}.sig-line{border-top:1px solid #999;margin-top:54px;padding-top:5px;font-size:11px;color:#666;text-align:center}.footer{margin-top:22px;padding-top:10px;border-top:1px solid #ddd;font-size:10px;color:#aaa;text-align:center}table{width:100%;border-collapse:collapse}thead tr{background:#111;color:#fff}th{padding:9px 10px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase}td{padding:8px 10px;border-bottom:1px solid #eee}.tfoot-row td{background:#f4f4f4;font-weight:700;padding:9px 10px}</style>`}

<div class="footer">PCM Gest · ${new Date().toLocaleString('pt-BR')} · ${num}</div>
</body></html>`,`Termo — ${tool.name} / ${mech.name}`);
}

<tbody>${items.map((x,i)=>`<tr><td>${i+1}</td><td><strong>${esc(x.tool.name)}</strong></td><td>${esc(x.tool.category||'—')}</td><td style="font-family:monospace;font-size:11px">${esc(x.tool.serial||'—')}</td><td style="font-weight:700;text-align:right">${fmt(x.tool.value)}</td><td style="font-size:11px">${fmtD(x.loan.loanDate)}</td></tr>`).join('')}

<div class="footer">PCM Gest · ${new Date().toLocaleString('pt-BR')} · ${num} · Total: ${fmt(total)}</div>
</body></html>`,`Termo — ${mech.name}`);
}

      seedFallback();
    }
  }catch(e){
    // Falhou — usa localStorage existente ou seed

async function openOilPlanoModalIA(motorId){
  const m = typeof OIL_MOTORES !== 'undefined' ? OIL_MOTORES.find(x=>x.id===motorId) : null;
  if(!m){ openOilPlanoModal(motorId); return; }
  toast('Gerando plano com IA...','info');
  let acoes = [];
  if(m.params.ferro > m.limites.ferro[1])         acoes.push({acao:'Troca imediata de óleo e filtro — Ferro crítico ('+m.params.ferro+' ppm > limite '+m.limites.ferro[1]+')',prioridade:'critico',prazo:3});
  if(m.params.acidez > m.limites.acidez[1])        acoes.push({acao:'Análise complementar acidez TAN — risco de corrosão interna (TAN='+m.params.acidez+')',prioridade:'critico',prazo:2});
  if(m.params.viscosidade > m.limites.viscosidade[1]) acoes.push({acao:'Investigar superaquecimento — viscosidade acima do limite ('+m.params.viscosidade+' cSt)',prioridade:'anormal',prazo:5});
  if(m.params.silicio > m.limites.silicio[1])      acoes.push({acao:'Verificar vedações e filtro de ar — contaminação por silício ('+m.params.silicio+' ppm)',prioridade:'anormal',prazo:7});
  if(m.params.agua > m.limites.agua[1])            acoes.push({acao:'Inspecionar sistema de arrefecimento — presença de água no óleo ('+m.params.agua+'%)',prioridade:'critico',prazo:1});
  if(m.rul <= 20)                                  acoes.push({acao:'Programar revisão geral do motor — RUL crítico ('+m.rul+'% restante)',prioridade:'critico',prazo:14});
  if(acoes.length === 0) acoes.push({acao:'Manter monitoramento periódico — parâmetros dentro do esperado',prioridade:'normal',prazo:30});
  const planos = getOilPlanos();
  const hoje = new Date();
  acoes.forEach(a=>{
    const prazo = new Date(hoje); prazo.setDate(prazo.getDate()+a.prazo);
    planos.push({id:uid(),motorId,acao:a.acao,responsavel:'A definir',prazo:prazo.toISOString().slice(0,10),prioridade:a.prioridade,obs:'Gerado automaticamente pela análise IA com base nos parâmetros do laudo.',status:'pendente',criadoEm:new Date().toISOString(),geradoPorIA:true,passo:0,passos:gerarPassosExecucao(a.acao,m)});
  });
  saveOilPlanos(planos);
  toast(acoes.length+' ações criadas pelo plano IA!','ok');
  APP.oilPage='planos'; render();
}

  html += '<div style="font-size:12.5px;color:var(--muted2)">Concentrar esforços nas <strong style="color:var(--text)">4 primeiras causas</strong> elimina <strong style="color:#ef4444">81% das ocorrências</strong>: (1) controle de intervalo de troca, (2) manutenção de filtro de ar, (3) análise periódica de silício, (4) monitoramento de temperatura.</div>';
  html += '</div></div>';
  html += '<div class="card"><div class="ctitle">🔍 Causas por Motor</div>';
  html += '<div style="overflow-x:auto;margin-top:12px"><table><thead><tr><th>Motor</th><th>Principal Causa</th><th>Ocorrências</th><th>Status Atual</th><th>Ação</th></tr></thead><tbody>';
  var motoresDados = [
    {motor:'Gerador Cummins QSB6.7',causa:'Filtro ar + Água no óleo',occ:8,status:'critico'},
    {motor:'Trator John Deere 8520',causa:'Intervalo troca + Acidez',occ:7,status:'critico'},
    {motor:'Bomba KSB 150',causa:'Viscosidade baixa',occ:5,status:'atencao'},
    {motor:'Colheitadeira New Holland',causa:'Ferro elevado',occ:4,status:'anormal'},
    {motor:'Trator Massey Ferguson',causa:'Monitoramento preventivo',occ:2,status:'normal'},
  ];
  motoresDados.forEach(function(m){
    var sc = {critico:'#ef4444',anormal:'#dc2626',atencao:'#f59e0b',normal:'#22c55e'}[m.status]||'#888';
    html += '<tr>';
    html += '<td><strong>'+m.motor+'</strong></td>';
    html += '<td style="color:var(--muted2)">'+m.causa+'</td>';
    html += '<td style="font-weight:600;color:'+sc+'">'+m.occ+'</td>';
    html += '<td><span style="background:'+sc+'15;color:'+sc+';border:1px solid '+sc+'33;border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700">'+m.status.toUpperCase()+'</span></td>';
    html += '<td><button class="btn btn-gh btn-sm" onclick="APP.oilPage=\'causaraiz\';render()">🌳 Ver Causa Raiz</button></td>';
    html += '</tr>';
  });
  html += '</tbody></table></div></div>';
  return html;
}
