(async()=>{
  // Mostra tela de loading enquanto busca dados
  document.getElementById('root').innerHTML=`
    <div style="height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);gap:16px">
      <div style="font-family:var(--disp);font-size:48px;letter-spacing:2px">PCM <span style="color:var(--gold)">GEST</span></div>

        Carregando dados...
      </div>
    </div>`;

  // Tenta sincronizar Firebase com timeout de 6s
  try{
    const total=await Promise.race([
      DB.syncAll(),
      new Promise((_,r)=>setTimeout(()=>r('timeout'),6000))
    ]);
    if(typeof total==='number' && total>0){
      // Dados vieram do Firebase — não precisa de seed
      console.log(`Firebase: ${total} registros carregados`);
    } else {
      // Firebase vazio ou timeout — usa localStorage ou seed de exemplo
      seedFallback();
    }
  }catch(e){
    // Falhou — usa localStorage existente ou seed
    seedFallback();
  }

  // Renderiza agora com os dados corretos
  render();
})();

async function openOilPlanoModalIA(motorId){
  const m = typeof OIL_MOTORES !== 'undefined' ? OIL_MOTORES.find(x=>x.id===motorId) : null;
  if(!m){ openOilPlanoModal(motorId); return; }
  toast('Gerando plano com IA...','info');
  let acoes = [];
  if(m.params.ferro > m.limites.ferro[1])         acoes.push({acao:'Troca imediata de óleo e filtro — Ferro crítico ('+m.params.ferro+' ppm > limite '+m.limites.ferro[1]+')',prioridade:'critico',prazo:3});
  if(m.params.acidez > m.limites.acidez[1])        acoes.push({acao:'Análise complementar acidez TAN — risco de corrosão interna (TAN='+m.params.acidez+')',prioridade:'critico',prazo:2});
  if(m.params.viscosidade > m.limites.viscosidade[1]) acoes.push({acao:'Investigar superaquecimento — viscosidade acima do limite ('+m.params.viscosidade+' cSt)',prioridade:'anormal',prazo:5});
  if(m.params.silicio > m.limites.silicio[1])      acoes.push({acao:'Verificar vedações e filtro de ar — contaminação por silício ('+m.params.silicio+' ppm)',prioridade:'anormal',prazo:7});
  if(m.params.agua > m.limites.agua[1])            acoes.push({acao:'Inspecionar sistema de arrefecimento — presença de água no óleo ('+m.params.agua+'%)',prioridade:'critico',prazo:1});
  if(m.rul <= 20)                                  acoes.push({acao:'Programar revisão geral do motor — RUL crítico ('+m.rul+'% restante)',prioridade:'critico',prazo:14});
  if(acoes.length === 0) acoes.push({acao:'Manter monitoramento periódico — parâmetros dentro do esperado',prioridade:'normal',prazo:30});
  const planos = getOilPlanos();
  const hoje = new Date();
  acoes.forEach(a=>{
    const prazo = new Date(hoje); prazo.setDate(prazo.getDate()+a.prazo);
    planos.push({id:uid(),motorId,acao:a.acao,responsavel:'A definir',prazo:prazo.toISOString().slice(0,10),prioridade:a.prioridade,obs:'Gerado automaticamente pela análise IA com base nos parâmetros do laudo.',status:'pendente',criadoEm:new Date().toISOString(),geradoPorIA:true,passo:0,passos:gerarPassosExecucao(a.acao,m)});
  });
  saveOilPlanos(planos);
  toast(acoes.length+' ações criadas pelo plano IA!','ok');
  APP.oilPage='planos'; render();
}

  ]},
};

function buildOilCausaRaiz(){
  var falhaId = APP.oilFalhaId || 'F001';
  var cr = OIL_CAUSARAIZ[falhaId];
  var falha = OIL_FALHAS.find(function(f){ return f.id===falhaId; });
  var html = '<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">';
  html += '<button class="btn btn-gh btn-sm" onclick="APP.oilPage=\'falha\';render()">← Análise de Falha</button>';
  html += '<div style="display:flex;gap:6px;flex-wrap:wrap">';
  OIL_FALHAS.filter(function(f){ return OIL_CAUSARAIZ[f.id]; }).forEach(function(f){
    html += '<button class="btn '+(f.id===falhaId?'btn-g':'btn-gh')+' btn-sm" onclick="APP.oilFalhaId=\''+f.id+'\';render()">'+f.tipo.split(' ').slice(0,2).join(' ')+'</button>';
  });
  html += '</div></div>';
  if(!cr){
    return html + '<div class="card"><div class="empty"><div class="ei">🌳</div><p>Análise de causa raiz não disponível para esta falha.</p></div></div>';
  }
  html += '<div class="card" style="margin-bottom:16px"><div class="ctitle">🌳 Análise de Causa Raiz — 5 Porquês</div>';
  html += '<div style="font-size:13px;font-weight:600;color:var(--text);margin:8px 0 16px">'+cr.titulo+'</div>';
  cr.porques.forEach(function(p, i){
    var pct = Math.round((i+1)/5*100);
    html += '<div style="display:flex;gap:12px;margin-bottom:16px">';
    html += '<div style="display:flex;flex-direction:column;align-items:center;gap:0">';
    html += '<div style="width:32px;height:32px;border-radius:50%;background:#14b8a6;color:#000;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:16px;font-weight:700;flex-shrink:0">'+p.n+'</div>';
    if(i<4) html += '<div style="width:2px;flex:1;background:var(--border);min-height:20px;margin-top:4px"></div>';
    html += '</div>';
    html += '<div style="flex:1;padding-bottom:'+(i<4?'8px':'0')+'">';
    html += '<div style="font-size:11px;font-weight:700;color:#14b8a6;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px">Por que '+p.n+'?</div>';
    html += '<div style="background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:10px 14px">';
    html += '<div style="font-size:12px;color:var(--muted2);margin-bottom:4px">'+p.pergunta+'</div>';
    html += '<div style="font-size:13px;font-weight:600;color:var(--text)">→ '+p.resposta+'</div>';
    html += '</div></div></div>';
  });
  html += '<div style="background:#14b8a615;border:2px solid #14b8a644;border-radius:10px;padding:16px;margin-top:8px">';
  html += '<div style="font-size:11px;font-weight:700;color:#14b8a6;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">🎯 CAUSA RAIZ IDENTIFICADA</div>';
  html += '<div style="font-size:13.5px;font-weight:600;color:var(--text);line-height:1.6">'+cr.causaRaiz+'</div>';
  html += '</div></div>';
  html += '<div class="card"><div class="ctitle">📋 Ações para Eliminação da Causa Raiz</div>';
  html += '<div style="overflow-x:auto;margin-top:12px"><table><thead><tr><th>#</th><th>Ação Corretiva / Preventiva</th><th>Prazo</th><th>Responsável</th></tr></thead><tbody>';
  cr.acoes.forEach(function(a, i){
    html += '<tr><td style="font-weight:700;color:#14b8a6">'+(i+1)+'</td><td>'+a.desc+'</td><td style="font-weight:600;color:var(--gold)">'+a.prazo+'</td><td>'+a.resp+'</td></tr>';
  });
  html += '</tbody></table></div></div>';
  return html;
}

// ── PARETO DE FALHAS ──
function buildOilPareto(){
  var dados = [
    {causa:'Intervalo troca óleo ultrapassado',ocorrencias:18,pct:32,acumulado:32,cor:'#ef4444'},
    {causa:'Filtro ar danificado/vencido',ocorrencias:12,pct:21,acumulado:53,cor:'#f87171'},
    {causa:'Contaminação por silício',ocorrencias:9,pct:16,acumulado:69,cor:'#f59e0b'},
    {causa:'Superaquecimento do motor',ocorrencias:7,pct:12,acumulado:81,cor:'#fbbf24'},
    {causa:'Diluição por combustível',ocorrencias:5,pct:9,acumulado:90,cor:'#22c55e'},
    {causa:'Falha no arrefecimento',ocorrencias:3,pct:5,acumulado:95,cor:'#3b82f6'},
    {causa:'Outras causas',ocorrencias:3,pct:5,acumulado:100,cor:'#6b7280'},
  ];
  var total = dados.reduce(function(s,d){ return s+d.ocorrencias; }, 0);
  var maxOcc = dados[0].ocorrencias;
  var html = '';
  html += '<div class="kgrid k4" style="margin-bottom:16px">';
  html += '<div class="kpi"><div class="kbar" style="background:#ef4444"></div><div class="klbl">Total Ocorrências</div><div class="kval" style="color:#ef4444">'+total+'</div><div class="ksub">Últimos 12 meses</div></div>';
  html += '<div class="kpi"><div class="kbar" style="background:var(--gold)"></div><div class="klbl">Top 2 Causas</div><div class="kval" style="color:var(--gold)">53%</div><div class="ksub">Das ocorrências</div></div>';
  html += '<div class="kpi"><div class="kbar" style="background:#14b8a6"></div><div class="klbl">Top 4 Causas</div><div class="kval" style="color:#14b8a6">81%</div><div class="ksub">Regra de Pareto (80/20)</div></div>';
  html += '<div class="kpi"><div class="kbar" style="background:var(--green)"></div><div class="klbl">Motores Afetados</div><div class="kval" style="color:var(--green)">5</div><div class="ksub">Com ocorrências registradas</div></div>';
  html += '</div>';
  html += '<div class="card" style="margin-bottom:16px"><div class="ctitle">📊 Diagrama de Pareto — Causas de Falha por Análise de Óleo</div>';
  html += '<div style="font-size:11px;color:var(--muted2);margin-bottom:16px">Últimos 12 meses · '+total+' ocorrências analisadas · Linha vermelha = 80% acumulado</div>';
  html += '<div style="position:relative;padding:0 0 40px">';
  dados.forEach(function(d, i){
    var barH = Math.round(d.ocorrencias/maxOcc*160);
    var accH = Math.round(d.acumulado/100*160);
    html += '<div style="display:inline-block;vertical-align:bottom;width:calc('+Math.round(100/dados.length)+'% - 8px);margin:0 4px;text-align:center">';
    html += '<div style="font-size:11px;font-weight:700;color:'+d.cor+';margin-bottom:2px">'+d.ocorrencias+'</div>';
    html += '<div style="height:'+barH+'px;background:'+d.cor+';border-radius:4px 4px 0 0;position:relative;transition:height .4s"></div>';
    html += '<div style="font-size:9px;color:var(--muted2);margin-top:4px;line-height:1.3;word-break:break-word">'+d.causa.split(' ').slice(0,3).join(' ')+'</div>';
    html += '</div>';
  });
  html += '</div>';
  html += '<div style="overflow-x:auto;margin-top:16px"><table>';
  html += '<thead><tr><th>#</th><th>Causa</th><th>Ocorrências</th><th>%</th><th>% Acumulado</th><th>Prioridade</th></tr></thead><tbody>';
  dados.forEach(function(d, i){
    var prior = d.acumulado <= 80 ? '<span style="background:#ef444415;color:#ef4444;border:1px solid #ef444433;border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700">ALTA</span>' :
                d.acumulado <= 95 ? '<span style="background:#f59e0b15;color:#fcd34d;border:1px solid #f59e0b33;border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700">MÉDIA</span>' :
                '<span style="background:#6b728015;color:#9ca3af;border:1px solid #6b728033;border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700">BAIXA</span>';
    html += '<tr>';
    html += '<td style="font-weight:700;color:'+d.cor+'">'+(i+1)+'</td>';
    html += '<td><strong>'+d.causa+'</strong></td>';
    html += '<td style="font-weight:600">'+d.ocorrencias+'</td>';
    html += '<td>'+d.pct+'%</td>';
    html += '<td><div style="display:flex;align-items:center;gap:6px"><div style="width:60px;height:5px;background:var(--s3);border-radius:3px;overflow:hidden"><div style="width:'+d.acumulado+'%;height:100%;background:'+d.cor+';border-radius:3px"></div></div>'+d.acumulado+'%</div></td>';
    html += '<td>'+prior+'</td>';
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  html += '<div style="margin-top:16px;background:#ef444415;border:1px solid #ef444433;border-radius:8px;padding:12px">';
  html += '<div style="font-size:11px;font-weight:700;color:#ef4444;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">🎯 Foco de Ação — Princípio 80/20</div>';
  html += '<div style="font-size:12.5px;color:var(--muted2)">Concentrar esforços nas <strong style="color:var(--text)">4 primeiras causas</strong> elimina <strong style="color:#ef4444">81% das ocorrências</strong>: (1) controle de intervalo de troca, (2) manutenção de filtro de ar, (3) análise periódica de silício, (4) monitoramento de temperatura.</div>';
  html += '</div></div>';
  html += '<div class="card"><div class="ctitle">🔍 Causas por Motor</div>';
  html += '<div style="overflow-x:auto;margin-top:12px"><table><thead><tr><th>Motor</th><th>Principal Causa</th><th>Ocorrências</th><th>Status Atual</th><th>Ação</th></tr></thead><tbody>';
  var motoresDados = [
    {motor:'Gerador Cummins QSB6.7',causa:'Filtro ar + Água no óleo',occ:8,status:'critico'},
    {motor:'Trator John Deere 8520',causa:'Intervalo troca + Acidez',occ:7,status:'critico'},
    {motor:'Bomba KSB 150',causa:'Viscosidade baixa',occ:5,status:'atencao'},
    {motor:'Colheitadeira New Holland',causa:'Ferro elevado',occ:4,status:'anormal'},
    {motor:'Trator Massey Ferguson',causa:'Monitoramento preventivo',occ:2,status:'normal'},
  ];
  motoresDados.forEach(function(m){
    var sc = {critico:'#ef4444',anormal:'#f87171',atencao:'#f59e0b',normal:'#22c55e'}[m.status]||'#888';
    html += '<tr>';
    html += '<td><strong>'+m.motor+'</strong></td>';
    html += '<td style="color:var(--muted2)">'+m.causa+'</td>';
    html += '<td style="font-weight:600;color:'+sc+'">'+m.occ+'</td>';
    html += '<td><span style="background:'+sc+'15;color:'+sc+';border:1px solid '+sc+'33;border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700">'+m.status.toUpperCase()+'</span></td>';
    html += '<td><button class="btn btn-gh btn-sm" onclick="APP.oilPage=\'causaraiz\';render()">🌳 Ver Causa Raiz</button></td>';
    html += '</tr>';
  });
  html += '</tbody></table></div></div>';
  return html;
}
</script>
